<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1450" viewBox="0 0 900 1450" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba detects a longer gap between feeds than usual</title>
  <desc id="desc">A timeline shows a two-hour-ten-minute personal average, a current three-hour-thirty-minute gap, the relative and absolute thresholds, and the final instruction to check the baby rather than obey the clock.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf6"/><stop offset="1" stop-color="#eef8f4"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff8c79"/><stop offset="1" stop-color="#ef6f75"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#35293f" flood-opacity=".12"/></filter>
    <style>
      .ink{fill:#342b46}.soft{fill:#6b6374}.white{fill:#fff}.card{fill:#fff;stroke:#eadfe8;stroke-width:2}.eyebrow{font:700 19px Arial,sans-serif;letter-spacing:2px}.h1{font:700 45px Arial,sans-serif}.h2{font:700 25px Arial,sans-serif}.body{font:400 20px Arial,sans-serif}.small{font:400 17px Arial,sans-serif}.micro{font:400 15px Arial,sans-serif}.num{font:700 23px Arial,sans-serif}.time{font:700 31px Arial,sans-serif}.line{stroke:#cdb7da;stroke-width:7;stroke-linecap:round}.dash{stroke:#d9cadf;stroke-width:4;stroke-dasharray:9 10}
    </style>
  </defs>
  <rect width="900" height="1450" rx="42" fill="url(#bg)"/>
  <circle cx="796" cy="83" r="112" fill="#ffd9d1" opacity=".72"/><circle cx="78" cy="1371" r="128" fill="#dff3ec" opacity=".85"/>
  <text x="62" y="78" class="eyebrow" fill="#d85e62">INSIDE THE FLUTTER APP</text>
  <text x="62" y="140" class="h1 ink">A pattern,</text><text x="62" y="194" class="h1 ink">not permission</text>
  <text x="62" y="234" class="body soft">The clock raises the question. The baby decides the response.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="278" width="790" height="232" rx="28" class="card"/>
    <rect x="82" y="305" width="205" height="38" rx="19" fill="#eee5fa"/>
    <text x="103" y="331" class="small" fill="#745b94">PREVIOUS 14 DAYS</text>
    <text x="82" y="384" class="h2 ink">Build this baby’s daytime milk rhythm</text>
    <text x="82" y="423" class="body soft">At least 10 valid gaps · breast + bottle · solids excluded</text>
    <line x1="109" y1="468" x2="783" y2="468" class="line"/>
    <circle cx="109" cy="468" r="15" fill="#826ca4"/><circle cx="446" cy="468" r="15" fill="#826ca4"/><circle cx="783" cy="468" r="15" fill="#826ca4"/>
    <text x="324" y="458" class="small soft">average gap</text><text x="349" y="494" class="time ink">2h 10m</text>
  </g>

  <path d="M450 512v44" class="dash"/><path d="M438 548l12 14 12-14" fill="none" stroke="#cdb7da" stroke-width="5" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="55" y="569" width="790" height="264" rx="28" class="card"/>
    <rect x="82" y="596" width="118" height="38" rx="19" fill="#dff3ec"/>
    <text x="108" y="622" class="small" fill="#397c6d">TODAY</text>
    <text x="82" y="673" class="h2 ink">Two feeds anchor the day</text>
    <line x1="112" y1="737" x2="780" y2="737" class="line"/>
    <circle cx="112" cy="737" r="16" fill="#ef7470"/><circle cx="337" cy="737" r="16" fill="#ef7470"/><circle cx="780" cy="737" r="20" fill="#342b46"/>
    <text x="85" y="785" class="body ink">7:00</text><text x="301" y="785" class="body ink">8:30</text><text x="738" y="785" class="body ink">12:00</text>
    <text x="495" y="716" class="small soft">current gap</text><text x="502" y="758" class="time ink">3h 30m</text>
    <text x="82" y="813" class="micro soft">Only logged daytime milk feeds enter this comparison.</text>
  </g>

  <path d="M450 835v44" class="dash"/><path d="M438 871l12 14 12-14" fill="none" stroke="#cdb7da" stroke-width="5" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="55" y="892" width="790" height="195" rx="28" class="card"/>
    <text x="82" y="936" class="h2 ink">Both stretch gates must pass</text>
    <circle cx="105" cy="984" r="23" fill="#fff0c9"/><text x="98" y="992" class="num" fill="#98731f">1</text>
    <text x="145" y="991" class="body soft">3h 30m &gt; 1.5 × 2h 10m</text>
    <circle cx="105" cy="1036" r="23" fill="#ffe0da"/><text x="98" y="1044" class="num" fill="#c45c59">2</text>
    <text x="145" y="1043" class="body soft">+80m is at least 45m longer</text>
  </g>

  <path d="M450 1089v44" class="dash"/><path d="M438 1125l12 14 12-14" fill="none" stroke="#cdb7da" stroke-width="5" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="55" y="1146" width="790" height="148" rx="28" fill="url(#coral)"/>
    <text x="84" y="1194" class="h2 white">A longer gap between feeds than usual</text>
    <text x="84" y="1231" class="body white">Maya usually feeds about every 2h 10m…</text>
    <rect x="84" y="1250" width="158" height="30" rx="15" fill="#fff" opacity=".94"/>
    <text x="101" y="1271" class="micro" fill="#8a5058">from 12 gaps</text>
  </g>

  <rect x="55" y="1330" width="790" height="78" rx="23" fill="#342b46"/>
  <text x="82" y="1361" class="body white">Then check cues, the shared log and wet nappies.</text>
  <text x="82" y="1391" class="small" fill="#ffe0d9">Offer responsively. A personal average is never a feeding schedule.</text>
</svg>
