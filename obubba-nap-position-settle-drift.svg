<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba detects that one nap is getting harder to settle</title>
  <desc id="desc">A fourteen-day worked example showing stable first and third naps while the average settle time for nap two rises from about twelve minutes on older days to about twenty minutes on the three most recent days.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102B4C"/><stop offset="1" stop-color="#204D67"/></linearGradient>
    <linearGradient id="focus" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF3D9"/><stop offset="1" stop-color="#FDE2D5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#07182B" flood-opacity=".22"/></filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.serif{font-family:Georgia,"Times New Roman",serif}.label{font-size:16px;font-weight:750;letter-spacing:1.6px}.body{font-size:20px}.muted{fill:#5E7285}.strong{font-weight:750}.tiny{font-size:17px}
    </style>
  </defs>
  <rect width="1200" height="900" rx="36" fill="url(#bg)"/>
  <circle cx="1102" cy="92" r="102" fill="#F4C979" opacity=".1"/>
  <circle cx="92" cy="820" r="150" fill="#7CC8B7" opacity=".08"/>

  <text x="62" y="66" class="sans label" fill="#F4C979">THE CURRENT FLUTTER RULE</text>
  <text x="62" y="113" class="serif" font-size="38" font-weight="700" fill="#FFFFFF">It compares the same nap position across days</text>
  <text x="62" y="149" class="sans body" fill="#D9E6EE">Sort each day by start time → call them Nap 1, Nap 2, Nap 3 → read time-to-settle.</text>

  <g filter="url(#shadow)"><rect x="52" y="187" width="1096" height="105" rx="25" fill="#FFFFFF"/></g>
  <g class="sans strong" font-size="20" fill="#183A55">
    <circle cx="91" cy="240" r="21" fill="#E5F5F1"/><text x="91" y="247" text-anchor="middle" fill="#188777">1</text><text x="126" y="247">Look back 14 calendar days</text>
    <path d="M385 240h50" stroke="#8EA0AD" stroke-width="3" stroke-linecap="round"/><path d="m426 230 10 10-10 10" fill="none" stroke="#8EA0AD" stroke-width="3"/>
    <circle cx="476" cy="240" r="21" fill="#E5F5F1"/><text x="476" y="247" text-anchor="middle" fill="#188777">2</text><text x="511" y="247">Group by daily order</text>
    <path d="M742 240h50" stroke="#8EA0AD" stroke-width="3" stroke-linecap="round"/><path d="m783 230 10 10-10 10" fill="none" stroke="#8EA0AD" stroke-width="3"/>
    <circle cx="833" cy="240" r="21" fill="#E5F5F1"/><text x="833" y="247" text-anchor="middle" fill="#188777">3</text><text x="868" y="247">Choose largest rise</text>
  </g>

  <g filter="url(#shadow)"><rect x="52" y="324" width="1096" height="327" rx="28" fill="#F8F7F2"/></g>
  <text x="84" y="365" class="sans label muted">WORKED TEN-DAY TEST EXAMPLE</text>
  <text x="768" y="365" class="sans tiny muted">Older days (3–13)</text><text x="1017" y="365" class="sans tiny muted">Recent days (0–2)</text>

  <rect x="79" y="388" width="1042" height="68" rx="18" fill="#EAF3F2"/>
  <text x="104" y="430" class="sans strong" font-size="22" fill="#21445A">Nap 1</text>
  <text x="275" y="430" class="sans body" fill="#516C7A">settling stays steady</text>
  <text x="806" y="430" class="sans strong" font-size="22" fill="#27546B">~10m</text>
  <path d="M890 422h82" stroke="#75AFA2" stroke-width="5" stroke-linecap="round"/>
  <text x="1027" y="430" class="sans strong" font-size="22" fill="#27546B">~10m</text>

  <rect x="79" y="472" width="1042" height="88" rx="20" fill="url(#focus)" stroke="#E7B96C" stroke-width="2"/>
  <circle cx="114" cy="516" r="24" fill="#E39A58"/><text x="114" y="524" text-anchor="middle" class="sans strong" font-size="23" fill="#FFFFFF">2</text>
  <text x="157" y="510" class="sans strong" font-size="24" fill="#5D3B2B">Nap 2</text>
  <text x="157" y="538" class="sans tiny" fill="#755648">largest qualifying rise</text>
  <text x="802" y="524" class="sans strong" font-size="26" fill="#70442F">~12m</text>
  <path d="M891 516h82" stroke="#D27E52" stroke-width="6" stroke-linecap="round"/><path d="m960 503 14 13-14 13" fill="none" stroke="#D27E52" stroke-width="5"/>
  <text x="1015" y="524" class="sans strong" font-size="26" fill="#B7583F">~20m</text>
  <rect x="635" y="491" width="116" height="48" rx="24" fill="#B7583F"/><text x="693" y="522" text-anchor="middle" class="sans strong" font-size="20" fill="#FFFFFF">+8 min</text>

  <rect x="79" y="576" width="1042" height="52" rx="17" fill="#EAF3F2"/>
  <text x="104" y="610" class="sans strong" font-size="22" fill="#21445A">Nap 3</text>
  <text x="275" y="610" class="sans body" fill="#516C7A">settling stays steady</text>
  <text x="806" y="610" class="sans strong" font-size="22" fill="#27546B">~13m</text>
  <path d="M890 602h82" stroke="#75AFA2" stroke-width="5" stroke-linecap="round"/>
  <text x="1027" y="610" class="sans strong" font-size="22" fill="#27546B">~14m</text>

  <g filter="url(#shadow)"><rect x="52" y="684" width="1096" height="124" rx="26" fill="#FFFFFF"/></g>
  <text x="84" y="722" class="sans label muted">GATES FOR THAT NAP POSITION</text>
  <g class="sans strong" font-size="18" fill="#173D5A">
    <circle cx="99" cy="766" r="18" fill="#E5F5F1"/><text x="99" y="772" text-anchor="middle" fill="#188777">✓</text><text x="129" y="772">1–120m values</text>
    <circle cx="331" cy="766" r="18" fill="#E5F5F1"/><text x="331" y="772" text-anchor="middle" fill="#188777">✓</text><text x="361" y="772">5+ records total</text>
    <circle cx="577" cy="766" r="18" fill="#E5F5F1"/><text x="577" y="772" text-anchor="middle" fill="#188777">✓</text><text x="607" y="772">2+ recent</text>
    <circle cx="784" cy="766" r="18" fill="#E5F5F1"/><text x="784" y="772" text-anchor="middle" fill="#188777">✓</text><text x="814" y="772">2+ older</text>
    <circle cx="989" cy="766" r="18" fill="#E5F5F1"/><text x="989" y="772" text-anchor="middle" fill="#188777">✓</text><text x="1019" y="772">rise ≥ 3m</text>
  </g>

  <rect x="52" y="834" width="1096" height="42" rx="21" fill="#F4C979"/>
  <text x="600" y="861" text-anchor="middle" class="sans strong" font-size="17" fill="#4F3A16">Manual choices are proxy values: Under 5m = 3 · 5–15m = 10 · 15–30m = 22 · 30m+ = 40</text>
</svg>
