<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How Luna answers what a baby is doing right now</title>
  <desc id="desc">After a safety-language check, Luna recognises a current-state question, reads the selected baby’s current OBubba logs and returns asleep, awake or not enough evidence. The answer does not use a camera or generative model.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf3"/>
      <stop offset="1" stop-color="#eef4f1"/>
    </linearGradient>
    <linearGradient id="question" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eadff3"/>
      <stop offset="1" stop-color="#f8edf0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#25364d" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#8b6d92"/>
    </marker>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif;fill:#25364d}.sans{font-family:Arial,Helvetica,sans-serif;fill:#45536a}.eyebrow{font-size:15px;font-weight:700;letter-spacing:2px}.h1{font-size:38px;font-weight:700}.h2{font-size:24px;font-weight:700}.body{font-size:16px}.small{font-size:13px}.bold{font-weight:700}.muted{fill:#687487}.white{fill:#fff}.center{text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <circle cx="1124" cy="82" r="152" fill="#eadde8" opacity=".55"/>
  <circle cx="82" cy="632" r="164" fill="#dbe9e0" opacity=".65"/>

  <text x="68" y="62" class="sans eyebrow" fill="#a26377">LUNA · CURRENT FLUTTER PATH</text>
  <text x="68" y="108" class="serif h1">A live answer from the log—not surveillance.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="146" width="1060" height="94" rx="24" fill="url(#question)"/>
  </g>
  <circle cx="126" cy="193" r="27" fill="#fff" opacity=".9"/>
  <path d="M117 188c0-7 6-12 13-12s13 5 13 12-6 12-13 12h-4l-7 7 2-9c-3-2-4-6-4-10Z" fill="none" stroke="#8a668f" stroke-width="3" stroke-linejoin="round"/>
  <text x="173" y="185" class="serif h2">“Is Oliver asleep?”</text>
  <text x="173" y="214" class="sans body muted">Recognised as a present-moment question after the safety-language gate.</text>
  <rect x="901" y="171" width="185" height="44" rx="22" fill="#34465f"/>
  <text x="993.5" y="198" class="sans small bold white center">NO MODEL CALL</text>

  <path d="M600 240v54" stroke="#8b6d92" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="334" y="294" width="532" height="100" rx="24" fill="#fff"/>
  </g>
  <text x="600" y="332" class="serif h2 center">Read today’s selected-baby record</text>
  <text x="600" y="364" class="sans body muted center">Open timer · latest wake/end · milk feed · completed naps</text>

  <path d="M455 394v50h-203v28" fill="none" stroke="#ca7b68" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M600 394v78" fill="none" stroke="#6d8f7e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M745 394v50h203v28" fill="none" stroke="#8a7aa0" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="471" width="320" height="142" rx="24" fill="#fff0ea"/>
    <rect x="440" y="471" width="320" height="142" rx="24" fill="#e6f1eb"/>
    <rect x="810" y="471" width="320" height="142" rx="24" fill="#f0ebf4"/>
  </g>
  <circle cx="112" cy="513" r="20" fill="#cc7864"/>
  <path d="M103 513h18M112 504v18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="145" y="520" class="serif h2">Open timer</text>
  <text x="102" y="555" class="sans body">“The sleep timer is running.”</text>
  <text x="102" y="584" class="sans small muted">A log state, not observed sleep.</text>

  <circle cx="482" cy="513" r="20" fill="#668b78"/>
  <path d="M482 501v13l9 6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="515" y="520" class="serif h2">Wake anchor</text>
  <text x="472" y="555" class="sans body">“Awake for 2h 10m.”</text>
  <text x="472" y="584" class="sans small muted">Age-aware timing, not a cue check.</text>

  <circle cx="852" cy="513" r="20" fill="#8a7398"/>
  <path d="M844 513h16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="885" y="520" class="serif h2">No anchor</text>
  <text x="842" y="555" class="sans body">“I can’t give a live read.”</text>
  <text x="842" y="584" class="sans small muted">Honest uncertainty; never guessed.</text>

  <rect x="354" y="631" width="492" height="30" rx="15" fill="#283b52"/>
  <text x="600" y="651" class="sans small bold white center">NO CAMERA · NO MICROPHONE · CHECK THE BABY DIRECTLY</text>
</svg>
