<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1660" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba compares night wakes around starting solids</title>
  <desc id="desc">A mobile-readable five-step map showing the first logged solid, measured nights before and after, minimum samples, average wake comparison and the three possible labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf7ef"/><stop offset="1" stop-color="#f1eee7"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#33425a"/><stop offset="1" stop-color="#202a3a"/></linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="135%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#273143" flood-opacity=".11"/></filter>
  </defs>
  <rect width="640" height="1660" rx="34" fill="url(#bg)"/>
  <circle cx="580" cy="75" r="100" fill="#d6b35c" opacity=".13"/>
  <circle cx="44" cy="1570" r="130" fill="#899d82" opacity=".11"/>
  <text x="42" y="68" fill="#8b6612" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2.5">INSIDE THE FLUTTER APP</text>
  <text x="42" y="116" fill="#202838" font-family="Georgia, serif" font-size="34" font-weight="700">One date. Two groups of nights.</text>
  <text x="42" y="153" fill="#5e6671" font-family="Arial, sans-serif" font-size="20">A logged pattern — never proof that food caused sleep.</text>

  <g filter="url(#shadow)">
    <rect x="30" y="200" width="580" height="210" rx="24" fill="#fffdf9"/>
    <circle cx="86" cy="260" r="32" fill="#d6b35c"/><text x="86" y="269" text-anchor="middle" fill="#202838" font-family="Arial" font-size="24" font-weight="800">1</text>
    <text x="135" y="249" fill="#202838" font-family="Arial" font-size="27" font-weight="800">Find the first logged solid</text>
    <text x="135" y="286" fill="#5e6671" font-family="Arial" font-size="22">That calendar day becomes the divider.</text>
    <rect x="58" y="325" width="524" height="54" rx="17" fill="#f3ead2"/>
    <text x="320" y="348" text-anchor="middle" fill="#8b6612" font-family="Arial" font-size="19" font-weight="800">BEFORE STARTING SOLIDS</text>
    <text x="320" y="371" text-anchor="middle" fill="#8b6612" font-family="Arial" font-size="16">versus on or after starting solids</text>
  </g>
  <path d="M320 410v45m-10-12 10 13 10-13" fill="none" stroke="#b59750" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="30" y="465" width="580" height="260" rx="24" fill="url(#night)"/>
    <circle cx="86" cy="525" r="32" fill="#eff2f4"/><text x="86" y="534" text-anchor="middle" fill="#202838" font-family="Arial" font-size="24" font-weight="800">2</text>
    <text x="135" y="514" fill="#fffdf9" font-family="Arial" font-size="27" font-weight="800">Build two measured-night groups</text>
    <text x="58" y="568" fill="#dfe5e7" font-family="Arial" font-size="22">The screen examines up to about 60 recent</text>
    <text x="58" y="600" fill="#dfe5e7" font-family="Arial" font-size="22">calendar nights. A night counts only when</text>
    <text x="58" y="632" fill="#dfe5e7" font-family="Arial" font-size="22">OBubba has a bedtime to analyse.</text>
    <rect x="58" y="662" width="250" height="36" rx="18" fill="#d6b35c"/><rect x="326" y="662" width="256" height="36" rx="18" fill="#91a68a"/>
    <text x="183" y="686" text-anchor="middle" fill="#202838" font-family="Arial" font-size="16" font-weight="800">BEFORE</text><text x="454" y="686" text-anchor="middle" fill="#202838" font-family="Arial" font-size="16" font-weight="800">ON / AFTER</text>
  </g>
  <path d="M320 725v45m-10-12 10 13 10-13" fill="none" stroke="#b59750" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="30" y="780" width="580" height="220" rx="24" fill="#fffdf9"/>
    <circle cx="86" cy="840" r="32" fill="#d6b35c"/><text x="86" y="849" text-anchor="middle" fill="#202838" font-family="Arial" font-size="24" font-weight="800">3</text>
    <text x="135" y="829" fill="#202838" font-family="Arial" font-size="27" font-weight="800">Require enough real nights</text>
    <text x="58" y="883" fill="#5e6671" font-family="Arial" font-size="22">At least 5 measured nights before and</text>
    <text x="58" y="915" fill="#5e6671" font-family="Arial" font-size="22">5 measured nights on or after.</text>
    <text x="58" y="960" fill="#8b6612" font-family="Arial" font-size="20" font-weight="700">Too few on either side? The line stays hidden.</text>
  </g>
  <path d="M320 1000v45m-10-12 10 13 10-13" fill="none" stroke="#b59750" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="30" y="1055" width="580" height="230" rx="24" fill="#fffdf9"/>
    <circle cx="86" cy="1115" r="32" fill="#d6b35c"/><text x="86" y="1124" text-anchor="middle" fill="#202838" font-family="Arial" font-size="24" font-weight="800">4</text>
    <text x="135" y="1104" fill="#202838" font-family="Arial" font-size="27" font-weight="800">Compare average wakes</text>
    <text x="58" y="1158" fill="#5e6671" font-family="Arial" font-size="22">Each side is averaged and rounded to</text>
    <text x="58" y="1190" fill="#5e6671" font-family="Arial" font-size="22">one decimal place.</text>
    <rect x="58" y="1220" width="524" height="38" rx="19" fill="#f0eee9"/>
    <text x="320" y="1246" text-anchor="middle" fill="#404957" font-family="Arial" font-size="18" font-weight="700">2.4 before → 1.7 after = −0.7 wakes/night</text>
  </g>
  <path d="M320 1285v45m-10-12 10 13 10-13" fill="none" stroke="#b59750" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="30" y="1340" width="580" height="238" rx="24" fill="#fffdf9"/>
    <circle cx="86" cy="1400" r="32" fill="#d6b35c"/><text x="86" y="1409" text-anchor="middle" fill="#202838" font-family="Arial" font-size="24" font-weight="800">5</text>
    <text x="135" y="1389" fill="#202838" font-family="Arial" font-size="27" font-weight="800">Label the direction</text>
    <rect x="58" y="1440" width="524" height="34" rx="17" fill="#dce8dc"/><text x="320" y="1463" text-anchor="middle" fill="#35543a" font-family="Arial" font-size="17" font-weight="800">≤ −0.5 WAKES/NIGHT  ·  DOWN</text>
    <rect x="58" y="1483" width="524" height="34" rx="17" fill="#eee7d5"/><text x="320" y="1506" text-anchor="middle" fill="#6e5c2e" font-family="Arial" font-size="17" font-weight="800">−0.4 TO +0.4  ·  STEADY</text>
    <rect x="58" y="1526" width="524" height="34" rx="17" fill="#eadfde"/><text x="320" y="1549" text-anchor="middle" fill="#714746" font-family="Arial" font-size="17" font-weight="800">≥ +0.5 WAKES/NIGHT  ·  RISEN</text>
  </g>
  <text x="320" y="1627" text-anchor="middle" fill="#5e6671" font-family="Arial" font-size="17">OBubba observes your timeline. Your baby’s readiness leads.</text>
</svg>
