<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1400" viewBox="0 0 900 1400" role="img" aria-labelledby="title desc">
  <title id="title">OBubba’s two breastfeeding-side signals</title>
  <desc id="desc">A comparison of the gentle seven-day 60 percent balance card and the stricter five-day alert that requires six feeds and a lesser side at 20 percent or below.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9f6"/>
      <stop offset="0.52" stop-color="#f8f2fb"/>
      <stop offset="1" stop-color="#edf7f4"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#332742"/>
      <stop offset="1" stop-color="#51406b"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d96d84"/>
      <stop offset="1" stop-color="#ec987f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#34273f" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="900" height="1400" rx="46" fill="url(#bg)"/>
  <circle cx="785" cy="84" r="105" fill="#f6d4d2" opacity=".78"/>
  <circle cx="54" cy="1328" r="128" fill="#d9d0f7" opacity=".7"/>

  <text x="62" y="72" fill="#d35d77" font-family="Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2.1">INSIDE THE FLUTTER APP</text>
  <text x="62" y="128" fill="#33273e" font-family="Georgia, serif" font-size="47" font-weight="700">Two side signals.</text>
  <text x="62" y="184" fill="#33273e" font-family="Georgia, serif" font-size="47" font-weight="700">Different thresholds.</text>
  <text x="62" y="222" fill="#716777" font-family="Arial, sans-serif" font-size="18">Both describe logged time—not milk transfer.</text>

  <g filter="url(#shadow)">
    <rect x="54" y="274" width="792" height="300" rx="30" fill="#ffffff"/>
  </g>
  <rect x="80" y="302" width="174" height="34" rx="17" fill="#eee8f7"/>
  <text x="167" y="324" text-anchor="middle" fill="#68557e" font-family="Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1">GENTLE BALANCE</text>
  <text x="80" y="378" fill="#33273e" font-family="Arial, sans-serif" font-size="26" font-weight="800">“Feeding leans to one side”</text>
  <text x="80" y="417" fill="#716777" font-family="Arial, sans-serif" font-size="17">A quiet notice that one side holds most recorded minutes.</text>

  <rect x="80" y="453" width="742" height="20" rx="10" fill="#ece7ef"/>
  <rect x="80" y="453" width="445" height="20" rx="10" fill="#b9a6de"/>
  <circle cx="525" cy="463" r="17" fill="#756092" stroke="#ffffff" stroke-width="5"/>
  <text x="80" y="510" fill="#46384f" font-family="Arial, sans-serif" font-size="17" font-weight="700">7 days · at least 5 feeds · dominant side ≥60%</text>
  <text x="80" y="542" fill="#8a7f8d" font-family="Arial, sans-serif" font-size="15">Low urgency · sample label counts feeds</text>

  <path d="M450 574 V615" stroke="#cdb7dc" stroke-width="5" stroke-linecap="round"/>
  <path d="M439 607 L450 621 L461 607" fill="none" stroke="#cdb7dc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="54" y="628" width="792" height="352" rx="30" fill="url(#deep)"/>
  </g>
  <rect x="80" y="656" width="184" height="34" rx="17" fill="#f1c9ce"/>
  <text x="172" y="678" text-anchor="middle" fill="#8f4054" font-family="Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1">STRONG-SKEW ALERT</text>
  <text x="80" y="732" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="800">“Right side is doing nearly all the work”</text>
  <text x="80" y="771" fill="#ded5e5" font-family="Arial, sans-serif" font-size="17">The lesser-recorded side has almost disappeared from the log.</text>

  <rect x="80" y="807" width="742" height="20" rx="10" fill="#6d5a80"/>
  <rect x="80" y="807" width="594" height="20" rx="10" fill="url(#rose)"/>
  <circle cx="674" cy="817" r="17" fill="#ef9b80" stroke="#ffffff" stroke-width="5"/>
  <text x="80" y="865" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700">Latest 5 days · at least 6 feeds</text>
  <text x="80" y="899" fill="#ffffff" font-family="Arial, sans-serif" font-size="17" font-weight="700">lesser side ≤20% · dominant side ≥80%</text>
  <text x="80" y="938" fill="#cfc5d8" font-family="Arial, sans-serif" font-size="15">Medium urgency · sorts ahead of the gentle card</text>

  <path d="M450 980 V1021" stroke="#cdb7dc" stroke-width="5" stroke-linecap="round"/>
  <path d="M439 1013 L450 1027 L461 1013" fill="none" stroke="#cdb7dc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="54" y="1034" width="792" height="278" rx="30" fill="#ffffff"/>
  </g>
  <text x="80" y="1085" fill="#33273e" font-family="Arial, sans-serif" font-size="25" font-weight="800">What the percentage cannot see</text>

  <g font-family="Arial, sans-serif" font-size="16">
    <circle cx="94" cy="1132" r="10" fill="#e07a82"/><text x="119" y="1138" fill="#514656">swallowing or milk transfer</text>
    <circle cx="94" cy="1174" r="10" fill="#b9a6de"/><text x="119" y="1180" fill="#514656">pain, heat, a lump or fever</text>
    <circle cx="94" cy="1216" r="10" fill="#8fcfbb"/><text x="119" y="1222" fill="#514656">an unlogged second side or pump session</text>
    <circle cx="94" cy="1258" r="10" fill="#e7bd6f"/><text x="119" y="1264" fill="#514656">why one-sided feeding may be intentional</text>
  </g>

  <rect x="54" y="1340" width="792" height="34" rx="17" fill="#33273e"/>
  <text x="450" y="1363" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Check the log. Follow comfort and cues. Symptoms outrank the chart.</text>
</svg>
