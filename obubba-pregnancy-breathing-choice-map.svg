<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">OBubba pregnancy breathing loop and next-step guide</title>
  <desc id="desc">A four-phase sixteen-second breathing loop followed by three choices: settle, tell someone, or call maternity care now.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101934"/>
      <stop offset="0.58" stop-color="#29213d"/>
      <stop offset="1" stop-color="#3b2945"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ffd5df" stop-opacity=".72"/>
      <stop offset=".58" stop-color="#c9b7ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#c9b7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#050817" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" rx="44" fill="url(#night)"/>
  <circle cx="1070" cy="120" r="210" fill="#b795d9" opacity=".09"/>
  <circle cx="90" cy="1360" r="250" fill="#76c9b2" opacity=".06"/>

  <text x="84" y="92" fill="#ffb59f" font-family="Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="5">OBUBBA • PREGNANCY WELLBEING</text>
  <text x="84" y="164" fill="#fffaf7" font-family="Georgia, serif" font-size="54" font-weight="700">A breath is a pause,</text>
  <text x="84" y="226" fill="#fffaf7" font-family="Georgia, serif" font-size="54" font-weight="700">not a safety test.</text>
  <text x="84" y="272" fill="#d8cfdd" font-family="Arial, sans-serif" font-size="22">One 16-second loop. Then choose the honest next step.</text>

  <circle cx="600" cy="520" r="184" fill="url(#halo)"/>
  <circle cx="600" cy="520" r="112" fill="#fff8f6" stroke="#f5aab9" stroke-width="5"/>
  <text x="600" y="504" text-anchor="middle" fill="#53364d" font-family="Georgia, serif" font-size="31" font-weight="700">16 seconds</text>
  <text x="600" y="544" text-anchor="middle" fill="#765c72" font-family="Arial, sans-serif" font-size="18">repeat only while comfortable</text>

  <g filter="url(#shadow)">
    <rect x="80" y="356" width="316" height="150" rx="28" fill="#fff8f4"/>
    <circle cx="128" cy="404" r="28" fill="#ef8e9f"/>
    <text x="128" y="413" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="800">1</text>
    <text x="174" y="397" fill="#6b3f55" font-family="Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2">BREATHE IN</text>
    <text x="174" y="438" fill="#352c40" font-family="Georgia, serif" font-size="31" font-weight="700">4 seconds</text>
    <text x="174" y="470" fill="#765f71" font-family="Arial, sans-serif" font-size="17">Circle expands</text>

    <rect x="804" y="356" width="316" height="150" rx="28" fill="#f2edfa"/>
    <circle cx="852" cy="404" r="28" fill="#987dca"/>
    <text x="852" y="413" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="800">2</text>
    <text x="898" y="397" fill="#684f83" font-family="Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2">HOLD</text>
    <text x="898" y="438" fill="#352c40" font-family="Georgia, serif" font-size="31" font-weight="700">4 seconds</text>
    <text x="898" y="470" fill="#765f71" font-family="Arial, sans-serif" font-size="17">Circle stays open</text>

    <rect x="80" y="548" width="316" height="150" rx="28" fill="#e9f6f2"/>
    <circle cx="128" cy="596" r="28" fill="#4ca88d"/>
    <text x="128" y="605" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="800">3</text>
    <text x="174" y="589" fill="#357b68" font-family="Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2">BREATHE OUT</text>
    <text x="174" y="630" fill="#293f3a" font-family="Georgia, serif" font-size="31" font-weight="700">4 seconds</text>
    <text x="174" y="662" fill="#56736b" font-family="Arial, sans-serif" font-size="17">Circle contracts</text>

    <rect x="804" y="548" width="316" height="150" rx="28" fill="#fff0e8"/>
    <circle cx="852" cy="596" r="28" fill="#ee9974"/>
    <text x="852" y="605" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="800">4</text>
    <text x="898" y="589" fill="#985c46" font-family="Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2">HOLD</text>
    <text x="898" y="630" fill="#49332f" font-family="Georgia, serif" font-size="31" font-weight="700">4 seconds</text>
    <text x="898" y="662" fill="#795c53" font-family="Arial, sans-serif" font-size="17">Circle stays small</text>
  </g>

  <path d="M600 718 V784" stroke="#e7d8c0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="600" cy="792" r="7" fill="#e7b86e"/>
  <text x="600" y="852" text-anchor="middle" fill="#fffaf7" font-family="Georgia, serif" font-size="40" font-weight="700">What does this moment need?</text>
  <text x="600" y="890" text-anchor="middle" fill="#d8cfdd" font-family="Arial, sans-serif" font-size="20">The feeling after the breath does not decide medical urgency.</text>

  <g filter="url(#shadow)">
    <rect x="76" y="944" width="1048" height="132" rx="28" fill="#e8f6f1"/>
    <circle cx="138" cy="1010" r="34" fill="#3e9d80"/>
    <text x="138" y="1020" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="26" font-weight="800">A</text>
    <text x="198" y="991" fill="#286b59" font-family="Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="2">ORDINARY WORRY • FEELING WELL</text>
    <text x="198" y="1034" fill="#263d37" font-family="Georgia, serif" font-size="29" font-weight="700">Settle, write it down, or put the phone away.</text>

    <rect x="76" y="1096" width="1048" height="132" rx="28" fill="#fff3df"/>
    <circle cx="138" cy="1162" r="34" fill="#d99438"/>
    <text x="138" y="1172" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="26" font-weight="800">B</text>
    <text x="198" y="1143" fill="#8c5a1e" font-family="Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="2">WORRY KEEPS RETURNING</text>
    <text x="198" y="1186" fill="#4b3b29" font-family="Georgia, serif" font-size="29" font-weight="700">Tell your midwife, GP or maternity team.</text>

    <rect x="76" y="1248" width="1048" height="132" rx="28" fill="#ffe7e2"/>
    <circle cx="138" cy="1314" r="34" fill="#d95c55"/>
    <text x="138" y="1324" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="26" font-weight="800">C</text>
    <text x="198" y="1295" fill="#963e3b" font-family="Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="2">WARNING SIGN • SOMETHING FEELS WRONG</text>
    <text x="198" y="1338" fill="#512e2d" font-family="Georgia, serif" font-size="29" font-weight="700">Skip the loop. Call the right service now.</text>
  </g>

  <text x="600" y="1440" text-anchor="middle" fill="#ffb59f" font-family="Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="2">CALM CAN HELP YOU ACT • CALM CANNOT CLEAR A SYMPTOM</text>
  <text x="600" y="1476" text-anchor="middle" fill="#bdb3c3" font-family="Arial, sans-serif" font-size="15">Implementation reviewed 11 March 2027 • informational support, not medical care</text>
</svg>
