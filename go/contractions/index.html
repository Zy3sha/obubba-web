<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex, follow"/>
  <title>Open OBubba</title>
  <meta property="og:title" content="OBubba"/>
  <meta property="og:url" content="https://obubba.com/go/mum"/>
  <meta property="og:image" content="https://obubba.com/og-image.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
  <!-- contraction timer link (social and community posts). Sends each device to its own store via /start, tagged utm_content=auto_contraction_timer.
       Optional ?s=tt|ig|fb|em sets the source, so the App Store ct reads e.g. tiktok_founder_mum; default referral_founder_mum. -->
  <meta http-equiv="refresh" content="0; url=/start/?utm_source=referral&amp;utm_medium=referral&amp;utm_content=auto_contraction_timer"/>
  <script>(function(){var m={tt:'tiktok',tiktok:'tiktok',ig:'instagram',instagram:'instagram',fb:'facebook',facebook:'facebook',em:'email',email:'email'};var s=String(new URLSearchParams(location.search).get('s')||'').toLowerCase();var src=m[s]||'referral';var med=src==='referral'?'referral':(src==='email'?'lifecycle':'organic_social');location.replace('/start/?utm_source='+src+'&utm_medium='+med+'&utm_content=auto_contraction_timer');})();</script>
</head>
<body style="background:#031127;color:#fff8ed;font-family:system-ui,sans-serif;text-align:center;padding:40px">
  <p><a style="color:#D6C4F2" href="/start/?utm_source=referral&amp;utm_medium=referral&amp;utm_content=auto_contraction_timer">Open OBubba</a></p>
</body>
</html>
