<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120" role="img" aria-labelledby="title desc">
  <title id="title">What Loved it, Unsure and Reaction change in OBubba</title>
  <desc id="desc">A vertical mobile-first diagram showing Loved it as calm evidence, Unsure as neutral evidence, and Reaction as a lifetime safety signal that can filter recipes and prompt cautious review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8f0"/>
      <stop offset="1" stop-color="#f0eafa"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2140"/>
      <stop offset="1" stop-color="#4d3158"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#402b47" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="640" height="1120" rx="32" fill="url(#bg)"/>
  <rect x="0" y="0" width="640" height="190" rx="32" fill="url(#head)"/>
  <circle cx="568" cy="55" r="76" fill="#d59ab0" opacity=".16"/>
  <text x="50" y="61" fill="#efc66f" font-family="Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2">ONE TAP, THREE DIFFERENT JOBS</text>
  <text x="50" y="105" fill="#fffaf3" font-family="Georgia, serif" font-size="30" font-weight="700">Record what happened.</text>
  <text x="50" y="143" fill="#fffaf3" font-family="Georgia, serif" font-size="30" font-weight="700">Keep certainty in proportion.</text>
  <text x="50" y="174" fill="#ddd3e0" font-family="Arial, sans-serif" font-size="15">The button organises the evidence; it never diagnoses.</text>

  <g filter="url(#shadow)">
    <rect x="38" y="225" width="564" height="224" rx="24" fill="#f4fff4" stroke="#79bd87" stroke-width="2"/>
    <circle cx="88" cy="278" r="27" fill="#4f9f65"/>
    <text x="88" y="287" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="22">♥</text>
    <text x="132" y="272" fill="#244531" font-family="Arial, sans-serif" font-size="23" font-weight="800">Loved it</text>
    <text x="132" y="299" fill="#4c6655" font-family="Arial, sans-serif" font-size="15">Calm or positive meal</text>
    <line x1="67" y1="326" x2="573" y2="326" stroke="#bcd9c2"/>
    <text x="69" y="355" fill="#2e4937" font-family="Arial, sans-serif" font-size="16" font-weight="700">Can become calm evidence</text>
    <text x="69" y="382" fill="#52665a" font-family="Arial, sans-serif" font-size="14">• supports repeat-exposure progress cards</text>
    <text x="69" y="406" fill="#52665a" font-family="Arial, sans-serif" font-size="14">• can count as earlier tolerance context</text>
    <text x="69" y="432" fill="#8a5b67" font-family="Arial, sans-serif" font-size="13" font-weight="700">Not allergy clearance · dose is not measured</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="38" y="476" width="564" height="224" rx="24" fill="#fffaf0" stroke="#dda94d" stroke-width="2"/>
    <circle cx="88" cy="529" r="27" fill="#d39838"/>
    <text x="88" y="538" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="22">?</text>
    <text x="132" y="523" fill="#583d19" font-family="Arial, sans-serif" font-size="23" font-weight="800">Unsure</text>
    <text x="132" y="550" fill="#745d39" font-family="Arial, sans-serif" font-size="15">Ambiguity preserved</text>
    <line x1="67" y1="577" x2="573" y2="577" stroke="#ead1a1"/>
    <text x="69" y="606" fill="#5c4826" font-family="Arial, sans-serif" font-size="16" font-weight="700">Deliberately neutral evidence</text>
    <text x="69" y="633" fill="#705f43" font-family="Arial, sans-serif" font-size="14">• does not count as calm or reaction</text>
    <text x="69" y="657" fill="#705f43" font-family="Arial, sans-serif" font-size="14">• repeated question marks can hold a celebration</text>
    <text x="69" y="683" fill="#8a5b67" font-family="Arial, sans-serif" font-size="13" font-weight="700">Add the observable detail that made you unsure</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="38" y="727" width="564" height="263" rx="24" fill="#fff3f2" stroke="#d96b68" stroke-width="2"/>
    <circle cx="88" cy="780" r="27" fill="#c95555"/>
    <text x="88" y="789" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="22">!</text>
    <text x="132" y="774" fill="#632a2a" font-family="Arial, sans-serif" font-size="23" font-weight="800">Reaction</text>
    <text x="132" y="801" fill="#7a4a4a" font-family="Arial, sans-serif" font-size="15">Possible physical response recorded</text>
    <line x1="67" y1="828" x2="573" y2="828" stroke="#ebbbb8"/>
    <text x="69" y="857" fill="#622f31" font-family="Arial, sans-serif" font-size="16" font-weight="700">Can activate cautious safety paths</text>
    <text x="69" y="884" fill="#775052" font-family="Arial, sans-serif" font-size="14">• recognised allergens enter lifetime memory</text>
    <text x="69" y="908" fill="#775052" font-family="Arial, sans-serif" font-size="14">• matching recipes and first tastes are filtered</text>
    <text x="69" y="932" fill="#775052" font-family="Arial, sans-serif" font-size="14">• recent evidence may get a qualitative review</text>
    <text x="69" y="959" fill="#8a2730" font-family="Arial, sans-serif" font-size="13" font-weight="800">Possible reaction ≠ confirmed allergy</text>
  </g>

  <rect x="38" y="1018" width="564" height="67" rx="18" fill="#382747"/>
  <text x="320" y="1047" text-anchor="middle" fill="#fff8ef" font-family="Arial, sans-serif" font-size="15" font-weight="800">SEVERE SYMPTOMS? CARE FIRST · LOG LATER</text>
  <text x="320" y="1071" text-anchor="middle" fill="#e6c8d3" font-family="Arial, sans-serif" font-size="13">Call 999 for breathing difficulty or a severe reaction.</text>
  <text x="320" y="1105" text-anchor="middle" fill="#786b7f" font-family="Arial, sans-serif" font-size="12">Parent observation → organised history → professional assessment</text>
</svg>
