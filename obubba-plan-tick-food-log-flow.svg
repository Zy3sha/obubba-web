<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Plan tick and food log follow different paths in OBubba</title>
  <desc id="desc">The weekly plan tick remains in a temporary checklist. A dated solids log flows into the food journal, allergen journey, progress summaries and future suggestions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07182d"/><stop offset="1" stop-color="#102947"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5d989"/><stop offset="1" stop-color="#d9a84f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1200" height="760" rx="38" fill="url(#bg)"/>
  <circle cx="1050" cy="92" r="180" fill="#76cbb5" opacity=".08"/><circle cx="120" cy="690" r="220" fill="#ef9b7d" opacity=".07"/>
  <text x="70" y="82" fill="#fffaf0" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800">One meal, two different records</text>
  <text x="70" y="120" fill="#afbed0" font-family="Inter,Arial,sans-serif" font-size="18">Planning remembers an intention. Logging preserves what actually happened.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="480" height="220" rx="28" fill="#102b48" stroke="#38516c"/>
    <circle cx="126" cy="226" r="25" fill="#f2cd78"/><path d="M114 226l8 8 17-19" fill="none" stroke="#07182d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="168" y="218" fill="#fffaf0" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800">Tap “tried”</text>
    <text x="168" y="249" fill="#b8c7d8" font-family="Inter,Arial,sans-serif" font-size="17">This week’s plan</text>
    <line x1="110" y1="282" x2="510" y2="282" stroke="#38516c"/>
    <text x="110" y="322" fill="#e8eef5" font-family="Inter,Arial,sans-serif" font-size="18">✓ Saves the child + week checklist tick</text>
    <text x="110" y="356" fill="#f0aa8c" font-family="Inter,Arial,sans-serif" font-size="18">× Does not create a dated food entry</text>
  </g>

  <path d="M310 390v72" stroke="#71849b" stroke-width="4" stroke-linecap="round"/><path d="M296 449l14 17 14-17" fill="none" stroke="#71849b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="105" y="468" width="410" height="118" rx="24" fill="#0c223b" stroke="#38516c"/>
  <text x="140" y="514" fill="#fffaf0" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="750">Weekly checklist only</text>
  <text x="140" y="548" fill="#afbed0" font-family="Inter,Arial,sans-serif" font-size="17">“2 of 6 tried” · resets with the plan</text>

  <g filter="url(#shadow)">
    <rect x="650" y="170" width="480" height="220" rx="28" fill="#112f48" stroke="#5cae9b"/>
    <circle cx="706" cy="226" r="25" fill="#78cdb7"/><path d="M697 214v24m-12-12h24" stroke="#07182d" stroke-width="5" stroke-linecap="round"/>
    <text x="748" y="218" fill="#fffaf0" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800">Log a food</text>
    <text x="748" y="249" fill="#b8c7d8" font-family="Inter,Arial,sans-serif" font-size="17">Dated solids entry</text>
    <line x1="690" y1="282" x2="1090" y2="282" stroke="#416477"/>
    <text x="690" y="322" fill="#e8eef5" font-family="Inter,Arial,sans-serif" font-size="18">✓ Food + allergens + response</text>
    <text x="690" y="356" fill="#94dfcb" font-family="Inter,Arial,sans-serif" font-size="18">✓ Becomes reusable child history</text>
  </g>

  <path d="M890 390v72" stroke="#78cdb7" stroke-width="4" stroke-linecap="round"/><path d="M876 449l14 17 14-17" fill="none" stroke="#78cdb7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="640" y="468" width="220" height="82" rx="22" fill="#173953" stroke="#5cae9b"/><text x="675" y="503" fill="#fffaf0" font-size="18" font-weight="750">Food journal</text><text x="675" y="529" fill="#afbed0" font-size="15">date + response</text>
    <rect x="880" y="468" width="250" height="82" rx="22" fill="#173953" stroke="#d6b55f"/><text x="915" y="503" fill="#fffaf0" font-size="18" font-weight="750">Allergen journey</text><text x="915" y="529" fill="#afbed0" font-size="15">lifetime memory</text>
    <rect x="640" y="570" width="220" height="82" rx="22" fill="#173953" stroke="#ef9b7d"/><text x="675" y="605" fill="#fffaf0" font-size="18" font-weight="750">Progress</text><text x="675" y="631" fill="#afbed0" font-size="15">iron · texture · variety</text>
    <rect x="880" y="570" width="250" height="82" rx="22" fill="#173953" stroke="#78cdb7"/><text x="915" y="605" fill="#fffaf0" font-size="18" font-weight="750">Next suggestions</text><text x="915" y="631" fill="#afbed0" font-size="15">what is truly new</text>
  </g>
  <rect x="70" y="684" width="1060" height="2" fill="#37506a"/>
  <text x="600" y="724" text-anchor="middle" fill="#f2cd78" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="750">Use “tried” for the plan. Use “Log a food” for the memory.</text>
</svg>
