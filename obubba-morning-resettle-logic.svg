<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1280" viewBox="0 0 760 1280" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba decides whether the first nap is a morning resettle</title>
  <desc id="desc">A vertical decision map from today’s earliest non-night wake and first completed daytime sleep through timing and care gates, ending in either keep Nap 1 or move the morning wake and remove the nap.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f4ff"/><stop offset=".55" stop-color="#fffaf3"/><stop offset="1" stop-color="#edf6f2"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38486d"/><stop offset="1" stop-color="#5a6f91"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#263a35" flood-opacity=".11"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#63736f"/></marker>
    <style>
      .eye{font:700 14px Arial,sans-serif;letter-spacing:2px;fill:#a6584a}.h1{font:700 35px Georgia,serif;fill:#273b38}.sub{font:400 17px Arial,sans-serif;fill:#5c6c68}.step{font:700 20px Arial,sans-serif;fill:#273b38}.body{font:400 15px Arial,sans-serif;fill:#556763}.small{font:700 13px Arial,sans-serif;fill:#6c7c78;letter-spacing:.4px}.yes{font:700 16px Arial,sans-serif;fill:#a6584a}.white{fill:#fff}.line{stroke:#63736f;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="760" height="1280" rx="34" fill="url(#bg)"/>
  <circle cx="674" cy="96" r="78" fill="#dfe7f5"/><circle cx="86" cy="1175" r="106" fill="#f3dcd0" opacity=".75"/>
  <text x="58" y="68" class="eye">TODAY’S SLEEP-LOG DECISION</text>
  <text x="58" y="116" class="h1">Was Nap 1 really the</text><text x="58" y="157" class="h1">end of the night?</text>
  <text x="58" y="193" class="sub">The current Flutter route—and exactly what the button rewrites.</text>

  <g filter="url(#shadow)"><rect x="80" y="232" width="600" height="104" rx="24" fill="#fff"/><circle cx="126" cy="284" r="24" fill="#e4eafd"/><text x="119" y="291" class="step">1</text><text x="168" y="274" class="step">Choose today’s earliest non-night wake</text><text x="168" y="304" class="body">It must be a timed Wake entry—not a night-wake stir.</text></g>
  <path d="M380 336v34" class="line"/>

  <g filter="url(#shadow)"><rect x="80" y="371" width="600" height="112" rx="24" fill="#fff"/><circle cx="126" cy="427" r="24" fill="#f4dfd3"/><text x="119" y="434" class="step">2</text><text x="168" y="414" class="step">Find the first completed daytime sleep after it</text><text x="168" y="444" class="body">Nap or Sleep; start + end required; duration ≥10 min.</text><text x="168" y="467" class="body">No earlier completed nap can exist.</text></g>
  <path d="M380 483v34" class="line"/>

  <g filter="url(#shadow)"><rect x="80" y="518" width="600" height="104" rx="24" fill="#e8f1ed"/><text x="116" y="560" class="step">Wake → sleep-start gap is 10–60 minutes?</text><text x="116" y="592" class="body">The hard one-hour ceiling decides this; age does not alter it today.</text></g>
  <path d="M380 622v34" class="line"/>

  <g filter="url(#shadow)"><rect x="80" y="657" width="600" height="130" rx="24" fill="#fff"/><text x="116" y="699" class="step">Supported care logged strictly between?</text><text x="116" y="731" class="body">Feed · nappy · solids · medicine · temperature</text><text x="116" y="756" class="body">activity · crying · note</text></g>

  <path d="M267 787v58" class="line"/><path d="M493 787v58" class="line"/>
  <text x="238" y="825" class="yes">YES</text><text x="500" y="825" class="yes">NO</text>

  <g filter="url(#shadow)"><rect x="42" y="846" width="320" height="176" rx="24" fill="#fff"/><text x="72" y="888" class="small">WATCH-ONLY BRANCH</text><text x="72" y="922" class="step">“That first wake</text><text x="72" y="948" class="step">window was tiny”</text><text x="72" y="980" class="body">Keep Nap 1. No data-changing</text><text x="72" y="1003" class="body">button; watch another morning.</text></g>
  <g filter="url(#shadow)"><rect x="398" y="846" width="320" height="176" rx="24" fill="url(#night)"/><text x="428" y="888" class="small white">ACTIONABLE BRANCH</text><text x="428" y="922" class="step white">“Looks like a little</text><text x="428" y="948" class="step white">morning resettle”</text><text x="428" y="980" class="body white">Parent chooses whether to repair</text><text x="428" y="1003" class="body white">the day anchor or keep the nap.</text></g>

  <path d="M558 1022v44" class="line"/>
  <g filter="url(#shadow)"><rect x="94" y="1067" width="572" height="136" rx="24" fill="#284b43"/><text x="126" y="1106" class="small white">TREAT AS FINAL MORNING WAKE</text><text x="126" y="1140" class="step white">Delete Nap 1  →  move Wake to nap end</text><text x="126" y="1171" class="body white">Add a note · recalculate awake clock, nap count, day sleep</text><text x="126" y="1194" class="body white">and predictions from the new anchor</text></g>
  <text x="380" y="1239" text-anchor="middle" class="step">The log suggests a question.</text>
  <text x="380" y="1264" text-anchor="middle" class="body">It does not observe mood, settling method or the room.</text>
</svg>
