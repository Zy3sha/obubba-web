<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba's no-download carer handoff works</title>
  <desc id="desc">A four-step diagram: the parent prepares care in OBubba, shares a QR code or private link, the carer opens a simple browser guide and logs care, and the entries return to the parent's timeline before the session ends.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf4"/><stop offset="1" stop-color="#f1edf8"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ef9a89"/><stop offset="1" stop-color="#d97975"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3d899"/><stop offset="1" stop-color="#d7ae5e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#6b5361" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b98d79"/></marker>
  </defs>
  <rect width="1200" height="720" rx="42" fill="url(#bg)"/>
  <circle cx="1110" cy="84" r="116" fill="#eadff2" opacity=".6"/><circle cx="90" cy="650" r="130" fill="#fae0d8" opacity=".65"/>
  <text x="70" y="84" fill="#2c2427" font-family="Georgia,serif" font-size="42" font-weight="700">One calm handoff. No second app.</text>
  <text x="70" y="122" fill="#74666b" font-family="Arial,sans-serif" font-size="20">The parent keeps control; the carer gets only the browser page needed for this care period.</text>

  <g fill="none" stroke="#b98d79" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M320 355h62"/><path d="M610 355h62"/><path d="M900 355h62"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="55" y="180" width="265" height="360" rx="30" fill="#fff"/>
    <rect x="345" y="180" width="265" height="360" rx="30" fill="#fff"/>
    <rect x="635" y="180" width="265" height="360" rx="30" fill="#fff"/>
    <rect x="925" y="180" width="220" height="360" rx="30" fill="#fff"/>
  </g>

  <g font-family="Arial,sans-serif">
    <g transform="translate(84 208)">
      <rect width="54" height="30" rx="15" fill="#fae0d8"/><text x="27" y="21" text-anchor="middle" fill="#9a5753" font-size="14" font-weight="700">1</text>
      <rect x="57" y="62" width="122" height="190" rx="22" fill="#3c3135"/><rect x="66" y="76" width="104" height="158" rx="15" fill="#fff8f2"/>
      <circle cx="118" cy="99" r="16" fill="url(#coral)"/><rect x="84" y="126" width="68" height="9" rx="5" fill="#d7ae5e"/><rect x="84" y="146" width="68" height="7" rx="4" fill="#eadfd8"/><rect x="84" y="164" width="52" height="7" rx="4" fill="#eadfd8"/>
      <text x="0" y="292" fill="#2c2427" font-size="21" font-weight="700">Prepare</text><text x="0" y="320" fill="#74666b" font-size="16">Contacts, comfort,</text><text x="0" y="342" fill="#74666b" font-size="16">feeds and notes</text>
    </g>
    <g transform="translate(374 208)">
      <rect width="54" height="30" rx="15" fill="#f4e8c8"/><text x="27" y="21" text-anchor="middle" fill="#88631d" font-size="14" font-weight="700">2</text>
      <rect x="54" y="60" width="130" height="130" rx="22" fill="#fff" stroke="#eadfd8" stroke-width="3"/>
      <g fill="#2c2427"><rect x="72" y="78" width="28" height="28"/><rect x="138" y="78" width="28" height="28"/><rect x="72" y="144" width="28" height="28"/><rect x="110" y="112" width="12" height="12"/><rect x="132" y="120" width="10" height="28"/><rect x="108" y="154" width="15" height="15"/></g>
      <rect x="34" y="215" width="170" height="44" rx="22" fill="url(#gold)"/><text x="119" y="243" text-anchor="middle" fill="#493718" font-size="16" font-weight="700">QR or private link</text>
      <text x="0" y="292" fill="#2c2427" font-size="21" font-weight="700">Share</text><text x="0" y="320" fill="#74666b" font-size="16">Scan beside you or</text><text x="0" y="342" fill="#74666b" font-size="16">send directly</text>
    </g>
    <g transform="translate(664 208)">
      <rect width="54" height="30" rx="15" fill="#e8e0f1"/><text x="27" y="21" text-anchor="middle" fill="#755b87" font-size="14" font-weight="700">3</text>
      <rect x="54" y="58" width="130" height="206" rx="24" fill="#3c3135"/><rect x="63" y="72" width="112" height="174" rx="16" fill="#f8f5fb"/>
      <rect x="78" y="92" width="82" height="12" rx="6" fill="#d9cce5"/><rect x="78" y="118" width="82" height="31" rx="15" fill="url(#coral)"/><rect x="78" y="159" width="82" height="31" rx="15" fill="#f1d79e"/><rect x="78" y="200" width="82" height="31" rx="15" fill="#c9e3dc"/>
      <text x="0" y="292" fill="#2c2427" font-size="21" font-weight="700">Open &amp; log</text><text x="0" y="320" fill="#74666b" font-size="16">Browser guide with</text><text x="0" y="342" fill="#74666b" font-size="16">big simple controls</text>
    </g>
    <g transform="translate(954 208)">
      <rect width="54" height="30" rx="15" fill="#dcece7"/><text x="27" y="21" text-anchor="middle" fill="#46796d" font-size="14" font-weight="700">4</text>
      <path d="M40 108c28-34 79-36 111-7" fill="none" stroke="#d7ae5e" stroke-width="12" stroke-linecap="round"/><path d="M145 90l12 20-23 3" fill="#d7ae5e"/>
      <rect x="29" y="135" width="150" height="112" rx="22" fill="#f8f5fb"/>
      <circle cx="56" cy="165" r="10" fill="#ef9a89"/><rect x="76" y="158" width="78" height="9" rx="5" fill="#786a70"/><circle cx="56" cy="195" r="10" fill="#d7ae5e"/><rect x="76" y="188" width="64" height="9" rx="5" fill="#786a70"/><circle cx="56" cy="225" r="10" fill="#81b7a9"/><rect x="76" y="218" width="84" height="9" rx="5" fill="#786a70"/>
      <text x="0" y="292" fill="#2c2427" font-size="21" font-weight="700">Return &amp; close</text><text x="0" y="320" fill="#74666b" font-size="16">Logs merge back;</text><text x="0" y="342" fill="#74666b" font-size="16">parent ends access</text>
    </g>
  </g>
  <g transform="translate(70 588)">
    <rect width="1060" height="78" rx="24" fill="#3c3135"/>
    <circle cx="42" cy="39" r="16" fill="#ef9a89"/><path d="M34 39l6 6 11-13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="34" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Right-sized access</text>
    <text x="76" y="56" fill="#d8ced2" font-family="Arial,sans-serif" font-size="15">No carer account. No parent password. No need to expose the rest of the app.</text>
  </g>
</svg>
