<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba recommends a Nap not happening option</title>
  <desc id="desc">A priority decision flow. If it is the last nap and bedtime is close, recommend skip. Otherwise if sleep debt is significant or the nap is at least 30 minutes overdue, recommend rescue. Otherwise if no more than 15 minutes overdue, recommend retry. Otherwise recommend rest.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff9f2"/><stop offset="1" stop-color="#edf3f2"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#3f4850" flood-opacity=".14"/></filter>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#99733f"/></marker>
  </defs>
  <rect width="1200" height="760" rx="38" fill="url(#bg)"/>
  <text x="600" y="66" text-anchor="middle" font-family="Nunito,Arial,sans-serif" font-size="34" font-weight="800" fill="#27313a">Which route gets highlighted?</text>
  <text x="600" y="101" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#687079">First matching rule wins · all four remain tappable</text>

  <g filter="url(#s)" font-family="Arial,sans-serif">
    <rect x="80" y="145" width="1040" height="104" rx="24" fill="#fff" stroke="#dfcfb8"/>
    <circle cx="133" cy="197" r="27" fill="#8a672d"/><text x="133" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1</text>
    <text x="183" y="187" font-size="24" font-weight="700" fill="#27313a">Final planned nap + bedtime close?</text>
    <text x="183" y="219" font-size="17" fill="#687079">Time to bed ≤ maximum wake window + 30 min</text>
    <rect x="860" y="166" width="220" height="62" rx="18" fill="#27313a"/><text x="970" y="204" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">🌙 Skip</text>

    <rect x="80" y="292" width="1040" height="104" rx="24" fill="#fff" stroke="#dfcfb8"/>
    <circle cx="133" cy="344" r="27" fill="#8a672d"/><text x="133" y="352" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2</text>
    <text x="183" y="334" font-size="24" font-weight="700" fill="#27313a">Significant sleep debt or ≥30 min overdue?</text>
    <text x="183" y="366" font-size="17" fill="#687079">Protect the rest of the day when bedtime is not yet close</text>
    <rect x="860" y="313" width="220" height="62" rx="18" fill="#3d7774"/><text x="970" y="351" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">🚶 Rescue</text>

    <rect x="80" y="439" width="1040" height="104" rx="24" fill="#fff" stroke="#dfcfb8"/>
    <circle cx="133" cy="491" r="27" fill="#8a672d"/><text x="133" y="499" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3</text>
    <text x="183" y="481" font-size="24" font-weight="700" fill="#27313a">Window only just opened (≤15 min overdue)?</text>
    <text x="183" y="513" font-size="17" fill="#687079">Pause the attempt and re-check after a calm reset</text>
    <rect x="860" y="460" width="220" height="62" rx="18" fill="#6d6194"/><text x="970" y="498" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">🔄 Retry</text>

    <rect x="80" y="586" width="1040" height="104" rx="24" fill="#fff" stroke="#dfcfb8"/>
    <circle cx="133" cy="638" r="27" fill="#8a672d"/><text x="133" y="646" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">4</text>
    <text x="183" y="628" font-size="24" font-weight="700" fill="#27313a">Otherwise: the 16–29 min middle ground</text>
    <text x="183" y="660" font-size="17" fill="#687079">Twenty quiet minutes; no sleep entry unless sleep actually starts</text>
    <rect x="860" y="607" width="220" height="62" rx="18" fill="#a36377"/><text x="970" y="645" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">🛏 Rest</text>
  </g>
  <path d="M600 250v32M600 397v32M600 544v32" stroke="#99733f" stroke-width="4" marker-end="url(#a)"/>
  <text x="615" y="275" font-family="Arial,sans-serif" font-size="14" fill="#99733f">NO</text>
  <text x="615" y="422" font-family="Arial,sans-serif" font-size="14" fill="#99733f">NO</text>
  <text x="615" y="569" font-family="Arial,sans-serif" font-size="14" fill="#99733f">NO</text>
</svg>
