<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba recognises a possible language burst</title>
  <desc id="desc">A recent parent note and corrected-age window are required. Reading or music logs can strengthen the evidence. The result is a transparent reflection and play nudge, not a diagnosis or first-word forecast.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9f6"/><stop offset=".52" stop-color="#f5f1ff"/><stop offset="1" stop-color="#edf9f5"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39315e"/><stop offset="1" stop-color="#664f91"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#51436e" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1200" height="760" rx="42" fill="url(#bg)"/>
  <circle cx="1080" cy="88" r="112" fill="#ffc9bd" opacity=".35"/><circle cx="92" cy="666" r="140" fill="#bce7d9" opacity=".35"/>
  <text x="74" y="82" fill="#5c4b80" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">FROM A FAMILY NOTE TO A GENTLE NUDGE</text>
  <text x="74" y="132" fill="url(#ink)" font-family="Georgia, serif" font-size="42" font-weight="700">How “Language is bubbling up” works</text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="300" height="276" rx="28" fill="#fff"/>
    <rect x="450" y="190" width="300" height="276" rx="28" fill="#fff"/>
    <rect x="830" y="190" width="300" height="276" rx="28" fill="#fff"/>
  </g>
  <circle cx="116" cy="236" r="25" fill="#f58573"/><text x="116" y="244" text-anchor="middle" fill="#fff" font-family="Arial" font-size="21" font-weight="700">1</text>
  <text x="105" y="294" fill="#39315e" font-family="Georgia, serif" font-size="28" font-weight="700">A note matches</text>
  <text x="105" y="334" fill="#6d6680" font-family="Arial" font-size="19">babble · baba · dada</text>
  <text x="105" y="365" fill="#6d6680" font-family="Arial" font-size="19">mama · consonant</text>
  <text x="105" y="396" fill="#6d6680" font-family="Arial" font-size="19">new sound · jabber</text>
  <rect x="105" y="421" width="204" height="28" rx="14" fill="#fff0ec"/><text x="207" y="441" text-anchor="middle" fill="#b54d42" font-family="Arial" font-size="14" font-weight="700">RECENT 14-DAY SCAN</text>

  <circle cx="496" cy="236" r="25" fill="#9a82df"/><text x="496" y="244" text-anchor="middle" fill="#fff" font-family="Arial" font-size="21" font-weight="700">2</text>
  <text x="485" y="294" fill="#39315e" font-family="Georgia, serif" font-size="28" font-weight="700">Age fits</text>
  <text x="485" y="345" fill="#6d6680" font-family="Arial" font-size="22">30–70 corrected weeks</text>
  <text x="485" y="386" fill="#6d6680" font-family="Arial" font-size="18">A broad app window,</text>
  <text x="485" y="414" fill="#6d6680" font-family="Arial" font-size="18">not a deadline.</text>

  <circle cx="876" cy="236" r="25" fill="#58b89b"/><text x="876" y="244" text-anchor="middle" fill="#fff" font-family="Arial" font-size="21" font-weight="700">+</text>
  <text x="865" y="294" fill="#39315e" font-family="Georgia, serif" font-size="28" font-weight="700">Context helps</text>
  <text x="865" y="345" fill="#6d6680" font-family="Arial" font-size="20">2+ reading or music logs</text>
  <text x="865" y="386" fill="#6d6680" font-family="Arial" font-size="18">Adds visible evidence.</text>
  <text x="865" y="414" fill="#6d6680" font-family="Arial" font-size="18">Cannot trigger the card alone.</text>

  <path d="M370 328 H430" stroke="#c7bce1" stroke-width="5" stroke-linecap="round"/><path d="M414 316 l16 12-16 12" fill="none" stroke="#c7bce1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M750 328 H810" stroke="#c7bce1" stroke-width="5" stroke-linecap="round"/><path d="M794 316 l16 12-16 12" fill="none" stroke="#c7bce1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)"><rect x="70" y="520" width="1060" height="164" rx="30" fill="#30294f"/></g>
  <text x="110" y="572" fill="#f7d98b" font-family="Arial" font-size="16" font-weight="700" letter-spacing="2">THE OUTPUT</text>
  <text x="110" y="620" fill="#fff" font-family="Georgia, serif" font-size="33" font-weight="700">A reflection + a language-play boost</text>
  <text x="110" y="655" fill="#dcd5ef" font-family="Arial" font-size="18">60% from note + age · 80% when reading/music context joins</text>
  <line x1="790" y1="552" x2="790" y2="655" stroke="#756c92"/>
  <text x="830" y="586" fill="#ffc9bd" font-family="Arial" font-size="16" font-weight="700">NEVER CLAIMS</text>
  <text x="830" y="620" fill="#fff" font-family="Arial" font-size="18">Diagnosis · first-word date</text>
  <text x="830" y="650" fill="#fff" font-family="Arial" font-size="18">or why sleep changed</text>
</svg>
