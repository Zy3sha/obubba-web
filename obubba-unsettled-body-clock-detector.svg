<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1660" viewBox="0 0 1000 1660" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba decides whether to show the unsettled body clock insight</title>
  <desc id="desc">A vertical flow from complete past days through bedtime range, confidence and disruption gates, ending in a hypothesis card and a reminder that the log does not prove causation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11192E"/><stop offset="1" stop-color="#252943"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#29334F"/><stop offset="1" stop-color="#1E263D"/></linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A7DDD3"/><stop offset="1" stop-color="#7CBFB9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#070B18" flood-opacity=".4"/></filter>
  </defs>
  <rect width="1000" height="1660" rx="44" fill="url(#bg)"/>
  <circle cx="850" cy="115" r="170" fill="#A7DDD3" opacity=".08"/><circle cx="120" cy="1450" r="230" fill="#E89A82" opacity=".07"/>
  <g font-family="Inter,Arial,sans-serif">
    <text x="76" y="90" fill="#A7DDD3" font-size="23" font-weight="800" letter-spacing="3">THE LIVE FLUTTER PATH</text>
    <text x="76" y="148" fill="#F8F2EA" font-family="Georgia,serif" font-size="47" font-weight="700">Does the clock card earn its place?</text>
    <text x="76" y="193" fill="#C3CAD8" font-size="22">It takes more than one late bedtime—and can still stay silent.</text>
  </g>

  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(70 248)"><rect width="860" height="148" rx="28" fill="url(#card)" stroke="#A7DDD3" stroke-opacity=".36"/><circle cx="68" cy="74" r="34" fill="url(#moon)"/><text x="68" y="84" text-anchor="middle" fill="#142035" font-size="27" font-weight="850">1</text><text x="128" y="56" fill="#F8F2EA" font-size="27" font-weight="780">Build up to 14 complete past days</text><text x="128" y="94" fill="#C6CEDC" font-size="20">Today is skipped. A day needs at least two entries</text><text x="128" y="122" fill="#C6CEDC" font-size="20">to become a profile; five profiles unlock review.</text></g>
    <path d="M500 396v35" stroke="#A7DDD3" stroke-width="5" stroke-linecap="round"/><path d="m487 423 13 14 13-14" fill="none" stroke="#A7DDD3" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(70 437)"><rect width="860" height="148" rx="28" fill="url(#card)" stroke="#A7DDD3" stroke-opacity=".36"/><circle cx="68" cy="74" r="34" fill="url(#moon)"/><text x="68" y="84" text-anchor="middle" fill="#142035" font-size="27" font-weight="850">2</text><text x="128" y="56" fill="#F8F2EA" font-size="27" font-weight="780">Find the earliest and latest bedtime</text><text x="128" y="94" fill="#C6CEDC" font-size="20">At least three bedtime values are needed.</text><text x="128" y="122" fill="#E9B19E" font-size="19" font-weight="750">One extreme night can define this range.</text></g>
    <path d="M500 585v35" stroke="#A7DDD3" stroke-width="5" stroke-linecap="round"/><path d="m487 612 13 14 13-14" fill="none" stroke="#A7DDD3" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(70 626)"><rect width="860" height="176" rx="28" fill="url(#card)" stroke="#A7DDD3" stroke-opacity=".36"/><circle cx="68" cy="88" r="34" fill="url(#moon)"/><text x="68" y="98" text-anchor="middle" fill="#142035" font-size="27" font-weight="850">3</text><text x="128" y="51" fill="#F8F2EA" font-size="27" font-weight="780">Does the span clear 90 minutes?</text><text x="128" y="91" fill="#C6CEDC" font-size="20">Under 60m = 0 · 60–89m = 1</text><text x="128" y="121" fill="#C6CEDC" font-size="20">90–149m = 2 · 150m+ = 3</text><text x="128" y="151" fill="#E9B19E" font-size="19" font-weight="750">Exactly 60 minutes is tolerated, not called chaotic.</text></g>
    <path d="M500 802v35" stroke="#A7DDD3" stroke-width="5" stroke-linecap="round"/><path d="m487 829 13 14 13-14" fill="none" stroke="#A7DDD3" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(70 843)"><rect width="860" height="160" rx="28" fill="url(#card)" stroke="#A7DDD3" stroke-opacity=".36"/><circle cx="68" cy="80" r="34" fill="url(#moon)"/><text x="68" y="90" text-anchor="middle" fill="#142035" font-size="27" font-weight="850">4</text><text x="128" y="54" fill="#F8F2EA" font-size="27" font-weight="780">Does the full review reach confidence?</text><text x="128" y="94" fill="#C6CEDC" font-size="20">Nap, wake, bedtime and other schedule scores combine.</text><text x="128" y="124" fill="#C6CEDC" font-size="20">Total 3–5 = medium · 6+ = high.</text></g>
    <path d="M500 1003v35" stroke="#A7DDD3" stroke-width="5" stroke-linecap="round"/><path d="m487 1030 13 14 13-14" fill="none" stroke="#A7DDD3" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(70 1044)"><rect width="860" height="158" rx="28" fill="url(#card)" stroke="#A7DDD3" stroke-opacity=".36"/><circle cx="68" cy="79" r="34" fill="url(#moon)"/><text x="68" y="89" text-anchor="middle" fill="#142035" font-size="27" font-weight="850">5</text><text x="128" y="54" fill="#F8F2EA" font-size="27" font-weight="780">Is a disruption the bigger story?</text><text x="128" y="94" fill="#C6CEDC" font-size="20">Strong illness, teething or developmental context</text><text x="128" y="124" fill="#E9B19E" font-size="19" font-weight="750">means comfort + hold—the clock card stays hidden.</text></g>
  </g>

  <g transform="translate(92 1260)" font-family="Inter,Arial,sans-serif"><rect width="816" height="138" rx="69" fill="#A7DDD3"/><text x="408" y="54" text-anchor="middle" fill="#142035" font-size="23" font-weight="850" letter-spacing="1">CARD MAY APPEAR</text><text x="408" y="91" text-anchor="middle" fill="#263650" font-size="21" font-weight="650">“Timing is the leading schedule hypothesis.”</text><text x="408" y="118" text-anchor="middle" fill="#263650" font-size="17">Test one flexible range for several ordinary nights.</text></g>
  <g transform="translate(70 1450)" font-family="Inter,Arial,sans-serif"><rect width="860" height="145" rx="27" fill="#312635" stroke="#E9B19E" stroke-opacity=".6"/><text x="32" y="40" fill="#E9B19E" font-size="20" font-weight="850" letter-spacing="1.5">WHAT THE LOG DOES NOT PROVE</text><text x="32" y="78" fill="#F8F2EA" font-size="21">cause · a circadian disorder · bedtime distress · sleep need</text><text x="32" y="112" fill="#CFC4CF" font-size="18">One outlier, missing bedtimes or a changing family week can shape the read.</text><text x="32" y="135" fill="#CFC4CF" font-size="18">Feeds, health, enough sleep and safer sleep come first.</text></g>
</svg>
