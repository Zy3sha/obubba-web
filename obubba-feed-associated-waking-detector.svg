<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1580" viewBox="0 0 1000 1580" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba decides whether to show the feed-associated waking insight</title>
  <desc id="desc">A five-step flow showing parenting preference, corrected age, complete nights, repeated feed-linked waking and consolidation gates, followed by a reminder that the app cannot know hunger, intake, growth or cause.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12192D"/><stop offset="1" stop-color="#242846"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27314E"/><stop offset="1" stop-color="#202740"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#080C18" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1000" height="1580" rx="44" fill="url(#bg)"/>
  <circle cx="850" cy="112" r="176" fill="#9BD9CC" opacity=".08"/><circle cx="115" cy="1370" r="220" fill="#E8A38E" opacity=".07"/>
  <text x="80" y="100" fill="#A8E0D2" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="750" letter-spacing="3">REAL FLUTTER LOGIC</text>
  <text x="80" y="158" fill="#F7F2EA" font-family="Georgia,serif" font-size="48" font-weight="700">When does the card appear?</text>
  <text x="80" y="202" fill="#BEC7D8" font-family="Inter,Arial,sans-serif" font-size="23">Every gate below must pass. Silence is a valid result.</text>

  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(70 255)"><rect width="860" height="150" rx="28" fill="url(#card)" stroke="#9BD9CC" stroke-opacity=".35"/><circle cx="70" cy="75" r="34" fill="#9BD9CC"/><text x="70" y="85" fill="#142035" font-size="28" font-weight="800" text-anchor="middle">1</text><text x="130" y="59" fill="#F7F2EA" font-size="28" font-weight="750">Guidance style allows it</text><text x="130" y="98" fill="#C5CDDC" font-size="21">Hidden for “Follow my baby’s lead”</text><text x="130" y="126" fill="#C5CDDC" font-size="21">because it frames a possible habit.</text></g>
    <path d="M500 405v34" stroke="#9BD9CC" stroke-width="5" stroke-linecap="round"/><path d="m487 431 13 14 13-14" fill="none" stroke="#9BD9CC" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(70 445)"><rect width="860" height="138" rx="28" fill="url(#card)" stroke="#9BD9CC" stroke-opacity=".35"/><circle cx="70" cy="69" r="34" fill="#9BD9CC"/><text x="70" y="79" fill="#142035" font-size="28" font-weight="800" text-anchor="middle">2</text><text x="130" y="58" fill="#F7F2EA" font-size="28" font-weight="750">At least 26 corrected weeks</text><text x="130" y="98" fill="#C5CDDC" font-size="21">The habit-framed card is blocked earlier.</text></g>
    <path d="M500 583v34" stroke="#9BD9CC" stroke-width="5" stroke-linecap="round"/><path d="m487 609 13 14 13-14" fill="none" stroke="#9BD9CC" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(70 623)"><rect width="860" height="138" rx="28" fill="url(#card)" stroke="#9BD9CC" stroke-opacity=".35"/><circle cx="70" cy="69" r="34" fill="#9BD9CC"/><text x="70" y="79" fill="#142035" font-size="28" font-weight="800" text-anchor="middle">3</text><text x="130" y="58" fill="#F7F2EA" font-size="28" font-weight="750">Five or more complete nights</text><text x="130" y="98" fill="#C5CDDC" font-size="21">Both bedtime and morning wake are required.</text></g>
    <path d="M500 761v34" stroke="#9BD9CC" stroke-width="5" stroke-linecap="round"/><path d="m487 787 13 14 13-14" fill="none" stroke="#9BD9CC" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(70 801)"><rect width="860" height="178" rx="28" fill="url(#card)" stroke="#9BD9CC" stroke-opacity=".35"/><circle cx="70" cy="89" r="34" fill="#9BD9CC"/><text x="70" y="99" fill="#142035" font-size="28" font-weight="800" text-anchor="middle">4</text><text x="130" y="55" fill="#F7F2EA" font-size="28" font-weight="750">The pattern repeats on ≥60%</text><text x="130" y="95" fill="#C5CDDC" font-size="21">Each qualifying night: 2+ wakes, 2+ feeds,</text><text x="130" y="126" fill="#C5CDDC" font-size="21">and a feed on all or all but one wake.</text><text x="130" y="157" fill="#E9B59F" font-size="19" font-weight="700">Seven usable nights means at least five must qualify.</text></g>
    <path d="M500 979v34" stroke="#9BD9CC" stroke-width="5" stroke-linecap="round"/><path d="m487 1005 13 14 13-14" fill="none" stroke="#9BD9CC" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(70 1019)"><rect width="860" height="158" rx="28" fill="url(#card)" stroke="#9BD9CC" stroke-opacity=".35"/><circle cx="70" cy="79" r="34" fill="#9BD9CC"/><text x="70" y="89" fill="#142035" font-size="28" font-weight="800" text-anchor="middle">5</text><text x="130" y="58" fill="#F7F2EA" font-size="28" font-weight="750">Longest stretch is below benchmark</text><text x="130" y="98" fill="#C5CDDC" font-size="21">Average must be more than 30 minutes below</text><text x="130" y="129" fill="#C5CDDC" font-size="21">OBubba’s age-aware consolidation reference.</text></g>
  </g>

  <g transform="translate(105 1230)" font-family="Inter,Arial,sans-serif"><rect width="790" height="120" rx="60" fill="#9BD9CC"/><text x="395" y="52" text-anchor="middle" fill="#142035" font-size="24" font-weight="800">CARD MAY APPEAR</text><text x="395" y="86" text-anchor="middle" fill="#263650" font-size="20">A pattern to explore, not an order to remove a feed</text></g>
  <g transform="translate(70 1400)" font-family="Inter,Arial,sans-serif"><rect width="860" height="115" rx="25" fill="#2E2535" stroke="#E9B59F" stroke-opacity=".55"/><text x="32" y="38" fill="#E9B59F" font-size="20" font-weight="800" letter-spacing="1.5">THE LOG CANNOT KNOW</text><text x="32" y="75" fill="#F7F2EA" font-size="22">hunger · milk transfer · daytime intake · growth · cause</text><text x="32" y="102" fill="#C9C0CB" font-size="17">Respond to the baby in front of you; ask a clinician when unsure.</text></g>
</svg>
