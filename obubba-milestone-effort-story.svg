<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">What OBubba does when a parent marks a milestone done</title>
  <desc id="desc">A four-step path shows the parent choosing a date, the milestone and date saving together, a 120-day scan of relevant activity types with a three-session minimum, and a celebration with optional preview-first sharing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a35"/>
      <stop offset="0.58" stop-color="#102c4e"/>
      <stop offset="1" stop-color="#2a2049"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173b5d"/>
      <stop offset="1" stop-color="#132946"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3a0"/>
      <stop offset="1" stop-color="#d9ae55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#010814" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#bg)"/>
  <circle cx="1450" cy="100" r="240" fill="#9d83de" opacity="0.11"/>
  <circle cx="110" cy="830" r="270" fill="#f47f70" opacity="0.07"/>

  <text x="80" y="86" fill="#ffffff" font-family="Nunito, Arial, sans-serif" font-size="49" font-weight="900">One tap becomes a family memory</text>
  <text x="80" y="132" fill="#bdc9da" font-family="Nunito, Arial, sans-serif" font-size="24">The exact Flutter path—what is saved, what is counted and what remains optional.</text>

  <path d="M390 335H448M760 335H818M1130 335H1188" stroke="#8093ad" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 11"/>
  <path d="M435 323l16 12-16 12M805 323l16 12-16 12M1175 323l16 12-16 12" fill="none" stroke="#8093ad" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="70" y="185" width="320" height="355" rx="30" fill="url(#panel)" stroke="#f47f70" stroke-width="2"/>
    <rect x="440" y="185" width="320" height="355" rx="30" fill="url(#panel)" stroke="#8fd6c4" stroke-width="2"/>
    <rect x="810" y="185" width="320" height="355" rx="30" fill="url(#panel)" stroke="#9d83de" stroke-width="2"/>
    <rect x="1180" y="185" width="350" height="355" rx="30" fill="url(#panel)" stroke="#f2cf78" stroke-width="2"/>
  </g>

  <circle cx="120" cy="238" r="29" fill="#f47f70"/>
  <text x="120" y="248" text-anchor="middle" fill="#ffffff" font-family="Nunito, Arial, sans-serif" font-size="27" font-weight="900">1</text>
  <text x="164" y="247" fill="#ffffff" font-family="Nunito, Arial, sans-serif" font-size="29" font-weight="900">Choose when</text>
  <text x="108" y="316" fill="#c5d1e0" font-family="Nunito, Arial, sans-serif" font-size="23">Today</text>
  <text x="108" y="359" fill="#c5d1e0" font-family="Nunito, Arial, sans-serif" font-size="23">Pick a past date</text>
  <text x="108" y="402" fill="#c5d1e0" font-family="Nunito, Arial, sans-serif" font-size="23">Not sure yet</text>
  <rect x="108" y="448" width="244" height="54" rx="17" fill="#f47f70" opacity="0.14"/>
  <text x="230" y="482" text-anchor="middle" fill="#ffafa6" font-family="Nunito, Arial, sans-serif" font-size="21" font-weight="800">Never invents a date</text>

  <circle cx="490" cy="238" r="29" fill="#72cdbb"/>
  <text x="490" y="248" text-anchor="middle" fill="#08233b" font-family="Nunito, Arial, sans-serif" font-size="27" font-weight="900">2</text>
  <text x="534" y="247" fill="#ffffff" font-family="Nunito, Arial, sans-serif" font-size="29" font-weight="900">Save together</text>
  <rect x="478" y="303" width="244" height="70" rx="18" fill="#72cdbb" opacity="0.12"/>
  <text x="600" y="332" text-anchor="middle" fill="#a7ebde" font-family="Nunito, Arial, sans-serif" font-size="22" font-weight="800">Milestone ID</text>
  <text x="600" y="357" text-anchor="middle" fill="#a7ebde" font-family="Nunito, Arial, sans-serif" font-size="22">+ optional date</text>
  <text x="478" y="422" fill="#c5d1e0" font-family="Nunito, Arial, sans-serif" font-size="21">Atomic family save</text>
  <text x="478" y="456" fill="#c5d1e0" font-family="Nunito, Arial, sans-serif" font-size="21">Partner-safe union</text>
  <text x="478" y="490" fill="#c5d1e0" font-family="Nunito, Arial, sans-serif" font-size="21">Unmark stays removed</text>

  <circle cx="860" cy="238" r="29" fill="#9d83de"/>
  <text x="860" y="248" text-anchor="middle" fill="#ffffff" font-family="Nunito, Arial, sans-serif" font-size="27" font-weight="900">3</text>
  <text x="904" y="247" fill="#ffffff" font-family="Nunito, Arial, sans-serif" font-size="29" font-weight="900">Look back</text>
  <text x="848" y="319" fill="#d8d0fb" font-family="Nunito, Arial, sans-serif" font-size="42" font-weight="900">120 days</text>
  <text x="848" y="358" fill="#c5d1e0" font-family="Nunito, Arial, sans-serif" font-size="20">ending on chosen date</text>
  <path d="M850 396h238" stroke="#5e7290" stroke-width="2"/>
  <text x="848" y="435" fill="#ffffff" font-family="Nunito, Arial, sans-serif" font-size="22" font-weight="800">Relevant activity only</text>
  <text x="848" y="470" fill="#c5d1e0" font-family="Nunito, Arial, sans-serif" font-size="20">≥ 3 sessions to show</text>
  <text x="848" y="503" fill="#c5d1e0" font-family="Nunito, Arial, sans-serif" font-size="20">Top 2 counts at most</text>

  <circle cx="1230" cy="238" r="29" fill="url(#gold)"/>
  <text x="1230" y="248" text-anchor="middle" fill="#382b0f" font-family="Nunito, Arial, sans-serif" font-size="27" font-weight="900">4</text>
  <text x="1274" y="247" fill="#ffffff" font-family="Nunito, Arial, sans-serif" font-size="29" font-weight="900">Celebrate</text>
  <text x="1218" y="317" fill="#f4d98f" font-family="Nunito, Arial, sans-serif" font-size="24" font-weight="900">Warm headline</text>
  <text x="1218" y="355" fill="#c5d1e0" font-family="Nunito, Arial, sans-serif" font-size="21">Supported effort chips</text>
  <text x="1218" y="393" fill="#c5d1e0" font-family="Nunito, Arial, sans-serif" font-size="21">or honest fallback</text>
  <rect x="1218" y="435" width="274" height="60" rx="18" fill="#f2cf78" opacity="0.14"/>
  <text x="1355" y="473" text-anchor="middle" fill="#f8df9e" font-family="Nunito, Arial, sans-serif" font-size="22" font-weight="900">Preview before sharing</text>

  <text x="80" y="615" fill="#ffffff" font-family="Nunito, Arial, sans-serif" font-size="28" font-weight="900">Only matching play types can become numeric highlights</text>
  <g filter="url(#shadow)">
    <rect x="70" y="655" width="350" height="158" rx="26" fill="#0e2745" stroke="#f47f70"/>
    <rect x="440" y="655" width="350" height="158" rx="26" fill="#0e2745" stroke="#8fd6c4"/>
    <rect x="810" y="655" width="350" height="158" rx="26" fill="#0e2745" stroke="#9d83de"/>
    <rect x="1180" y="655" width="350" height="158" rx="26" fill="#0e2745" stroke="#f2cf78"/>
  </g>
  <text x="100" y="702" fill="#ffaaa0" font-family="Nunito, Arial, sans-serif" font-size="23" font-weight="900">MOVEMENT</text>
  <text x="100" y="743" fill="#d1dbe7" font-family="Nunito, Arial, sans-serif" font-size="20">Tummy · play · swimming</text>
  <text x="100" y="775" fill="#d1dbe7" font-family="Nunito, Arial, sans-serif" font-size="20">Outdoor activities</text>
  <text x="470" y="702" fill="#a4e8da" font-family="Nunito, Arial, sans-serif" font-size="23" font-weight="900">LANGUAGE</text>
  <text x="470" y="743" fill="#d1dbe7" font-family="Nunito, Arial, sans-serif" font-size="20">Reading</text>
  <text x="470" y="775" fill="#d1dbe7" font-family="Nunito, Arial, sans-serif" font-size="20">Singing &amp; music</text>
  <text x="840" y="702" fill="#d5caff" font-family="Nunito, Arial, sans-serif" font-size="23" font-weight="900">SOCIAL</text>
  <text x="840" y="743" fill="#d1dbe7" font-family="Nunito, Arial, sans-serif" font-size="20">Play · music · skin-to-skin</text>
  <text x="840" y="775" fill="#d1dbe7" font-family="Nunito, Arial, sans-serif" font-size="20">Bath play</text>
  <text x="1210" y="702" fill="#f5dc99" font-family="Nunito, Arial, sans-serif" font-size="23" font-weight="900">THINKING</text>
  <text x="1210" y="743" fill="#d1dbe7" font-family="Nunito, Arial, sans-serif" font-size="20">Play</text>
  <text x="1210" y="775" fill="#d1dbe7" font-family="Nunito, Arial, sans-serif" font-size="20">Reading</text>

  <rect x="360" y="842" width="880" height="40" rx="20" fill="#07182d" opacity="0.9"/>
  <text x="800" y="869" text-anchor="middle" fill="#aebcd0" font-family="Nunito, Arial, sans-serif" font-size="19">A family memory—not skill verification, a developmental score or proof of causation.</text>
</svg>
