<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1050" viewBox="0 0 720 1050" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba ranks Today’s Play</title>
  <desc id="desc">Corrected age limits the eligible activities. Five signals then rank them: age fit, emerging skill, recent activity mix, recently achieved milestone and an active development domain. The two highest scores become Today’s little play plan.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a35"/>
      <stop offset="1" stop-color="#162c53"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffad96"/>
      <stop offset="1" stop-color="#f47f70"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020b1c" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect width="720" height="1050" rx="34" fill="url(#bg)"/>
  <circle cx="655" cy="58" r="112" fill="#9d83de" opacity=".09"/>
  <circle cx="42" cy="995" r="128" fill="#f47f70" opacity=".07"/>

  <text x="46" y="58" fill="#a7e0da" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2.1">CURRENT FLUTTER LOGIC</text>
  <text x="46" y="102" fill="#fff2da" font-family="Georgia, serif" font-size="34" font-weight="700">How Today’s Play</text>
  <text x="46" y="142" fill="#fff2da" font-family="Georgia, serif" font-size="34" font-weight="700">earns its place</text>
  <text x="46" y="176" fill="#c7cede" font-family="Inter, Arial, sans-serif" font-size="17">A ranking of suitable ideas—not a developmental test.</text>

  <g filter="url(#shadow)">
    <rect x="46" y="212" width="628" height="118" rx="24" fill="#fffaf2"/>
    <circle cx="92" cy="271" r="25" fill="#315f71"/>
    <text x="92" y="279" text-anchor="middle" fill="#fff4de" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900">1</text>
    <text x="132" y="256" fill="#27334a" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="850">BUILD THE ELIGIBLE SHELF</text>
    <text x="132" y="285" fill="#586078" font-family="Inter, Arial, sans-serif" font-size="16">Corrected age first · four weeks of slack</text>
    <text x="132" y="309" fill="#315f71" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800">No usable age → no ranking</text>
  </g>

  <text x="46" y="379" fill="#fff2da" font-family="Georgia, serif" font-size="25" font-weight="700">2 · Score every eligible idea</text>

  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(46 408)">
      <rect width="628" height="92" rx="20" fill="#fffaf2"/>
      <rect width="9" height="92" rx="5" fill="#91d6c7"/>
      <text x="30" y="38" fill="#27334a" font-size="18" font-weight="850">Age fit</text>
      <text x="570" y="42" text-anchor="end" fill="#315f71" font-size="28" font-weight="900">20%</text>
      <text x="30" y="67" fill="#586078" font-size="15">Full score inside the activity’s age band</text>
    </g>
    <g transform="translate(46 514)">
      <rect width="628" height="92" rx="20" fill="#fffaf2"/>
      <rect width="9" height="92" rx="5" fill="#f47f70"/>
      <text x="30" y="38" fill="#27334a" font-size="18" font-weight="850">Emerging skill</text>
      <text x="570" y="42" text-anchor="end" fill="#a34f45" font-size="28" font-weight="900">35%</text>
      <text x="30" y="67" fill="#586078" font-size="15">Age-due milestone, not yet marked achieved</text>
    </g>
    <g transform="translate(46 620)">
      <rect width="628" height="92" rx="20" fill="#fffaf2"/>
      <rect width="9" height="92" rx="5" fill="#c99d61"/>
      <text x="30" y="38" fill="#27334a" font-size="18" font-weight="850">Recent activity mix</text>
      <text x="570" y="42" text-anchor="end" fill="#876b43" font-size="28" font-weight="900">30%</text>
      <text x="30" y="67" fill="#586078" font-size="15">Share of recognised logs across 14 days</text>
    </g>
    <g transform="translate(46 726)">
      <rect width="628" height="92" rx="20" fill="#fffaf2"/>
      <rect width="9" height="92" rx="5" fill="#9d83de"/>
      <text x="30" y="38" fill="#27334a" font-size="18" font-weight="850">Consolidation</text>
      <text x="570" y="42" text-anchor="end" fill="#665299" font-size="28" font-weight="900">15%</text>
      <text x="30" y="67" fill="#586078" font-size="15">Related milestone dated in the recent window</text>
    </g>
    <g transform="translate(46 832)">
      <rect width="628" height="92" rx="20" fill="#fffaf2"/>
      <rect width="9" height="92" rx="5" fill="#739fce"/>
      <text x="30" y="38" fill="#27334a" font-size="18" font-weight="850">Active development domain</text>
      <text x="570" y="42" text-anchor="end" fill="#416f9f" font-size="28" font-weight="900">+25%</text>
      <text x="30" y="67" fill="#586078" font-size="15">Additive boost only when a signal maps cleanly</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="116" y="958" width="488" height="64" rx="27" fill="url(#cta)"/>
    <circle cx="158" cy="990" r="21" fill="#fff4de" opacity=".95"/>
    <text x="158" y="998" text-anchor="middle" fill="#a34f45" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="900">2</text>
    <text x="194" y="985" fill="#17233b" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="900">SHOW THE TWO HIGHEST</text>
    <text x="194" y="1008" fill="#27334a" font-family="Inter, Arial, sans-serif" font-size="14">The parent can ignore both.</text>
  </g>

  <text x="360" y="1040" text-anchor="middle" fill="#aeb9ce" font-family="Inter, Arial, sans-serif" font-size="12">A score ranks invitations. It cannot observe ability, enjoyment or progress.</text>
</svg>
