<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1260" viewBox="0 0 1000 1260" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba compares home and away days with the night that follows</title>
  <desc id="desc">A portrait visual showing Daycare, Nursery, Grandparents and Travel nights compared with Home nights. The app needs at least four of each and only surfaces a card when average night wakes differ by one or more.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9f4"/>
      <stop offset="0.52" stop-color="#f7eef2"/>
      <stop offset="1" stop-color="#e9f4f0"/>
    </linearGradient>
    <linearGradient id="away" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1ea"/>
      <stop offset="1" stop-color="#f2d8e1"/>
    </linearGradient>
    <linearGradient id="home" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf8f4"/>
      <stop offset="1" stop-color="#d7ece6"/>
    </linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35293d"/>
      <stop offset="1" stop-color="#58435f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#392b3e" flood-opacity="0.14"/>
    </filter>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; fill: #33283a; }
      .sans { font-family: Arial, Helvetica, sans-serif; fill: #4f4353; }
      .eyebrow { font-size: 20px; font-weight: 800; letter-spacing: 2.6px; }
      .title { font-size: 54px; font-weight: 700; }
      .subtitle { font-size: 26px; }
      .cardTitle { font-size: 34px; font-weight: 800; }
      .body { font-size: 27px; }
      .small { font-size: 23px; }
      .pill { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }
    </style>
  </defs>

  <rect width="1000" height="1260" rx="42" fill="url(#bg)"/>
  <circle cx="902" cy="106" r="150" fill="#c07088" opacity="0.09"/>
  <circle cx="84" cy="1170" r="170" fill="#5f9b8e" opacity="0.10"/>

  <text x="500" y="68" text-anchor="middle" class="sans eyebrow" fill="#9a5269">ONE DAY → THE NIGHT THAT FOLLOWS</text>
  <text x="500" y="132" text-anchor="middle" class="serif title">What OBubba compares</text>
  <text x="500" y="179" text-anchor="middle" class="sans subtitle">Context paired with real night wakes</text>

  <g filter="url(#shadow)">
    <rect x="90" y="235" width="820" height="255" rx="34" fill="url(#away)" stroke="#c07088" stroke-opacity="0.34" stroke-width="2"/>
  </g>
  <g transform="translate(135 275)">
    <circle cx="46" cy="46" r="46" fill="#c07088"/>
    <path d="M20 55h52M28 55V32h36v23M38 32V20h16v12M34 64h9v14h-9zm23 0h9v14h-9z" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="125" y="38" class="sans cardTitle">Away-context nights</text>
    <text x="125" y="78" class="sans small">Daycare · Nursery · Grandparents · Travel</text>
    <rect x="0" y="120" width="190" height="48" rx="24" fill="#fff" opacity="0.88"/>
    <text x="95" y="151" text-anchor="middle" class="sans pill" fill="#8e4f64">AT LEAST 4</text>
    <text x="220" y="151" class="sans body">Average the genuine wakes after these days.</text>
  </g>

  <g>
    <line x1="500" y1="505" x2="500" y2="550" stroke="#c8943e" stroke-width="5" stroke-linecap="round"/>
    <circle cx="500" cy="578" r="38" fill="#fffaf2" stroke="#c8943e" stroke-width="3"/>
    <text x="500" y="588" text-anchor="middle" class="serif" font-size="31" font-weight="700">vs</text>
    <line x1="500" y1="616" x2="500" y2="650" stroke="#c8943e" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="665" width="820" height="235" rx="34" fill="url(#home)" stroke="#5f9b8e" stroke-opacity="0.36" stroke-width="2"/>
  </g>
  <g transform="translate(135 705)">
    <circle cx="46" cy="46" r="46" fill="#5f9b8e"/>
    <path d="M18 52 46 27l28 25M26 48v32h40V48M40 80V60h13v20" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="125" y="38" class="sans cardTitle">Home-context nights</text>
    <text x="125" y="78" class="sans small">Ordinary days labelled Home</text>
    <rect x="0" y="115" width="190" height="48" rx="24" fill="#fff" opacity="0.88"/>
    <text x="95" y="146" text-anchor="middle" class="sans pill" fill="#477f73">AT LEAST 4</text>
    <text x="220" y="146" class="sans body">Average the genuine wakes after home days.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="965" width="820" height="210" rx="36" fill="url(#result)"/>
  </g>
  <text x="500" y="1012" text-anchor="middle" class="sans eyebrow" fill="#f0c46a">THE GUARDRAIL</text>
  <text x="500" y="1062" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#ffffff">Speak only when the gap reaches</text>
  <text x="500" y="1105" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#ffffff">at least 1 wake per night</text>
  <text x="500" y="1150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#efe8f2">Rougher · Calmer · No difference means no card</text>

  <text x="500" y="1223" text-anchor="middle" class="sans small" fill="#716578">Sick days stay outside the comparison</text>
  <text x="500" y="1251" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#716578">An association is a clue, not proof of cause</text>
</svg>
