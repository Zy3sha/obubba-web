<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1580" viewBox="0 0 1000 1580" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba builds a baby sleep quality score</title>
  <desc id="desc">A vertical explanation showing the complete-night gate, four weighted score components, age-aware adjustments, and the weekly average limitation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9f5"/>
      <stop offset="0.52" stop-color="#f8f1ff"/>
      <stop offset="1" stop-color="#edf9f6"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35284f"/>
      <stop offset="1" stop-color="#172b4d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#342b45" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1000" height="1580" rx="44" fill="url(#bg)"/>
  <circle cx="82" cy="95" r="28" fill="#f28b7c"/>
  <path d="M72 95c16-22 34 0 0 19 8-7 11-13 0-19z" fill="#fff" opacity="0.95"/>
  <text x="128" y="88" fill="#9b4e5c" font-family="Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2">INSIDE THE FLUTTER REPORT</text>
  <text x="70" y="154" fill="#30283b" font-family="Georgia, serif" font-size="44" font-weight="700">One percentage, four logged signals</text>
  <text x="70" y="200" fill="#6d6474" font-family="Arial, sans-serif" font-size="25">A description of recorded night shape—not a grade.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="252" width="860" height="184" rx="30" fill="#ffffff" stroke="#c9b7de" stroke-width="2"/>
    <rect x="70" y="252" width="18" height="184" rx="9" fill="#a779d4"/>
    <text x="120" y="307" fill="#60447e" font-family="Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="1.4">FIRST: CAN THIS NIGHT BE SCORED?</text>
    <text x="120" y="354" fill="#30283b" font-family="Georgia, serif" font-size="34" font-weight="700">Bedtime + morning wake</text>
    <text x="120" y="396" fill="#6d6474" font-family="Arial, sans-serif" font-size="24">The span must be plausible: 6–16 hours.</text>
    <rect x="690" y="296" width="186" height="84" rx="22" fill="#f5effa"/>
    <text x="783" y="331" text-anchor="middle" fill="#60447e" font-family="Arial, sans-serif" font-size="19" font-weight="800">MISSING?</text>
    <text x="783" y="361" text-anchor="middle" fill="#30283b" font-family="Arial, sans-serif" font-size="22" font-weight="800">No score</text>
  </g>

  <path d="M500 442v50" stroke="#8d789f" stroke-width="5" stroke-linecap="round"/>
  <path d="M484 484l16 27 16-27" fill="#8d789f"/>

  <g filter="url(#shadow)">
    <rect x="70" y="510" width="410" height="220" rx="30" fill="#fff" stroke="#c9b7de" stroke-width="2"/>
    <circle cx="132" cy="574" r="34" fill="#efe5f8"/>
    <text x="132" y="585" text-anchor="middle" fill="#704a98" font-family="Arial, sans-serif" font-size="28" font-weight="900">1</text>
    <text x="186" y="565" fill="#30283b" font-family="Georgia, serif" font-size="31" font-weight="700">Wake count</text>
    <text x="186" y="604" fill="#704a98" font-family="Arial, sans-serif" font-size="25" font-weight="900">30%</text>
    <text x="106" y="662" fill="#6d6474" font-family="Arial, sans-serif" font-size="22">Fewer recorded wakes score higher.</text>
    <text x="106" y="696" fill="#6d6474" font-family="Arial, sans-serif" font-size="22">Expectations change with age.</text>

    <rect x="520" y="510" width="410" height="220" rx="30" fill="#fff" stroke="#a9d9d2" stroke-width="2"/>
    <circle cx="582" cy="574" r="34" fill="#e5f6f2"/>
    <text x="582" y="585" text-anchor="middle" fill="#277f76" font-family="Arial, sans-serif" font-size="28" font-weight="900">2</text>
    <text x="636" y="565" fill="#30283b" font-family="Georgia, serif" font-size="31" font-weight="700">Longest stretch</text>
    <text x="636" y="604" fill="#277f76" font-family="Arial, sans-serif" font-size="25" font-weight="900">30%</text>
    <text x="556" y="662" fill="#6d6474" font-family="Arial, sans-serif" font-size="22">Measured as a share of the night.</text>
    <text x="556" y="696" fill="#6d6474" font-family="Arial, sans-serif" font-size="22">Target rises as baby grows.</text>

    <rect x="70" y="758" width="410" height="220" rx="30" fill="#fff" stroke="#f2c1b6" stroke-width="2"/>
    <circle cx="132" cy="822" r="34" fill="#fff0eb"/>
    <text x="132" y="833" text-anchor="middle" fill="#aa5a4c" font-family="Arial, sans-serif" font-size="28" font-weight="900">3</text>
    <text x="186" y="813" fill="#30283b" font-family="Georgia, serif" font-size="31" font-weight="700">Time awake</text>
    <text x="186" y="852" fill="#aa5a4c" font-family="Arial, sans-serif" font-size="25" font-weight="900">25%</text>
    <text x="106" y="910" fill="#6d6474" font-family="Arial, sans-serif" font-size="22">Uses explicitly timed awake minutes.</text>
    <text x="106" y="944" fill="#6d6474" font-family="Arial, sans-serif" font-size="22">20% of night awake → zero here.</text>

    <rect x="520" y="758" width="410" height="220" rx="30" fill="#fff" stroke="#e7cf91" stroke-width="2"/>
    <circle cx="582" cy="822" r="34" fill="#fff6d9"/>
    <text x="582" y="833" text-anchor="middle" fill="#8e6b12" font-family="Arial, sans-serif" font-size="28" font-weight="900">4</text>
    <text x="636" y="813" fill="#30283b" font-family="Georgia, serif" font-size="31" font-weight="700">Night sleep</text>
    <text x="636" y="852" fill="#8e6b12" font-family="Arial, sans-serif" font-size="25" font-weight="900">15%</text>
    <text x="556" y="910" fill="#6d6474" font-family="Arial, sans-serif" font-size="22">Night span minus logged awake time.</text>
    <text x="556" y="944" fill="#6d6474" font-family="Arial, sans-serif" font-size="22">Age-aware floor: 7h, 9h or 10h.</text>
  </g>

  <path d="M500 990v50" stroke="#8d789f" stroke-width="5" stroke-linecap="round"/>
  <path d="M484 1032l16 27 16-27" fill="#8d789f"/>

  <g filter="url(#shadow)">
    <rect x="70" y="1058" width="860" height="200" rx="32" fill="url(#night)"/>
    <text x="500" y="1113" text-anchor="middle" fill="#f4c96b" font-family="Arial, sans-serif" font-size="21" font-weight="900" letter-spacing="1.6">ONE NIGHT</text>
    <text x="500" y="1172" text-anchor="middle" fill="#fff" font-family="Georgia, serif" font-size="50" font-weight="700">Weighted score → 0–100</text>
    <text x="500" y="1218" text-anchor="middle" fill="#d8d2e7" font-family="Arial, sans-serif" font-size="23">Restful 80+ · Settled 60+ · Unsettled 40+ · Rough &lt;40</text>
  </g>

  <path d="M500 1266v44" stroke="#8d789f" stroke-width="5" stroke-linecap="round"/>
  <path d="M484 1302l16 27 16-27" fill="#8d789f"/>

  <g filter="url(#shadow)">
    <rect x="70" y="1328" width="860" height="180" rx="30" fill="#fff" stroke="#c9b7de" stroke-width="2"/>
    <text x="110" y="1382" fill="#60447e" font-family="Arial, sans-serif" font-size="22" font-weight="900" letter-spacing="1.2">THE 7-NIGHT REPORT</text>
    <text x="110" y="1431" fill="#30283b" font-family="Georgia, serif" font-size="34" font-weight="700">Average only the nights with a score</text>
    <rect x="110" y="1451" width="780" height="36" rx="18" fill="#fff0eb"/>
    <text x="500" y="1477" text-anchor="middle" fill="#8e493e" font-family="Arial, sans-serif" font-size="19" font-weight="800">Current caveat: even 1 valid night can be labelled “weekly average”</text>
  </g>
  <text x="500" y="1550" text-anchor="middle" fill="#756b7d" font-family="Arial, sans-serif" font-size="18">Current scope: parent-entered logs · no wearable or medical measurements</text>
</svg>
