<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Bubba Care</title>
<meta name="theme-color" content="#FFFCF9"/>
<!-- Carer portal is live-updating. Prevent stale HTML from being served
     by CDN/browser cache so bug fixes and UI changes reach carers on
     their next visit without a hard refresh. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: #FFFCF9; font-family: -apple-system, "SF Pro Display", system-ui, sans-serif; color: #4A3B35; min-height: 100vh; }
  body { background: radial-gradient(ellipse 80% 50% at 15% 8%,rgba(245,218,210,0.35),transparent 60%), radial-gradient(ellipse 60% 45% at 85% 12%,rgba(240,210,200,0.25),transparent 60%), linear-gradient(170deg,#FFFCF9 0%,#F8F0E8 50%,#F5E8E0 100%); background-attachment: fixed; padding: max(16px, env(safe-area-inset-top, 16px)) 16px max(16px, env(safe-area-inset-bottom, 16px)); max-width: 560px; margin: 0 auto; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; padding: 0 4px; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .header-photo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.8); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .header-name { font-family: "Playfair Display", Georgia, serif; font-weight: 700; font-size: 17px; color: #4A3B35; }
  .header-age { font-size: 11px; color: #6E645C; margin-top: 1px; }
  .logo { font-family: "Parisienne", cursive; font-weight: 400; font-size: 28px; color: #4A3B35; letter-spacing: -0.01em; }
  .sub { font-size: 11px; color: #6E645C; margin-top: 1px; }
  /* Sticky status bar */
  .status-bar { position: sticky; top: 0; z-index: 50; margin: 0 -16px 14px; padding: 12px 20px; backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); border-bottom: 1px solid rgba(0,0,0,0.06); }
  .status-bar .status-row { display: flex; align-items: center; gap: 10px; }
  .status-bar .status-icon { font-size: 24px; }
  .status-bar .status-text { font-size: 14px; font-weight: 700; color: #4A3B35; }
  .status-bar .status-sub { font-size: 11px; color: #6E645C; }
  .status-bar .status-timer { font-family: ui-monospace, monospace; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; text-align: center; margin: 6px 0 2px; }
  .status-bar .status-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .status-bar .status-pill { padding: 4px 10px; border-radius: 99px; background: rgba(255,255,255,0.7); border: 1px solid rgba(0,0,0,0.06); font-size: 11px; font-weight: 600; color: #4A3B35; }
  /* Cards */
  .card { background: rgba(255,255,255,0.55); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); border: 1px solid rgba(255,255,255,0.65); border-radius: 20px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 0 rgba(255,255,255,0.9) inset, 0 8px 24px -12px rgba(160,110,100,0.15); }
  .caring-banner { background: linear-gradient(135deg,rgba(155,184,168,0.12),rgba(155,184,168,0.04)); border: 1px solid rgba(155,184,168,0.3); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; text-align: center; }
  .caring-banner .title { font-family: "Playfair Display", serif; font-style: italic; font-size: 15px; font-weight: 700; color: #4A3B35; margin-bottom: 2px; }
  .caring-banner .text { font-size: 12px; color: #6A8A7A; line-height: 1.5; }
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .action-btn { padding: 20px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.7); background: rgba(255,255,255,0.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); cursor: pointer; font-size: 16px; font-weight: 700; color: #4A3B35; display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 100px; font-family: inherit; transition: transform 0.1s; box-shadow: 0 1px 0 rgba(255,255,255,0.9) inset, 0 6px 16px -8px rgba(160,110,100,0.15); }
  .action-btn:active { transform: scale(0.96); }
  .action-btn .icon { font-size: 32px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.1)); }
  .action-btn .label { font-size: 13px; font-weight: 700; letter-spacing: 0.02em; }
  .action-btn.active { background: rgba(192,112,136,0.08); border-color: rgba(192,112,136,0.3); }
  /* Smart wake button adapts label */
  .action-btn.wake-night { border-color: rgba(123,104,238,0.3); background: rgba(123,104,238,0.06); }
  .action-btn.wake-nap { border-color: rgba(139,126,200,0.3); background: rgba(139,126,200,0.06); }
  /* Mood chips */
  .mood-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .mood-chip { padding: 8px 14px; border-radius: 99px; border: 1px solid rgba(255,255,255,0.6); background: rgba(255,255,255,0.5); font-size: 12px; font-weight: 600; color: #4A3B35; cursor: pointer; display: flex; align-items: center; gap: 5px; }
  .mood-chip:active { transform: scale(0.96); }
  .mood-chip.selected { background: rgba(192,112,136,0.1); border-color: rgba(192,112,136,0.3); }
  .section-label { font-size: 14px; font-weight: 700; color: #7A5C52; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
  .entry { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #FBF5F0; border: 1px solid #E8DED3; margin-bottom: 6px; font-size: 14px; }
  .entry .emoji { font-size: 18px; }
  .entry .label { flex: 1; font-weight: 600; color: #4A3B35; }
  .entry .time { font-size: 12px; color: #7A5C52; font-family: ui-monospace, monospace; }
  .sheet { position: fixed; inset: 0; background: rgba(44,31,26,0.5); z-index: 100; display: flex; align-items: flex-end; }
  .sheet-inner { background: #FFFCF9; border-radius: 28px 28px 0 0; padding: 24px 20px max(24px, env(safe-area-inset-bottom,24px)); width: 100%; max-width: 560px; margin: 0 auto; }
  .sheet-handle { width: 40px; height: 4px; background: #E8DED3; border-radius: 99px; margin: 0 auto 18px; }
  .sheet-title { font-family: "Playfair Display", Georgia, serif; font-size: 22px; font-weight: 700; color: #4A3B35; text-align: center; margin-bottom: 14px; }
  .amount-display { font-size: 54px; font-weight: 700; color: #C07088; text-align: center; font-family: ui-monospace, monospace; margin-bottom: 10px; }
  .amount-display .unit { font-size: 20px; color: #6E645C; font-weight: 600; margin-left: 4px; }
  .amount-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .amt-btn { padding: 14px; border-radius: 14px; border: 2px solid #E8DED3; background: #FFFDFA; font-size: 18px; font-weight: 700; color: #4A3B35; cursor: pointer; font-family: inherit; }
  .amt-btn.plus { border-color: #C07088; color: #C07088; background: rgba(192,112,136,0.06); }
  .amt-btn:active { transform: scale(0.96); }
  .opt-btn { width: 100%; padding: 18px; border-radius: 14px; border: 2px solid #E8DED3; background: #FFFDFA; font-size: 18px; font-weight: 700; color: #4A3B35; cursor: pointer; font-family: inherit; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 12px; }
  .opt-btn .emoji { font-size: 24px; }
  .save-btn { width: 100%; padding: 18px; border-radius: 99px; border: none; background: linear-gradient(135deg,#C07088,#a85a44); color: white; font-size: 17px; font-weight: 700; cursor: pointer; font-family: inherit; box-shadow: 0 4px 14px rgba(192,112,136,0.25); }
  .cancel-btn { width: 100%; padding: 12px; border-radius: 99px; border: none; background: transparent; color: #6E645C; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 8px; }
  .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: #4A3B35; color: #FAF6F0; padding: 12px 18px; border-radius: 99px; font-size: 14px; font-weight: 600; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,0.2); opacity: 0; transition: opacity 0.2s; }
  .toast.show { opacity: 1; }
  .error-screen { padding: 40px 24px; text-align: center; }
  .error-screen .icon { font-size: 48px; margin-bottom: 16px; }
  .error-screen h2 { font-family: "Playfair Display", serif; font-size: 22px; color: #4A3B35; margin-bottom: 8px; }
  .error-screen p { font-size: 14px; color: #7A5C52; line-height: 1.6; }
  .loading { padding: 60px 20px; text-align: center; color: #7A5C52; }
  .parent-note { background: rgba(212,168,133,0.08); border: 1px solid rgba(212,168,133,0.3); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; color: #4A3B35; line-height: 1.55; }
  .parent-note .pn-label { font-size: 10px; font-weight: 700; color: #A88848; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; }
  .call-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 13px 16px; border-radius: 14px; border: 1.5px solid #9BB8A8; background: rgba(155,184,168,0.08); color: #4A3B35; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; text-decoration: none; margin-bottom: 6px; }
  .call-btn .emoji { font-size: 20px; }
  .call-btn .name { flex: 1; text-align: left; }
  .call-btn .arrow { color: #9BB8A8; font-size: 18px; }
  .reassurance-item { padding: 12px 14px; border-radius: 12px; background: #FBF5F0; border: 1px solid #E8DED3; margin-bottom: 8px; }
  .reassurance-item .q { font-size: 14px; font-weight: 700; color: #4A3B35; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .reassurance-item .a { font-size: 13px; color: #6A584E; line-height: 1.55; }
  details.reassurance-item summary { list-style: none; cursor: pointer; -webkit-user-select: none; user-select: none; }
  details.reassurance-item summary::-webkit-details-marker { display: none; }
  details.reassurance-item[open] summary { margin-bottom: 6px; }
  details.reassurance-item summary::after { content: "▼"; margin-left: auto; font-size: 10px; color: #6E645C; transition: transform 0.2s; }
  details.reassurance-item[open] summary::after { transform: rotate(180deg); }
  details.reassurance-item summary .q { display: flex; align-items: center; gap: 6px; width: 100%; margin-bottom: 0; }
  details.reassurance-item summary .q::after { content: "▼"; margin-left: auto; font-size: 10px; color: #6E645C; transition: transform 0.2s; }
  details.reassurance-item[open] summary .q::after { transform: rotate(180deg); }
  /* Floating call button */
  .fab-call { position: fixed; bottom: max(24px, env(safe-area-inset-bottom, 24px)); right: 20px; width: 56px; height: 56px; border-radius: 50%; background: #9BB8A8; color: white; font-size: 24px; border: none; cursor: pointer; box-shadow: 0 6px 20px rgba(155,184,168,0.4); z-index: 90; display: flex; align-items: center; justify-content: center; }
  .fab-call:active { transform: scale(0.92); }
  /* Dark mode */
  @media (prefers-color-scheme: dark) {
    html, body { background: #1C1820; color: #E8DDE0; }

    .header .logo { color: #E8DDE0; }
    .header .sub { color: #6B6473; }
    .caring-banner { background: rgba(155,184,168,0.1); border-color: rgba(155,184,168,0.25); }
    .caring-banner .title { color: #E8DDE0; }
    .action-btn { background: #2A2430; border-color: #3A2E35; color: #E8DDE0; }
    .action-btn:active { background: #352E3A; }
    .action-btn.active { background: rgba(155,184,168,0.15); }
    .entry { background: #2A2430; border-color: #3A2E35; }
    .entry .label { color: #E8DDE0; }
    .entry .time { color: #6B6473; }
    .section-label { color: #6B6473; }
    .parent-note { background: rgba(212,168,133,0.06); border-color: rgba(212,168,133,0.2); color: #E8DDE0; }
    .reassurance-item { background: #2A2430; border-color: #3A2E35; }
    .reassurance-item .q { color: #E8DDE0; }
    .reassurance-item .a { color: #C8B8C0; }
    .sheet-inner { background: #1C1820; }
    .sheet-handle { background: #3A2E35; }
    .opt-btn { background: #2A2430; border-color: #3A2E35; color: #E8DDE0; }
    .save-btn { background: linear-gradient(135deg,#C07088,#a85a44); }
    .amt-btn { background: #2A2430; border-color: #3A2E35; color: #E8DDE0; }
    .call-btn { background: rgba(155,184,168,0.08); border-color: rgba(155,184,168,0.3); color: #E8DDE0; }
    .toast { background: #E8DDE0; color: #1C1820; }
  }

  /* 2026 BubbaCare clarity pass — a calm, grandparent-friendly care cockpit. */
  :root {

    --care-night-2:#102b55;

    --care-ink:#112747;

    --care-mint:#bcebd8;
    --care-peach:#ffae91;
    --care-lilac:#cdb9ff;
  }
  html,body{background:var(--care-night);color:var(--care-cream)}

      radial-gradient(circle at 16% 6%,rgba(255,255,255,.85) 0 1px,transparent 2px),

  }

  #app{position:relative;z-index:1}

  .card,.status-bar{background:rgba(255,250,241,.98)!important;color:var(--care-ink);border:1px solid rgba(237,195,109,.44)!important;box-shadow:0 15px 38px rgba(0,0,0,.19),inset 0 1px #fff!important;border-radius:24px!important}

  /* The readiness meter, drawn from the app's own four zones. Same reading as
     the bar on the parent's clock: green is the window, amber is watch for
     cues, coral is past it. */
  .ready{position:relative;margin-top:15px;padding:16px 15px 14px;border:1px solid rgba(129,106,189,.28);border-radius:20px;background:linear-gradient(145deg,#f8f3ff,#eee5ff 56%,#fff4e6);box-shadow:inset 0 1px #fff,0 9px 22px rgba(72,52,116,.10);overflow:hidden}.ready:before{content:"";position:absolute;width:105px;height:105px;right:-35px;top:-48px;border-radius:50%;background:radial-gradient(circle,rgba(255,218,132,.40),transparent 70%);pointer-events:none}

  .ready-label{font-family:"Playfair Display",Georgia,serif;font-size:18px;font-weight:700;color:#172b50}.ready-label:before{content:"✦";display:inline-grid;place-items:center;width:27px;height:27px;margin-right:8px;border-radius:50%;background:linear-gradient(145deg,#6654a4,#ae8de2);color:#fff3c5;font-family:Georgia;box-shadow:0 5px 12px rgba(72,52,116,.20)}

  /* ── The owner's reference design, 15 Oct 2026 ───────────────────────────

<div id="app"><div class="loading">Loading…</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, query, orderBy, limit, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCdHzmheQRbtzP_JI1FuWcZLeW8yVja5-0",
  authDomain: "obubba-d9ccc.firebaseapp.com",
  projectId: "obubba-d9ccc",
  storageBucket: "obubba-d9ccc.firebasestorage.app",
  messagingSenderId: "1091432133381",
  appId: "1:1091432133381:web:1cd4d0ce7397affeae7d6c"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Parse URL params
const params = new URLSearchParams(window.location.search);
const rawCode = (params.get("code") || "").toUpperCase().trim();
const childId = (params.get("child") || "").trim();

// resolvedCode will be set to the actual backup code (BK...) after CT token lookup
let code = rawCode;

const $app = document.getElementById("app");

if (!rawCode || rawCode.length < 4) {
  $app.innerHTML = `
    <div class="error-screen">
      <div class="icon">🔑</div>
      <h2>Invalid care link</h2>
      <p>This link is missing the access code. Please ask the parent to share a fresh link via the OBubba app.</p>
    </div>`;
} else {
  // Sign in anonymously, load context, then render
  signInAnonymously(auth).then(async () => {
    // If code is a CT token, look up the real backup code.
    // If code starts with "BK", it's already a backup code (new simpler flow).
    if (rawCode.startsWith("CT")) {
      let _resolvedToken = false;
      try {
        const _tokenDoc = await getDoc(doc(db, "carer_tokens", rawCode));
        if (_tokenDoc.exists() && _tokenDoc.data().backupCode) {
          code = _tokenDoc.data().backupCode;
          _resolvedToken = true;
        }
      } catch(e) { console.warn("CT token lookup failed", e); }
      if (!_resolvedToken) {
        $app.innerHTML = `
          <div class="error-screen">
            <div class="icon">⏳</div>
            <h2>Care link expired</h2>
            <p>This Bubba Care link has expired. Please ask the parent to share a fresh link from OBubba.</p>
          </div>`;
        return;
      }
    }
    // BK codes work directly — no lookup needed

    // ═══ CHECK SESSION LOCK BEFORE RENDERING ═══
    var _sessionLocked = false;
    var _lockedHtml = `
      <div style="text-align:center;padding:80px 24px;min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div style="font-size:48px;margin-bottom:16px">🔒</div>
        <h2 style="font-family:'Playfair Display',Georgia,serif;font-size:22px;color:#4A3B35;margin-bottom:8px">Session ended</h2>
        <p style="font-size:14px;color:#6E645C;line-height:1.6;max-width:280px">The parent has ended this Bubba Care session. Thank you for looking after their little one.</p>
      </div>`;
    function _lockPortal() {
      _sessionLocked = true;
      document.getElementById("app").innerHTML = _lockedHtml;
      if (_familyUnsub) { _familyUnsub(); _familyUnsub = null; }
    }
    // Check session doc BEFORE loading any data
    try {
      var _sessionSnap = await getDoc(doc(db, "carer_logs", code, "_meta", "session"));
      if (_sessionSnap.exists() && _sessionSnap.data().ended) {
        _lockPortal();
        // Still listen for reopen
        onSnapshot(doc(db, "carer_logs", code, "_meta", "session"), (snap) => {
          if (!snap.exists() && _sessionLocked) { _sessionLocked = false; location.reload(); }
        });
        return; // Don't load or render anything
      }
    } catch(e) { console.warn("Session check error", e); }

    // Session is open — proceed with loading
    await loadFamilyContext();
    renderApp();
    subscribeFamilyContext();

    // Live listener for real-time lock while portal is open
    try {
      onSnapshot(doc(db, "carer_logs", code, "_meta", "session"), (snap) => {
        if (snap.exists() && snap.data().ended) {
          _lockPortal();
        } else if (!snap.exists() && _sessionLocked) {
          _sessionLocked = false;
          location.reload();
        }
      });
    } catch(e) { console.warn("Session listener error", e); }
  }).catch((err) => {
    console.error("Auth failed", err);
    $app.innerHTML = `
      <div class="error-screen">
        <div class="icon">📡</div>
        <h2>Can't connect</h2>
        <p>We couldn't reach OBubba's servers. Please check your internet and try again.</p>
      </div>`;
  });
}

function nowTime() {
  const d = new Date();
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function clockParts(t) {
  if (typeof t !== "string") return null;
  const m = t.trim().match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return null;
  const h = Number(m[1]), min = Number(m[2]);
  if (!Number.isFinite(h) || !Number.isFinite(min) || h < 0 || h > 23 || min < 0 || min > 59) return null;
  return [h, min];
}
function clockMins(t) {
  const p = clockParts(t);
  return p ? p[0] * 60 + p[1] : null;
}
function napEndSortMins(n) {
  const m = clockMins(n && n.end);
  return m == null ? -1 : m;
}
function minsBetween(start, end) {
  const s = clockMins(start), e = clockMins(end);
  if (s == null || e == null) return null;
  let d = e - s;
  if (d < 0) d += 1440;
  return d;
}
function parseDisplayMins(t) {
  if (!t) return null;
  const raw = String(t).trim();
  const p24 = clockMins(raw);
  if (p24 != null) return p24;
  const m = raw.match(/(\d{1,2}):(\d{2})\s*([ap])m?/i);
  if (!m) return null;
  let h = Number(m[1]), min = Number(m[2]);
  if (!Number.isFinite(h) || !Number.isFinite(min) || min < 0 || min > 59) return null;
  const pm = m[3].toLowerCase() === "p";
  if (pm && h < 12) h += 12;
  if (!pm && h === 12) h = 0;
  return h >= 0 && h < 24 ? h * 60 + min : null;
}
function fmt12(t) {
  const p = clockParts(t);
  if(!p) return "";
  const [h,m] = p;
  const ap = h >= 12 ? "pm" : "am";
  const h12 = (h % 12) || 12;
  return h12 + ":" + String(m).padStart(2,"0") + ap;
}
function safePositiveNumber(v) {
  const n = Number(v);
  return Number.isFinite(n) && n > 0 ? Math.round(n) : 0;
}
function safeJsonValue(value, fallback) {
  if (value === null || value === undefined || value === "") return fallback;
  if (typeof value === "string") {
    try {
      const parsed = JSON.parse(value);
      return parsed === null || parsed === undefined ? fallback : parsed;
    } catch {
      return fallback;
    }
  }
  if (typeof value === "object") return value;
  return fallback;
}
function agoMin(t) {
  const mins = clockMins(t);
  if(mins == null) return null;
  const now = new Date();
  let d = (now.getHours()*60 + now.getMinutes()) - mins;
  if(d < 0) d += 1440;
  return d;
}
/* How long since something happened, for a slot that sits beside clock times.
   NOT fmtElapsed. That renders 2:14:09, and in the countdown row whose other
   two values are "4:50pm Next nap" and "6:00pm Next feed" a third value of the
   same shape reads as a time of day. Past twelve hours it IS one: the portal
   showed "23:52:35" under the words "Since change". Seconds are false
   precision for a nappy too; nobody watches that tick. No "ago" either,
   because the label underneath already says "Since change". */
function fmtSince(sec) {
  const mins = Math.max(0, Math.floor(sec / 60));
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m";
  const h = Math.floor(mins / 60), m = mins % 60;
  return m > 0 ? h + "h " + m + "m" : h + "h";
}

function fmtAgo(mins) {
  if(mins === null) return "--";
  if(mins < 1) return "just now";
  if(mins < 60) return mins + "m ago";
  const h = Math.floor(mins/60), m = mins%60;
  return h + "h " + (m>0 ? m + "m " : "") + "ago";
}

let sheet = null;
let recentEntries = [];
let familyContext = { babyName: "baby", babyDob: null, ageWeeks: null, babyPhoto: null, today: {}, pinnedNotes: [], carerNotes: "", carerComfort: "", emergencyContacts: [] };
let _childrenCache = null; // used to recompute stats when carer entries arrive
let _napEndedLocally = null; // set to end time when carer taps "Nap Ended" — forces render to treat nap as done
let _nightWakePausedAt = null; // timestamp when carer tapped Night Wake — pauses timer display
let _nightWakeSettledAt = null; // brief local resume marker while Firestore echoes the settled wake

function todayStrLocal() {
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function dateKeyMs(dateStr, fallback = NaN) {
  const raw = String(dateStr || "").trim().slice(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(raw)) return fallback;
  const parts = raw.split("-").map(Number);
  const dt = new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0, 0);
  return dt.getFullYear() === parts[0] && dt.getMonth() === parts[1] - 1 && dt.getDate() === parts[2]
    ? dt.getTime()
    : fallback;
}
function prevDayStrLocal(dayKey) {
  const ms = dateKeyMs(dayKey, NaN);
  const d = Number.isFinite(ms) ? new Date(ms) : new Date();
  d.setDate(d.getDate() - 1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function safeEntryList(arr) {
  return Array.isArray(arr) ? arr.filter(e => e && typeof e === "object" && !Array.isArray(e)) : [];
}
function isMorningWakeEntry(e) {
  if (!e || e.type !== "wake" || e.night) return false;
  const mins = clockMins(e.time || "");
  if (mins == null) return false;
  const hour = Math.floor(mins / 60);
  return hour >= 5 && hour < 12;
}
function isSettledNightWakeEntry(e) {
  if (!e || e.type !== "wake" || !e.night) return false;
  return !!(e.nightLocked || e.assisted || e.selfSettled || e.settleTime || e.assistedDuration != null || e.settleDuration != null);
}

  return Number.isFinite(_nightWakeSettledAt) && (Date.now() - _nightWakeSettledAt) < 15 * 60 * 1000;
}
/// When a bedtime actually began.
///
/// ⚠️ THE APP AND THE PORTAL WERE COUNTING FROM DIFFERENT MINUTES.
///
/// Owner, 15 Oct 2026, with a photo: the Dynamic Island read 15:03 and this
/// page read 10:03, five minutes apart, at the same instant. A bedtime entry
/// carries BOTH `start` (19:52, when he went down) and `time` (19:57). The app
/// counts from `startMin ?? timeMin` (track_providers.dart, openSleepTimerOf);
/// this page read `.time` and so started its clock five minutes late. The nap
/// branch had always used `.start`. Only bedtime was wrong.
const bedStart = (e) => (e && (e.start || e.time)) || null;

/// The bedtime to render, mirroring openSleepTimerOf: it scans REVERSED and
/// skips an entry with no start, which is why the app ignored the carer's
/// 20:05 "Bedtime" tap and kept counting the parent's 19:52 one. A carer-only
/// bedtime has no `start` at all, so it is still used when nothing better is
/// there, otherwise the page would show no bedtime for a carer who logged it.
function pickBedEntry(entries) {

/// Minutes a carer's start time may differ from the parent's record of the same
/// nap. Two people writing down one nap do not agree to the minute.
const NAP_MATCH_TOLERANCE = 20;
/// How long a CARER's un-ended nap may run before it is read as an unclosed log
/// rather than a sleeping baby. 4h is the bound widget_bridge.dart already uses
/// for a carried-over open nap, so the portal agrees with the one other place
/// in the codebase that bounds one.
const CARER_NAP_CEILING = 240;

/// Is this nap entry still running right now?
///
/// ⚠️ A CARER'S OPEN NAP MUST NOT OUTLIVE THE PARENT'S OWN RECORD OF IT.
///
/// Owner, 15 Oct 2026: "why is bubbacare saying oliver is still napping?"
/// The carer pressed Nap at 12:36. Mum logged that same nap in the app as
/// 12:30 to 13:01 and ended it. The only test for "this nap is over" was an
/// EXACT match on the start string, and 12:36 is not 12:30, so the carer's
/// entry stayed open and the portal counted up for six hours while the app
/// said awake. An exact match was never going to hold: the carer presses the
/// button when she puts him down, the parent types the time she remembers.
///
/// The parent's app is the source of truth, so a nap is over the moment the
/// parent's own day says it is: a finished sleep that covers it, a later sleep
/// that replaced it, or a morning wake logged after it (the rule isAsleepNow
/// and the home widget already use).
function napIsOngoing(entry, parentEntries, nowMins, fromCarer) {

  if (e._merged === true) return false;
  if (e.end && e.end !== e.start) return false; // an end is an end, no grace period
  const startM = clockMins(e.start);
  if (startM == null) return false;
  for (const p of safeEntryList(parentEntries)) {
    if (!p || p === e) continue;
    const isSleep = p.type === "nap" || p.type === "sleep";
    const pStart = clockMins(p.start);
    if (isSleep && pStart != null) {
      const pEnd = clockMins(p.end);
      // A FINISHED sleep of the parent's that covers this start: same nap, ended.
      if (pEnd != null && pEnd !== pStart && pEnd > pStart &&
          startM >= pStart - NAP_MATCH_TOLERANCE && startM <= pEnd) return false;
      // A sleep the parent STARTED after this one: this nap is a nap ago.
      if (pStart > startM + NAP_MATCH_TOLERANCE) return false;
    }
    // A morning wake after it. Night stirs do not end sleep, so they are excluded.
    if (p.type === "wake" && !p.night) {
      const wakeM = clockMins(p.time);
      if (wakeM != null && wakeM > startM) return false;
    }
  }
  // Carer-only ceiling. day_metrics.dart deliberately keeps a PARENT's un-ended
  // nap running ("coherence wins" — every surface must agree), so capping one
  // here would recreate the contradiction that comment is about. A carer flag
  // the app never renders carries no such risk.
  if (fromCarer && nowMins != null && nowMins - startM > CARER_NAP_CEILING) return false;
  return true;
}

/// Wall-clock minutes since midnight, for the paths that have no _nowMins in scope.
function nowMinsLocal() {
  const d = new Date();

function getWakeWindow(weeks) {
  // Age-based wake window (NHS/AASM guidance)
  if (weeks < 4) return { min:45, max:60, label:"45–60 min" };
  if (weeks < 8) return { min:60, max:90, label:"1–1.5h" };
  if (weeks < 13) return { min:60, max:105, label:"1–1h 45m" };
  if (weeks < 17) return { min:90, max:120, label:"1.5–2h" };
  if (weeks < 26) return { min:120, max:150, label:"2–2.5h" };
  if (weeks < 39) return { min:150, max:180, label:"2.5–3h" };

function computeTodayStats(children, childId, extraEntries, dayKey) {

  const wetCount = poops.filter(p => { const _pt=String(p.poopType||"wet").toLowerCase(); return _pt.includes("wet")||_pt==="both"; }).length;
  const dirtyCount = poops.filter(p => { const _pt=String(p.poopType||"").toLowerCase(); return _pt.includes("dirty")||_pt.includes("mixed")||_pt.includes("yellow")||_pt.includes("green")||_pt.includes("brown"); }).length;

  return { today, entries, lastFeed, lastNap, lastPoop, wetCount, dirtyCount, nappyCount: poops.length, totalMl, avgMl, avgFeedsPerDay, naps };
}

      familyContext.babyDob = ch.dob || null;
      familyContext.ageWeeks = null;
      const dobMs = dateKeyMs(ch.dob, NaN);
      if (Number.isFinite(dobMs)) {

function showToast(msg, undo) {
  const t = document.createElement("div");
  t.className = "toast";
  const label = document.createElement("span");
  label.textContent = msg;
  t.appendChild(label);
  // ⚠️ THERE WAS NO WAY BACK. A carer who tapped Feed and typed 120 instead of
  // 20 had already sent it to the parent's phone, with no correction except a
  // phone call. The deployed rules allow a carer to delete their own entry
  // (carer_logs/{code}/entries — "allow delete: if signedIn() && backupCodeId"),
  // so this is a real delete rather than a flag nobody reads.
  const life = undo ? 8000 : 2200;
  if (undo) {
    const b = document.createElement("button");
    b.className = "toast-undo";
    b.type = "button";
    b.textContent = "Undo";
    b.addEventListener("click", async () => {
      b.disabled = true;
      try {
        await undo();
        label.textContent = "Removed";
      } catch (e) {
        console.warn("undo failed", e);
        label.textContent = "Couldn't undo — tell the parent";
      }
      b.remove();
      setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, 1800);
    });
    t.appendChild(b);
  }
  document.body.appendChild(t);
  setTimeout(() => t.classList.add("show"), 10);
  setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, life);
}

async function logEntry(entry) {
  // Read time from time picker if present
  const _timePicker = document.getElementById("carer-time-input");
  const _entryTime = (_timePicker && _timePicker.value) ? _timePicker.value : (entry.time || nowTime());
  try {
    if (!code || code.length < 4) { showToast("Invalid care link. ask the parent for a new one"); return; }
    const colRef = collection(db, "carer_logs", code, "entries");
    const _doc = { ...entry, time: _entryTime, loggedAt: new Date().toISOString(), loggedBy: "carer" };
    if (!_doc.date) _doc.date = entry.night ? (familyContext._careDayKey || todayStrLocal()) : todayStrLocal();
    // For naps, preserve the original start time — don't overwrite with _entryTime
    if (entry.start && !entry.end) _doc.start = entry.start;
    else if (entry.start) _doc.start = entry.start;
    // Remove any undefined fields — Firestore rejects them
    Object.keys(_doc).forEach(k => { if (_doc[k] === undefined) delete _doc[k]; });
    const _ref = await addDoc(colRef, _doc);
    // Eight seconds: long enough to spot a wrong number, short enough that the
    // parent has almost certainly not acted on it. It does NOT claim they have
    // not seen it, because it cannot know that.
    showToast("Saved · their parent can see it", () => deleteDoc(_ref));
    closeSheet();
  } catch (e) {
    console.error("Log failed", e);
    // More specific error message
    if (e.code === "permission-denied") {
      showToast("Access expired. ask the parent for a new care link");
    } else if (!navigator.onLine) {
      showToast("No internet. check your connection and try again");
    } else {
      showToast("Couldn't save. check your connection and try again");
    }
  }
}

function _mergeCarerEntries() {
  // Merges today's pending carer_logs entries into familyContext.today so predictions reflect
  // freshly-logged events immediately (before parent has accepted them).
  try {
    if (!_childrenCache) return;
    const _todayStr = todayStrLocal();
    const _careDay = familyContext._careDayKey || _todayStr;
    const _todayPending = recentEntries.filter(e => {
      // Skip entries already merged by parent app — but keep active naps so timer stays visible.
      // ⚠️ `_active` is set by the portal and cleared by nobody, so a nap the
      // parent has since closed was being kept alive here for the rest of the
      // day. If the parent's own entries show that nap closed, it is closed.
      if (e._merged && !e._active) return false;
      if (e._active && e.type === "nap" && e.start &&
          !napIsOngoing(e, ((familyContext.today || {}).entries) || [], nowMinsLocal(), true)) {
        return false;
      }
      if (e.date) return e.date === _careDay;
      const t = e.loggedAt || e.time || "";
      if (typeof t === "string" && t.length >= 10) {
        const loggedDay = t.slice(0,10);
        if (loggedDay === _careDay) return true;
        return _careDay !== _todayStr && !!e.night && loggedDay === _todayStr;
      }
      return true;
    }).map(e => ({
      type: e.type,
      time: e.time || (e.loggedAt ? e.loggedAt.slice(11,16) : nowTime()),
      amount: e.amount || 0,
      feedType: e.feedType || "",
      poopType: e.poopType || "",
      start: e.start || "",
      end: e.end || "",
      night: !!e.night,
      nightLocked: !!e.nightLocked,
      assisted: !!e.assisted,
      selfSettled: !!e.selfSettled,
      assistedType: e.assistedType || "",
      assistedDuration: e.assistedDuration,
      settleDuration: e.settleDuration,
      settleTime: e.settleTime || "",
      _activeNightWake: !!e._activeNightWake,
      _active: !!e._active,
      // Unambiguous provenance. `_active` alone could not carry it: a pre-Flutter
      // open nap of the parent's own can still hold that stale interop flag.
      _carer: true

    familyContext.today = computeTodayStats(_childrenCache, childId, _todayPending, _careDay) || {};
  } catch(e) { console.warn("merge carer entries failed", e); }
}

function renderApp() {
  // Listen to recent entries, real-time so carer sees their own logs reflected immediately
  const colRef = collection(db, "carer_logs", code, "entries");
  const q = query(colRef, orderBy("loggedAt", "desc"), limit(25));
  onSnapshot(q, (snap) => {
    recentEntries = [];
    snap.forEach(d => recentEntries.push({id:d.id, ...d.data()}));
    _debouncedRender();
  });
  _renderHtml();
  // Format elapsed seconds: m:ss under 1h, h:mm:ss over 1h
  function fmtElapsed(sec) {
    if (sec < 0) sec = 0;
    const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
    if (h > 0) return h + ":" + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
    return m + ":" + String(s).padStart(2,"0");
  }

  // Tick every second — reads start time from DOM data attribute (authoritative)
  setInterval(()=>{
    try {
      const _el = document.querySelector('[data-timer-start]');
      const _now2 = new Date();
      const _nowSeconds = _now2.getHours()*3600+_now2.getMinutes()*60+_now2.getSeconds();
      if (_el) {
        const _startMins = clockMins(_el.getAttribute('data-timer-start'));
        if (_startMins != null) {
          let _elapsed = _nowSeconds - (_startMins*60);
          if (_elapsed < 0) _elapsed += 86400;
          _el.textContent = fmtElapsed(_elapsed);
        }
      }
      document.querySelectorAll('[data-countdown-to]').forEach(node => {
        const targetMins = clockMins(node.getAttribute('data-countdown-to'));
        if (targetMins == null) return;
        let remaining = targetMins*60 - _nowSeconds;
        if (remaining < -1800) remaining += 86400;
        // ⚠️ fmtElapsed again, so a countdown to the next nap read "24:18"
        // under a sleep picture: a duration wearing a clock's clothes, in the
        // same card as two real clock times. The readiness meter above already
        // carries the fine detail, so this says plainly how long is left.
        node.textContent = remaining <= 0 ? "Now" : "in " + fmtSince(remaining);
      });
      document.querySelectorAll('[data-countdown-ms]').forEach(node => {
        const targetMs = Number(node.getAttribute('data-countdown-ms'));
        if (!Number.isFinite(targetMs)) return;
        const remaining = Math.ceil((targetMs - Date.now()) / 1000);
        node.textContent = remaining <= 0 ? "Ready now" : "in " + fmtSince(remaining);
      });
      document.querySelectorAll('[data-ready-from]').forEach(bar => {
        const from = Number(bar.getAttribute('data-ready-from'));
        const span = Number(bar.getAttribute('data-ready-span'));
        const marker = bar.querySelector('.ready-marker');
        if (!marker || !Number.isFinite(from) || !(span > 0)) return;
        const pct = Math.max(0, Math.min(100, ((Date.now() - from) / span) * 100));
        marker.style.left = pct + '%';
      });
      document.querySelectorAll('[data-elapsed-from]').forEach(node => {
        const startMins = clockMins(node.getAttribute('data-elapsed-from'));
        if (startMins == null) return;
        let elapsed = _nowSeconds - startMins*60;
        if (elapsed < 0) elapsed += 86400;
        node.textContent = fmtSince(elapsed);
      });
    } catch {}
  }, 1000);
  // Full re-render every 2 mins (was 60s — less flicker)
  setInterval(()=>{ _debouncedRender(); }, 120000);
}


// ── the tab bar ───────────────────────────────────────────────────────────
// Delegated, because _renderHtml replaces the whole tree on every re-render
// and a listener bound to a button would die with it. The chosen view is kept
// outside the markup for the same reason: a re-render must not throw a carer
// back to Today while they are reading the guide.
let _careView = "today";

  document.querySelectorAll(".v").forEach((el) => {
    el.hidden = !el.classList.contains("v-" + _careView);
  });
  document.querySelectorAll(".today-only").forEach((el) => {
    el.hidden = _careView !== "today";
  });
  document.querySelectorAll(".tab").forEach((b) => {
    b.classList.toggle("is-on", b.getAttribute("data-view") === _careView);
  });

document.addEventListener("click", (ev) => {
  const tab = ev.target.closest && ev.target.closest(".tab");
  if (tab) {
    _careView = tab.getAttribute("data-view") || "today";
    _applyView();
    window.scrollTo(0, 0);
    return;
  }
  // "Help & emergency numbers" and the little guide both live on the Guide
  // surface now, so the things that point at them have to switch surface.
  const jump = ev.target.closest && ev.target.closest('a[href="#emergency"], .guide summary, .guide-door');
  if (jump) {
    _careView = "guide";
    _applyView();
    const target = document.getElementById("emergency");
    if (jump.matches('a[href="#emergency"]') && target) {
      ev.preventDefault();
      setTimeout(() => target.scrollIntoView({ behavior: "smooth", block: "start" }), 30);
    } else {

    }
  }
});

    "./care-assets/feed.webp": "./care-assets/v2/feed-ui.webp",
    "./care-assets/nappy.webp": "./care-assets/v2/nappy-ui.webp",
    "./care-assets/sleep.webp": "./care-assets/v2/sleep-ui.webp",
    "./care-assets/note.webp": "./care-assets/v2/note-ui.webp"
  };
  document.querySelectorAll("img[src]").forEach(img => {
    const replacement = _careArtV2[img.getAttribute("src")];
    if (replacement) img.setAttribute("src", replacement);
  });

  document.querySelectorAll('[data-hide-on-error="baby-photo"]').forEach(img => {
    img.addEventListener("error", () => { img.style.display = "none"; }, { once: true });
  });

  document.querySelectorAll(".action-btn").forEach(b => {
    b.onclick = () => {
      if (b.dataset.action === "night-settle" && b.dataset.settle) {
        // Night wake settle — log the wake entry + resume timer
        const _settle = b.dataset.settle;
        const _wakeStart = _nightWakePausedAt || Date.now();
        const _settleMins = Math.max(0, Math.round((Date.now() - _wakeStart) / 60000));
        const _note = _settle === "feed" ? "Night feed · logged by caregiver"
          : _settle === "soothe" ? "Soothed back to sleep · logged by caregiver"
          : "Self settled · logged by caregiver";
        const _nightWakeLog = {
          type:"wake",
          night:true,
          nightLocked:true,
          assistedType: _settle === "feed" ? "milk" : _settle,
          note: _note,
          settleTime: nowTime()
        };
        if (_settle === "self") {
          _nightWakeLog.selfSettled = true;
          _nightWakeLog.settleDuration = _settleMins;
        } else {
          _nightWakeLog.assisted = true;
          _nightWakeLog.assistedDuration = _settleMins;
        }
        logEntry(_nightWakeLog);
        _nightWakePausedAt = null;
        _nightWakeSettledAt = Date.now();
        setTimeout(()=>{ _debouncedRender(); }, 200);
        return;
      }
      openSheet(b.dataset.action);
    };
  });
}

function escapeHtml(s) {
  return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function safeDialNumber(value, fallback = "") {
  const pick = (raw) => {
    const text = String(raw ?? "").trim();
    if (!text) return "";
    const first = (text.match(/\+?\d[\d\s().-]{1,24}\d|\+?\d{2,15}|\d{2,15}/) || [])[0] || "";
    let out = first.replace(/[^\d+]/g, "");
    out = out.replace(/(?!^)\+/g, "");
    const digits = out.replace(/\D/g, "");
    if (digits.length < 2 || digits.length > 16) return "";
    return out;
  };
  return pick(value) || pick(fallback);
}
function safeTelHref(value, fallback = "") {
  const dial = safeDialNumber(value, fallback);
  return dial ? "tel:" + dial : "";
}

function safeImageSrc(src) {
  const raw = String(src || "").trim();
  if (!raw) return "";
  if (/^data:image\/(png|jpe?g|webp|gif);base64,[a-z0-9+/=\s]+$/i.test(raw)) return raw.replace(/\s+/g, "");
  if (/^https:\/\/firebasestorage\.googleapis\.com\//i.test(raw)) return raw;
  if (/^https:\/\/storage\.googleapis\.com\//i.test(raw)) return raw;
  return "";
}

function updateRecentList() {
  const list = document.getElementById("recent-list");
  if (!list) return;
  if (recentEntries.length === 0) {
    list.innerHTML = `<div class="story-empty"><img src="./care-assets/v2/note-ui.webp" alt=""/>Nothing logged yet. The day’s story will appear here.</div>`;
    return;
  }
  const icons = {
    feed: "./care-assets/v2/feed-ui.webp",
    poop: "./care-assets/v2/nappy-ui.webp",
    nap: "./care-assets/v2/sleep-ui.webp",
    wake: "./care-assets/v2/sleep-ui.webp"
  };
  const labels = { feed: "Feed", poop: "Nappy", nap: "Nap", wake: "Wake" };
  const storyEntries = [...recentEntries].sort((a,b) => {
    const av = String(a.time || a.start || (a.loggedAt || "").slice(11,16));
    const bv = String(b.time || b.start || (b.loggedAt || "").slice(11,16));
    return bv.localeCompare(av);
  });
  list.innerHTML = `<div class="story-list">` + storyEntries.map(e => {
    const type = String(e.type || "");
    const t = (type === "nap" ? e.start : e.time) || (e.loggedAt || "").slice(11,16);
    const safeLabel = escapeHtml(labels[type] || type || "Entry");
    const amount = Number(e.amount);
    const detail = type === "feed" && Number.isFinite(amount) && amount > 0
      ? `${amount}ml taken`
      : type === "poop" && e.poopType
        ? `${escapeHtml(e.poopType)} nappy`
        : type === "nap" && e.end && e.end !== e.start ? `Rested until ${escapeHtml(fmt12(e.end))}`
        : type === "nap" ? "Nap in progress" : "Saved for the family";
    return `<div class="story-entry">
      <span class="story-node"><img src="${icons[type] || "./care-assets/v2/note-ui.webp"}" alt=""/></span>
      <span><span class="story-label">${safeLabel}</span><span class="story-detail">${detail}</span></span>
      <span class="story-time">${fmt12(t)}</span>
    </div>`;
  }).join("") + `</div>`;
}
</script>
