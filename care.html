<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="referrer" content="no-referrer"/>
  <title>Bubba Care | OBubba</title>
  <script>
    // Bubba Care lives at the care page below. Only a care-link token is passed on.
    (function () {
      var q = new URLSearchParams(location.search);
      var c = q.get("code") || "";
      var b = q.get("baby") || "";
      var ok = /^CT[A-Z2-9]{20}$/.test(c);
      var to = "https://obubba-d9ccc.web.app/care.html";
      if (ok) { to += "?code=" + c + (b ? "&baby=" + encodeURIComponent(b) : ""); }
      location.replace(to);
    })();
  </script>
</head>
<body style="font-family:system-ui,sans-serif;text-align:center;padding:48px 20px">
  <p>Opening Bubba Care…</p>
  <p><a href="https://obubba-d9ccc.web.app/care.html" rel="nofollow">Open Bubba Care</a></p>
</body>
</html>
