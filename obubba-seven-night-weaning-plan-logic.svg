<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba builds a seven-night night-weaning plan</title>
  <desc id="desc">A flow from five completed nights through filtering and three readiness gates into either a measured-volume taper or a comfort-and-time plan, with notes about local pacing and the rolling baseline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171A38"/><stop offset="1" stop-color="#292551"/></linearGradient>
    <linearGradient id="coral" x1="0" x2="1"><stop stop-color="#FF9B8E"/><stop offset="1" stop-color="#FF735F"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#090B22" flood-opacity=".28"/></filter>
    <style>
      .eyebrow{font:700 15px Arial,sans-serif;letter-spacing:2px;fill:#B9B5EA}.head{font:700 38px Arial,sans-serif;fill:#FFF}.sub{font:400 18px Arial,sans-serif;fill:#DAD8F3}.label{font:700 18px Arial,sans-serif;fill:#FFF}.body{font:400 15px Arial,sans-serif;fill:#D9D7EE}.small{font:400 13px Arial,sans-serif;fill:#C4C1DF}.num{font:700 17px Arial,sans-serif;fill:#171A38}.mint{fill:#A8E5CE}.line{stroke:#8079B5;stroke-width:3;fill:none;stroke-linecap:round}.dot{fill:#FF8B78}
    </style>
  </defs>
  <rect width="1200" height="820" rx="32" fill="url(#bg)"/>
  <circle cx="1090" cy="92" r="126" fill="#6E65A8" opacity=".16"/><circle cx="72" cy="758" r="170" fill="#FF8B78" opacity=".08"/>
  <text x="70" y="70" class="eyebrow">FROM REAL LOGS TO A GENTLE PLAN</text>
  <text x="70" y="116" class="head">How OBubba builds seven nights</text>
  <text x="70" y="150" class="sub">The current Flutter path, including the safeguards and limits parents should know.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="200" width="260" height="144" rx="22" fill="#34305F"/>
    <circle cx="108" cy="239" r="20" fill="url(#coral)"/><text x="102" y="245" class="num">1</text>
    <text x="140" y="245" class="label">Five completed nights</text>
    <text x="96" y="281" class="body">Count genuine night milk feeds</text>
    <text x="96" y="307" class="small">Skip dream feeds, solids and</text><text x="96" y="327" class="small">nights with no qualifying feed</text>
  </g>
  <path class="line" d="M330 272H390"/><path d="M381 264l12 8-12 8" fill="#8079B5"/>
  <g filter="url(#shadow)">
    <rect x="390" y="200" width="360" height="144" rx="22" fill="#34305F"/>
    <circle cx="428" cy="239" r="20" class="mint"/><text x="422" y="245" class="num">2</text>
    <text x="460" y="245" class="label">Three green lights</text>
    <g transform="translate(418 274)"><circle r="8" class="mint"/><path d="M-3 0l2 3 5-6" stroke="#171A38" stroke-width="2" fill="none"/><text x="18" y="5" class="body">Corrected age ≥ 26 weeks</text></g>
    <g transform="translate(418 300)"><circle r="8" class="mint"/><path d="M-3 0l2 3 5-6" stroke="#171A38" stroke-width="2" fill="none"/><text x="18" y="5" class="body">Best recent day has ≥ 3 day feeds</text></g>
    <g transform="translate(418 326)"><circle r="8" class="mint"/><path d="M-3 0l2 3 5-6" stroke="#171A38" stroke-width="2" fill="none"/><text x="18" y="5" class="body">At least 2 feeding nights</text></g>
  </g>
  <path class="line" d="M750 272H810"/><path d="M801 264l12 8-12 8" fill="#8079B5"/>
  <g filter="url(#shadow)">
    <rect x="810" y="200" width="320" height="144" rx="22" fill="#34305F"/>
    <circle cx="848" cy="239" r="20" fill="#C7B7F5"/><text x="842" y="245" class="num">3</text>
    <text x="880" y="245" class="label">Choose the branch</text>
    <text x="838" y="283" class="body">Any measured volume?</text>
    <rect x="838" y="301" width="112" height="26" rx="13" fill="#A8E5CE"/><text x="875" y="319" class="num" font-size="13">YES</text>
    <rect x="966" y="301" width="112" height="26" rx="13" fill="#FF9B8E"/><text x="1006" y="319" class="num" font-size="13">NO</text>
  </g>

  <path class="line" d="M895 344v54H330v45"/><circle cx="895" cy="371" r="5" class="dot"/>
  <path class="line" d="M1022 344v54H870v45"/><circle cx="1022" cy="371" r="5" class="dot"/>
  <g filter="url(#shadow)">
    <rect x="70" y="443" width="520" height="245" rx="24" fill="#F3F0FF"/>
    <text x="100" y="485" style="font:700 21px Arial,sans-serif;fill:#292551">Measured milk · volume taper</text>
    <text x="100" y="514" style="font:400 15px Arial,sans-serif;fill:#5A557A">Example: 180ml baseline, baby under 1 year</text>
    <g transform="translate(100 552)">
      <path d="M0 58C70 58 102 48 151 43S245 32 302 24s105-15 156-20" fill="none" stroke="#FF7865" stroke-width="5" stroke-linecap="round"/>
      <g fill="#FF7865"><circle cx="0" cy="58" r="7"/><circle cx="76" cy="50" r="7"/><circle cx="152" cy="43" r="7"/><circle cx="228" cy="35" r="7"/><circle cx="304" cy="24" r="7"/><circle cx="380" cy="14" r="7"/><circle cx="458" cy="4" r="7"/></g>
      <g style="font:700 13px Arial,sans-serif;fill:#292551" text-anchor="middle"><text x="0" y="88">180</text><text x="76" y="88">158</text><text x="152" y="88">135</text><text x="228" y="88">113</text><text x="304" y="88">90</text><text x="380" y="88">68</text><text x="458" y="88">45ml</text></g>
      <g style="font:400 11px Arial,sans-serif;fill:#777192" text-anchor="middle"><text x="0" y="107">N1</text><text x="76" y="107">N2</text><text x="152" y="107">N3</text><text x="228" y="107">N4</text><text x="304" y="107">N5</text><text x="380" y="107">N6</text><text x="458" y="107">N7</text></g>
    </g>
    <text x="100" y="660" style="font:400 13px Arial,sans-serif;fill:#5A557A">Under 52 weeks retains a small feed; 52+ weeks can reach zero.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="610" y="443" width="520" height="245" rx="24" fill="#FFF2EF"/>
    <text x="640" y="485" style="font:700 21px Arial,sans-serif;fill:#292551">No measured volume · comfort + time</text>
    <g transform="translate(640 525)">
      <rect width="460" height="34" rx="17" fill="#FFE0D9"/><circle cx="20" cy="17" r="11" fill="#FF8B78"/><text x="16" y="22" class="num" font-size="12">1</text><text x="42" y="22" style="font:400 14px Arial,sans-serif;fill:#4E496D">Notice which wakes lead to feeds</text>
      <rect y="44" width="460" height="34" rx="17" fill="#FFE0D9"/><circle cx="20" cy="61" r="11" fill="#FF8B78"/><text x="16" y="66" class="num" font-size="12">2</text><text x="42" y="66" style="font:400 14px Arial,sans-serif;fill:#4E496D">Shorten gradually; soothe before offering</text>
      <rect y="88" width="460" height="34" rx="17" fill="#FFE0D9"/><circle cx="20" cy="105" r="11" fill="#FF8B78"/><text x="16" y="110" class="num" font-size="12">3</text><text x="42" y="110" style="font:400 14px Arial,sans-serif;fill:#4E496D">Shift selected wakes toward comfort</text>
      <rect y="132" width="460" height="34" rx="17" fill="#FFE0D9"/><circle cx="20" cy="149" r="11" fill="#FF8B78"/><text x="16" y="154" class="num" font-size="12">7</text><text x="42" y="154" style="font:400 14px Arial,sans-serif;fill:#4E496D">A feed or two is still okay</text>
    </g>
  </g>
  <rect x="70" y="722" width="1060" height="52" rx="18" fill="#2F2B58" stroke="#514C7A"/>
  <text x="600" y="754" text-anchor="middle" class="body">One real night at a time  ·  progress is local per child  ·  the baseline currently keeps rolling</text>
</svg>
