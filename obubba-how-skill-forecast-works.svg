<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1440" viewBox="0 0 900 1440" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba's Skill Forecast works</title>
  <desc id="desc">A five-step flow showing how age, dated milestones, a median timing shift and upcoming milestone windows create a forecast rather than a deadline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1734"/>
      <stop offset="0.55" stop-color="#14254a"/>
      <stop offset="1" stop-color="#251c45"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9b8e"/>
      <stop offset="1" stop-color="#f47f70"/>
    </linearGradient>
    <linearGradient id="lav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3b0ff"/>
      <stop offset="1" stop-color="#9d83de"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#030817" flood-opacity="0.32"/>
    </filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .serif{font-family:Georgia,"Times New Roman",serif}
      .ink{fill:#fffaf2}.soft{fill:#d9deec}.faint{fill:#aeb8d1}.navy{fill:#102141}
      .eyebrow{font-size:18px;font-weight:800;letter-spacing:3px}.h1{font-size:50px;font-weight:700}.lead{font-size:22px}
      .step{font-size:16px;font-weight:900;letter-spacing:2px}.label{font-size:25px;font-weight:800}.body{font-size:19px}.small{font-size:17px}
    </style>
  </defs>
  <rect width="900" height="1440" rx="42" fill="url(#bg)"/>
  <circle cx="84" cy="102" r="4" fill="#f5d67b"/><circle cx="815" cy="145" r="3" fill="#fff" opacity=".75"/><circle cx="780" cy="755" r="4" fill="#f5d67b" opacity=".7"/><circle cx="114" cy="1090" r="3" fill="#fff" opacity=".65"/>

  <text x="70" y="80" class="sans eyebrow" fill="#ff9b8e">SKILL FORECAST</text>
  <text x="70" y="145" class="serif h1 ink">A forecast, not a deadline</text>
  <text x="70" y="188" class="sans lead soft">What the app knows, what changes, and what stays uncertain.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="235" width="790" height="145" rx="28" fill="#172b50" stroke="#f0cf75" stroke-opacity=".45"/>
    <circle cx="111" cy="307" r="31" fill="url(#coral)"/><text x="111" y="316" text-anchor="middle" class="sans label navy">1</text>
    <text x="165" y="286" class="sans step" fill="#ff9b8e">AGE ANCHOR</text>
    <text x="165" y="322" class="sans label ink">Start with the baby's age</text>
    <text x="165" y="352" class="sans body soft">Corrected age is used when prematurity makes it the fairer frame.</text>
  </g>
  <path d="M450 380v31" stroke="#f0cf75" stroke-width="3" stroke-linecap="round"/><path d="m440 403 10 12 10-12" fill="none" stroke="#f0cf75" stroke-width="3" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="55" y="420" width="790" height="145" rx="28" fill="#172b50" stroke="#9d83de" stroke-opacity=".5"/>
    <circle cx="111" cy="492" r="31" fill="url(#lav)"/><text x="111" y="501" text-anchor="middle" class="sans label navy">2</text>
    <text x="165" y="471" class="sans step" fill="#c3b0ff">HONEST STARTING POINT</text>
    <text x="165" y="507" class="sans label ink">Use age-typical timing at first</text>
    <text x="165" y="537" class="sans body soft">Fewer than 2 valid dated firsts = useful context, not personal pace.</text>
  </g>
  <path d="M450 565v31" stroke="#f0cf75" stroke-width="3" stroke-linecap="round"/><path d="m440 588 10 12 10-12" fill="none" stroke="#f0cf75" stroke-width="3" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="55" y="605" width="790" height="205" rx="28" fill="#172b50" stroke="#f47f70" stroke-opacity=".52"/>
    <circle cx="111" cy="677" r="31" fill="url(#coral)"/><text x="111" y="686" text-anchor="middle" class="sans label navy">3</text>
    <text x="165" y="656" class="sans step" fill="#ff9b8e">PERSONAL SHIFT</text>
    <text x="165" y="692" class="sans label ink">Find the median early/late offset</text>
    <text x="165" y="724" class="sans body soft">Only credible dated milestones count. The median resists one odd entry.</text>
    <g transform="translate(165 750)">
      <rect width="136" height="37" rx="18" fill="#233b65"/><text x="68" y="25" text-anchor="middle" class="sans small ink">First A −2w</text>
      <rect x="150" width="136" height="37" rx="18" fill="#233b65"/><text x="218" y="25" text-anchor="middle" class="sans small ink">First B −1w</text>
      <rect x="300" width="136" height="37" rx="18" fill="#233b65"/><text x="368" y="25" text-anchor="middle" class="sans small ink">First C +3w</text>
      <text x="474" y="25" class="sans small" fill="#f5d67b">median = −1w</text>
    </g>
  </g>
  <path d="M450 810v31" stroke="#f0cf75" stroke-width="3" stroke-linecap="round"/><path d="m440 833 10 12 10-12" fill="none" stroke="#f0cf75" stroke-width="3" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="55" y="850" width="790" height="180" rx="28" fill="#172b50" stroke="#f0cf75" stroke-opacity=".45"/>
    <circle cx="111" cy="922" r="31" fill="#f0cf75"/><text x="111" y="931" text-anchor="middle" class="sans label navy">4</text>
    <text x="165" y="901" class="sans step" fill="#f5d67b">PROJECT</text>
    <text x="165" y="937" class="sans label ink">Shift each typical point gently</text>
    <text x="165" y="969" class="sans body soft">Typical 40w + median −1w = projected near 39w.</text>
    <text x="165" y="999" class="sans body soft">This orders chapters; it does not prove sequence or readiness.</text>
  </g>
  <path d="M450 1030v31" stroke="#f0cf75" stroke-width="3" stroke-linecap="round"/><path d="m440 1053 10 12 10-12" fill="none" stroke="#f0cf75" stroke-width="3" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="55" y="1070" width="790" height="190" rx="28" fill="#172b50" stroke="#9d83de" stroke-opacity=".52"/>
    <circle cx="111" cy="1142" r="31" fill="url(#lav)"/><text x="111" y="1151" text-anchor="middle" class="sans label navy">5</text>
    <text x="165" y="1121" class="sans step" fill="#c3b0ff">SHOW, DON'T SCORE</text>
    <text x="165" y="1157" class="sans label ink">Bring the next chapters into view</text>
    <text x="165" y="1189" class="sans body soft">The screen shows 3, with one more tucked behind a gentle reveal.</text>
    <text x="165" y="1219" class="sans body soft">“Around 3 weeks” means when to notice—not pass or fail.</text>
  </g>

  <g transform="translate(55 1300)">
    <rect width="790" height="92" rx="25" fill="#fff7e9"/>
    <circle cx="48" cy="46" r="22" fill="#f47f70"/><path d="M39 46l7 7 13-16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="85" y="38" class="sans label navy">It predicts where to look next.</text>
    <text x="85" y="68" class="sans body" fill="#40506d">It cannot decide whether development is healthy.</text>
  </g>
</svg>
