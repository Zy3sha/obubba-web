<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow"/>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clear OBubba Preview Cache</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #081022;
      color: #f8f3ec;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(90vw, 420px);
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }
    p {
      margin: 0;
      color: rgba(248, 243, 236, 0.78);
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <h1>Refreshing OBubba preview</h1>
    <p id="status">Clearing old app files...</p>
  </main>
  <script>
    (async function () {
      const status = document.getElementById('status');
      const params = new URLSearchParams(location.search);
      const next = params.get('next') || '/';
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((reg) => reg.unregister()));
        }
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.map((name) => caches.delete(name)));
        }
        status.textContent = 'Old preview cache cleared. Opening the fresh app...';
      } catch (err) {
        console.warn('[OBubba] Preview cache clear failed', err);
        status.textContent = 'Opening the app after a cache refresh attempt...';
      }
      const fresh = Date.now();
      const target = new URL(next, location.origin);
      target.searchParams.set('fresh', String(fresh));
      if (!target.searchParams.has('v')) target.searchParams.set('v', String(fresh));
      location.replace(target.pathname + target.search + target.hash);
    })();
  </script>
</body>
</html>
