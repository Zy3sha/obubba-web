<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1160" viewBox="0 0 800 1160" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba works out what settles a baby fastest</title>
  <desc id="desc">A six-step flow showing fourteen recent nights, two types of settling evidence, four method buckets, averages, sample and difference gates, and the cautious result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf6"/>
      <stop offset="0.55" stop-color="#f4fbfa"/>
      <stop offset="1" stop-color="#f5edfb"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30273d"/>
      <stop offset="1" stop-color="#43304f"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#64cec8"/>
      <stop offset="1" stop-color="#8ee0d7"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#a970cf"/>
      <stop offset="1" stop-color="#d8afe8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#30273d" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="800" height="1160" rx="34" fill="url(#bg)"/>
  <rect x="18" y="18" width="764" height="1124" rx="28" fill="none" stroke="#ecd9c7" stroke-width="2"/>

  <text x="64" y="76" fill="#278f8c" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.4">INSIDE THE FLUTTER LOGIC</text>
  <text x="64" y="123" fill="#30273d" font-family="Georgia, serif" font-size="36" font-weight="700">What settles baby fastest?</text>
  <text x="64" y="153" fill="#756b7c" font-family="Arial, sans-serif" font-size="16">A personal comparison—with deliberate reasons to stay quiet</text>
  <circle cx="700" cy="100" r="45" fill="#eadbf4"/>
  <path d="M686 77a27 27 0 1 0 31 39 25 25 0 0 1-31-39Z" fill="#9870ca"/>
  <circle cx="718" cy="75" r="4" fill="#efc06d"/>
  <circle cx="729" cy="89" r="3" fill="#efc06d"/>

  <g filter="url(#shadow)">
    <rect x="55" y="190" width="690" height="108" rx="22" fill="#ffffff"/>
    <circle cx="91" cy="226" r="20" fill="#66cec7"/>
    <text x="91" y="232" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">1</text>
    <text x="126" y="217" fill="#278f8c" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">SCAN RECENT NIGHTS</text>
    <text x="126" y="248" fill="#30273d" font-family="Arial, sans-serif" font-size="21" font-weight="700">Up to 14 reconstructed nights</text>
    <text x="126" y="275" fill="#756b7c" font-family="Arial, sans-serif" font-size="14">Only positive-time, recognised night-wake settling records continue.</text>
  </g>

  <path d="M400 298v25m-7-8 7 8 7-8" fill="none" stroke="#64c9c3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="55" y="328" width="690" height="164" rx="22" fill="#fff"/>
    <circle cx="91" cy="364" r="20" fill="#a970cf"/>
    <text x="91" y="370" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">2</text>
    <text x="126" y="355" fill="#278f8c" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">TAKE THE RICHEST RECORD AVAILABLE</text>
    <text x="126" y="386" fill="#30273d" font-family="Arial, sans-serif" font-size="21" font-weight="700">Segments first; whole wake as fallback</text>
    <rect x="88" y="413" width="292" height="54" rx="15" fill="#e8f8f6"/>
    <text x="108" y="436" fill="#278f8c" font-family="Arial, sans-serif" font-size="12" font-weight="700">DETAILED</text>
    <text x="108" y="456" fill="#514759" font-family="Arial, sans-serif" font-size="14">Feed 10m → Pat 5m → Self 4m</text>
    <rect x="395" y="413" width="310" height="54" rx="15" fill="#f6edf6"/>
    <text x="415" y="436" fill="#a45179" font-family="Arial, sans-serif" font-size="12" font-weight="700">SIMPLE FALLBACK</text>
    <text x="415" y="456" fill="#514759" font-family="Arial, sans-serif" font-size="14">One method gets the whole wake time</text>
  </g>

  <path d="M400 492v25m-7-8 7 8 7-8" fill="none" stroke="#64c9c3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="55" y="522" width="690" height="143" rx="22" fill="#fff"/>
    <circle cx="91" cy="558" r="20" fill="#f09578"/>
    <text x="91" y="564" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">3</text>
    <text x="126" y="549" fill="#278f8c" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">GROUP INTO FOUR BUCKETS</text>
    <text x="126" y="580" fill="#30273d" font-family="Arial, sans-serif" font-size="21" font-weight="700">Compare like labels across the history</text>
    <g font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
      <rect x="84" y="606" width="142" height="36" rx="18" fill="#dff5f2"/><text x="155" y="629" fill="#277f7d">Self-settle</text>
      <rect x="241" y="606" width="116" height="36" rx="18" fill="#fae9ed"/><text x="299" y="629" fill="#a45179">Feed</text>
      <rect x="372" y="606" width="202" height="36" rx="18" fill="#efe5f8"/><text x="473" y="629" fill="#77519d">Rock / hold / pat</text>
      <rect x="589" y="606" width="116" height="36" rx="18" fill="#fff1d5"/><text x="647" y="629" fill="#9a6a18">Dummy</text>
    </g>
  </g>

  <path d="M400 665v25m-7-8 7 8 7-8" fill="none" stroke="#64c9c3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="55" y="695" width="690" height="190" rx="22" fill="#fff"/>
    <circle cx="91" cy="731" r="20" fill="#e9788f"/>
    <text x="91" y="737" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">4</text>
    <text x="126" y="722" fill="#278f8c" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">AVERAGE, ROUND, THEN SORT</text>
    <text x="126" y="753" fill="#30273d" font-family="Arial, sans-serif" font-size="21" font-weight="700">Name only the fastest and slowest</text>
    <line x1="129" y1="844" x2="670" y2="844" stroke="#ddd4df" stroke-width="2"/>
    <rect x="190" y="804" width="130" height="40" rx="12" fill="url(#bar1)"/>
    <text x="255" y="800" text-anchor="middle" fill="#756b7c" font-family="Arial, sans-serif" font-size="12" font-weight="700">FASTEST</text>
    <text x="255" y="832" text-anchor="middle" fill="#30273d" font-family="Arial, sans-serif" font-size="23" font-weight="700">8 min</text>
    <rect x="480" y="772" width="130" height="72" rx="12" fill="url(#bar2)"/>
    <text x="545" y="768" text-anchor="middle" fill="#756b7c" font-family="Arial, sans-serif" font-size="12" font-weight="700">SLOWEST</text>
    <text x="545" y="820" text-anchor="middle" fill="#30273d" font-family="Arial, sans-serif" font-size="23" font-weight="700">28 min</text>
    <text x="400" y="870" text-anchor="middle" fill="#756b7c" font-family="Arial, sans-serif" font-size="13">Middle buckets are counted but not named in the card body.</text>
  </g>

  <path d="M400 885v25m-7-8 7 8 7-8" fill="none" stroke="#64c9c3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="55" y="915" width="690" height="112" rx="22" fill="#fff"/>
    <circle cx="91" cy="951" r="20" fill="#efbf65"/>
    <text x="91" y="957" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">5</text>
    <text x="126" y="942" fill="#278f8c" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">CLEAR BOTH EVIDENCE GATES</text>
    <text x="126" y="973" fill="#30273d" font-family="Arial, sans-serif" font-size="21" font-weight="700">≥3 samples at both extremes</text>
    <rect x="460" y="948" width="218" height="42" rx="14" fill="#f1e6f7"/>
    <text x="569" y="976" text-anchor="middle" fill="#5b4568" font-family="Arial, sans-serif" font-size="19" font-weight="700">gap ≥ 8 minutes</text>
    <text x="126" y="1003" fill="#756b7c" font-family="Arial, sans-serif" font-size="13">A feed winner can stay hidden when sibling guidance would conflict.</text>
  </g>

  <path d="M400 1027v20m-7-8 7 8 7-8" fill="none" stroke="#64c9c3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="55" y="1052" width="690" height="66" rx="18" fill="url(#night)"/>
  <text x="78" y="1080" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700">RESULT: a low-urgency personal pattern—not a settling instruction</text>
  <text x="78" y="1102" fill="#ddd2e4" font-family="Arial, sans-serif" font-size="12">Hunger, comfort, safety and the baby in front of you still come first.</text>
</svg>
