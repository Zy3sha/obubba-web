<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba detects growing self-settling at night</title>
  <desc id="desc">A worked six-wake example showing three earlier wakes ending with parent-supported methods and three recent wakes ending with self-settle, followed by the thresholds the Flutter app applies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2443"/>
      <stop offset="1" stop-color="#173D61"/>
    </linearGradient>
    <linearGradient id="recent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7F8F2"/>
      <stop offset="1" stop-color="#D8EEF4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#06172C" flood-opacity=".2"/>
    </filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.serif{font-family:Georgia,"Times New Roman",serif}.muted{fill:#587086}.small{font-size:18px}.body{font-size:21px}.label{font-size:16px;font-weight:700;letter-spacing:1.7px}.strong{font-weight:750}.chip{font-size:17px;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="860" rx="36" fill="url(#bg)"/>
  <circle cx="1090" cy="82" r="92" fill="#F4C979" opacity=".09"/>
  <circle cx="94" cy="764" r="132" fill="#71C5B1" opacity=".08"/>

  <text x="64" y="72" class="sans label" fill="#F4C979">THE CURRENT FLUTTER RULE</text>
  <text x="64" y="118" class="serif" font-size="37" font-weight="700" fill="#FFFFFF">It reads how each detailed wake ended</text>
  <text x="64" y="151" class="sans body" fill="#D8E4EF">Not whether the whole wake was independent—and not how long the final step lasted.</text>

  <g filter="url(#shadow)">
    <rect x="54" y="190" width="1092" height="340" rx="28" fill="#F8F6F0"/>
  </g>
  <text x="87" y="231" class="sans label muted">SIX QUALIFYING WAKE LOGS</text>

  <rect x="82" y="254" width="500" height="222" rx="22" fill="#F1E5DC"/>
  <text x="109" y="292" class="sans strong" font-size="23" fill="#734E42">Earlier recorded wakes</text>
  <text x="538" y="292" text-anchor="end" class="sans strong" font-size="23" fill="#A45446">0 of 3 · 0%</text>
  <g class="sans" font-size="18" fill="#233D52">
    <text x="109" y="337">Wake 1</text><text x="214" y="337">Patted 5m</text><text x="340" y="337">→ Fed 15m</text>
    <text x="109" y="390">Wake 2</text><text x="214" y="390">Fed 20m</text>
    <text x="109" y="443">Wake 3</text><text x="214" y="443">Rocked 10m</text><text x="355" y="443">→ Fed 12m</text>
  </g>
  <g class="sans chip" fill="#FFFFFF">
    <rect x="458" y="314" width="97" height="32" rx="16" fill="#B96758"/><text x="506.5" y="337" text-anchor="middle">ends Fed</text>
    <rect x="458" y="367" width="97" height="32" rx="16" fill="#B96758"/><text x="506.5" y="390" text-anchor="middle">ends Fed</text>
    <rect x="458" y="420" width="97" height="32" rx="16" fill="#B96758"/><text x="506.5" y="443" text-anchor="middle">ends Fed</text>
  </g>

  <rect x="618" y="254" width="500" height="222" rx="22" fill="url(#recent)"/>
  <text x="645" y="292" class="sans strong" font-size="23" fill="#265D5A">Recent recorded wakes</text>
  <text x="1090" y="292" text-anchor="end" class="sans strong" font-size="23" fill="#167C6C">3 of 3 · 100%</text>
  <g class="sans" font-size="18" fill="#233D52">
    <text x="645" y="337">Wake 4</text><text x="750" y="337">Fed 8m</text><text x="854" y="337">→ Self 25m</text>
    <text x="645" y="390">Wake 5</text><text x="750" y="390">Patted 5m</text><text x="881" y="390">→ Self 20m</text>
    <text x="645" y="443">Wake 6</text><text x="750" y="443">Self 30m</text>
  </g>
  <g class="sans chip" fill="#FFFFFF">
    <rect x="997" y="314" width="94" height="32" rx="16" fill="#168674"/><text x="1044" y="337" text-anchor="middle">ends Self</text>
    <rect x="997" y="367" width="94" height="32" rx="16" fill="#168674"/><text x="1044" y="390" text-anchor="middle">ends Self</text>
    <rect x="997" y="420" width="94" height="32" rx="16" fill="#168674"/><text x="1044" y="443" text-anchor="middle">ends Self</text>
  </g>
  <text x="600" y="511" text-anchor="middle" class="sans small muted">The engine sorts wake days, splits around the midpoint day, then compares the two groups.</text>

  <g filter="url(#shadow)">
    <rect x="54" y="558" width="1092" height="144" rx="27" fill="#FFFFFF"/>
  </g>
  <text x="87" y="598" class="sans label muted">ALL FOUR GATES MUST PASS</text>
  <g class="sans strong" font-size="21" fill="#173D61">
    <circle cx="102" cy="646" r="19" fill="#E7F8F2"/><text x="102" y="653" text-anchor="middle" fill="#168674">✓</text><text x="134" y="653">6+ detailed wakes</text>
    <circle cx="365" cy="646" r="19" fill="#E7F8F2"/><text x="365" y="653" text-anchor="middle" fill="#168674">✓</text><text x="397" y="653">3+ in each group</text>
    <circle cx="661" cy="646" r="19" fill="#E7F8F2"/><text x="661" y="653" text-anchor="middle" fill="#168674">✓</text><text x="693" y="653">recent ≥ 40%</text>
    <circle cx="910" cy="646" r="19" fill="#E7F8F2"/><text x="910" y="653" text-anchor="middle" fill="#168674">✓</text><text x="942" y="653">gain ≥ 20 points</text>
  </g>

  <rect x="54" y="730" width="1092" height="82" rx="24" fill="#F4C979"/>
  <text x="86" y="765" class="sans strong" font-size="20" fill="#443417">Important: Fed 8m → Self-settle 1m still counts as “self-resolved”.</text>
  <text x="86" y="792" class="sans small" fill="#56431F">This is a progress signal—not an instruction to leave a crying, hungry or distressed baby.</text>
</svg>
