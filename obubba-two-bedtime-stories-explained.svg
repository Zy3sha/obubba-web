<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">The two bedtime stories inside OBubba</title>
  <desc id="desc">A comparison of the free offline Bedtime Stories library for the child and the premium Tonight's Story sleep briefing for the parent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091b39"/>
      <stop offset="1" stop-color="#172952"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d478b"/>
      <stop offset="1" stop-color="#7b65a9"/>
    </linearGradient>
    <linearGradient id="read" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#245d69"/>
      <stop offset="1" stop-color="#317a82"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020817" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="1200" height="760" rx="42" fill="url(#bg)"/>
  <circle cx="1060" cy="92" r="44" fill="#f4d48b" opacity=".94"/>
  <circle cx="1043" cy="78" r="44" fill="#101f42"/>
  <g fill="#fff5d7" opacity=".72">
    <circle cx="81" cy="94" r="3"/><circle cx="156" cy="53" r="2"/><circle cx="1111" cy="174" r="3"/>
    <circle cx="1146" cy="334" r="2"/><circle cx="59" cy="598" r="2"/><circle cx="650" cy="72" r="2"/>
  </g>
  <text x="600" y="72" text-anchor="middle" fill="#f7e6b6" font-family="Georgia, serif" font-size="42" font-weight="700">Two stories. Two different jobs.</text>
  <text x="600" y="112" text-anchor="middle" fill="#c8d2e5" font-family="Arial, sans-serif" font-size="21">One becomes part of the bedtime ritual. One explains the sleep record.</text>

  <g filter="url(#shadow)">
    <rect x="62" y="156" width="500" height="522" rx="34" fill="#f8f0e1"/>
    <rect x="86" y="180" width="452" height="106" rx="25" fill="url(#book)"/>
    <text x="116" y="225" fill="#fff4d7" font-family="Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="2">FOR YOUR BABY</text>
    <text x="116" y="264" fill="#ffffff" font-family="Georgia, serif" font-size="32" font-weight="700">Bedtime Stories</text>
    <circle cx="480" cy="233" r="30" fill="#f0c986"/>
    <text x="480" y="244" text-anchor="middle" font-size="31">📖</text>

    <g font-family="Arial, sans-serif">
      <circle cx="115" cy="333" r="16" fill="#e78372"/><text x="115" y="340" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">1</text>
      <text x="149" y="329" fill="#26334c" font-size="23" font-weight="800">Choose a gentle tale</text>
      <text x="149" y="357" fill="#667087" font-size="18">12 original stories, available offline</text>

      <circle cx="115" cy="416" r="16" fill="#e78372"/><text x="115" y="423" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">2</text>
      <text x="149" y="412" fill="#26334c" font-size="23" font-weight="800">Read it together</text>
      <text x="149" y="440" fill="#667087" font-size="18">Short pages, moral and first-name sign-off</text>

      <circle cx="115" cy="499" r="16" fill="#e78372"/><text x="115" y="506" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">3</text>
      <text x="149" y="495" fill="#26334c" font-size="23" font-weight="800">Finish—or stop early</text>
      <text x="149" y="523" fill="#667087" font-size="18">A completed tale can log “reading”</text>
    </g>
    <rect x="101" y="572" width="422" height="72" rx="20" fill="#ece4f4"/>
    <text x="312" y="602" text-anchor="middle" fill="#5d478b" font-family="Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="1">FREE • YOU PICK • NO SLEEP CLAIM</text>
    <text x="312" y="628" text-anchor="middle" fill="#645e72" font-family="Arial, sans-serif" font-size="16">A ritual tool, not a prediction</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="638" y="156" width="500" height="522" rx="34" fill="#eef6f5"/>
    <rect x="662" y="180" width="452" height="106" rx="25" fill="url(#read)"/>
    <text x="692" y="225" fill="#c8f0eb" font-family="Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="2">FOR THE PARENT</text>
    <text x="692" y="264" fill="#ffffff" font-family="Georgia, serif" font-size="32" font-weight="700">Tonight’s Story</text>
    <circle cx="1056" cy="233" r="30" fill="#f0c986"/>
    <text x="1056" y="244" text-anchor="middle" font-size="31">🌙</text>

    <g font-family="Arial, sans-serif">
      <circle cx="691" cy="333" r="16" fill="#49a69e"/><text x="691" y="340" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">1</text>
      <text x="725" y="329" fill="#26334c" font-size="23" font-weight="800">Reads real logs</text>
      <text x="725" y="357" fill="#667087" font-size="18">Tonight’s state plus recent sleep patterns</text>

      <circle cx="691" cy="416" r="16" fill="#49a69e"/><text x="691" y="423" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">2</text>
      <text x="725" y="412" fill="#26334c" font-size="23" font-weight="800">Explains before advising</text>
      <text x="725" y="440" fill="#667087" font-size="18">Wins, seeing → meaning, one gentle experiment</text>

      <circle cx="691" cy="499" r="16" fill="#49a69e"/><text x="691" y="506" text-anchor="middle" fill="#fff" font-size="19" font-weight="800">3</text>
      <text x="725" y="495" fill="#26334c" font-size="23" font-weight="800">Stays quiet on gaps</text>
      <text x="725" y="523" fill="#667087" font-size="18">Missing nights are not counted as bad nights</text>
    </g>
    <rect x="677" y="572" width="422" height="72" rx="20" fill="#dcefed"/>
    <text x="888" y="602" text-anchor="middle" fill="#286c71" font-family="Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="1">PREMIUM • LOG-DERIVED • EXPLAINED</text>
    <text x="888" y="628" text-anchor="middle" fill="#526e73" font-family="Arial, sans-serif" font-size="16">A briefing, not a diagnosis</text>
  </g>

  <circle cx="600" cy="418" r="32" fill="#f2cf86" stroke="#fff4d7" stroke-width="6"/>
  <text x="600" y="426" text-anchor="middle" fill="#17223d" font-family="Georgia, serif" font-size="24" font-weight="700">≠</text>
  <text x="600" y="725" text-anchor="middle" fill="#d9e1ef" font-family="Arial, sans-serif" font-size="18">The reading log does not prove the story caused better sleep.</text>
</svg>
