<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba Quick Log turns a sentence into reviewed timeline entries</title>
  <desc id="desc">A four-step flow: speak or type one sentence, OBubba proposes feed, nappy and nap entries, the parent checks the details, then deliberately saves them to the shared timeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8F1"/><stop offset="1" stop-color="#F2EAF7"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#5A3E36" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1200" height="980" rx="36" fill="url(#bg)"/>
  <circle cx="1088" cy="110" r="68" fill="#E7D8ED" opacity=".75"/>
  <circle cx="108" cy="875" r="84" fill="#F4CDBB" opacity=".52"/>
  <g font-family="Nunito, Arial, sans-serif">
    <text x="74" y="78" fill="#3F3030" font-size="40" font-weight="800">One sentence. A draft you control.</text>
    <text x="74" y="118" fill="#735F5B" font-size="21">Quick Log waits for the parent to check before anything is saved.</text>

    <g filter="url(#shadow)" fill="#FFFFFF">
      <rect x="70" y="166" width="505" height="330" rx="28"/>
      <rect x="625" y="166" width="505" height="330" rx="28"/>
      <rect x="70" y="538" width="505" height="330" rx="28"/>
      <rect x="625" y="538" width="505" height="330" rx="28"/>
    </g>

    <circle cx="119" cy="214" r="25" fill="#D97A5A"/><text x="119" y="223" text-anchor="middle" fill="#FFF" font-size="23" font-weight="800">1</text>
    <text x="157" y="223" fill="#3F3030" font-size="26" font-weight="800">Say or type</text>
    <rect x="99" y="259" width="447" height="147" rx="20" fill="#FFF5EF" stroke="#E8BDAA" stroke-width="2"/>
    <path d="M141 317a20 20 0 0 0 40 0v-15a20 20 0 0 0-40 0v15zm-10 0a30 30 0 0 0 60 0m-30 30v24m-24 0h48" fill="none" stroke="#D97A5A" stroke-width="7" stroke-linecap="round"/>
    <text x="214" y="299" fill="#5E4945" font-size="19" font-weight="700">“Fed 100ml at 8, dirty nappy</text>
    <text x="214" y="331" fill="#5E4945" font-size="19" font-weight="700">at 9, then napped 10 to 11.”</text>
    <text x="99" y="451" fill="#735F5B" font-size="18">Speech or keyboard use the same parser.</text>

    <circle cx="674" cy="214" r="25" fill="#9C78A8"/><text x="674" y="223" text-anchor="middle" fill="#FFF" font-size="23" font-weight="800">2</text>
    <text x="712" y="223" fill="#3F3030" font-size="26" font-weight="800">OBubba proposes</text>
    <rect x="654" y="260" width="447" height="51" rx="15" fill="#EEF8F1"/><circle cx="681" cy="286" r="9" fill="#63A77A"/><text x="704" y="293" fill="#42614D" font-size="18" font-weight="700">Bottle · 100ml · 8am</text>
    <rect x="654" y="322" width="447" height="51" rx="15" fill="#EEF8F1"/><circle cx="681" cy="348" r="9" fill="#63A77A"/><text x="704" y="355" fill="#42614D" font-size="18" font-weight="700">Dirty nappy · 9am</text>
    <rect x="654" y="384" width="447" height="51" rx="15" fill="#EEF8F1"/><circle cx="681" cy="410" r="9" fill="#63A77A"/><text x="704" y="417" fill="#42614D" font-size="18" font-weight="700">Nap · 10–11am</text>
    <text x="654" y="469" fill="#735F5B" font-size="18">Proposed entries—not saved facts.</text>

    <path d="M588 319l22 14-22 14M588 690l22 14-22 14" fill="none" stroke="#9F8982" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1035 507l14 22 14-22" fill="none" stroke="#9F8982" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="119" cy="586" r="25" fill="#D6A341"/><text x="119" y="595" text-anchor="middle" fill="#FFF" font-size="23" font-weight="800">3</text>
    <text x="157" y="595" fill="#3F3030" font-size="26" font-weight="800">Check the draft</text>
    <rect x="99" y="633" width="447" height="154" rx="20" fill="#FFF9E9" stroke="#E6CB85" stroke-width="2"/>
    <path d="M138 671l12 12 23-27M138 713l12 12 23-27M138 755l12 12 23-27" fill="none" stroke="#B38526" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="194" y="676" fill="#5E4945" font-size="18" font-weight="700">Event type</text>
    <text x="194" y="718" fill="#5E4945" font-size="18" font-weight="700">Time and amount</text>
    <text x="194" y="760" fill="#5E4945" font-size="18" font-weight="700">Medicine and temperature</text>
    <text x="99" y="828" fill="#735F5B" font-size="18">Edit the sentence if anything was misheard.</text>

    <circle cx="674" cy="586" r="25" fill="#63A77A"/><text x="674" y="595" text-anchor="middle" fill="#FFF" font-size="23" font-weight="800">4</text>
    <text x="712" y="595" fill="#3F3030" font-size="26" font-weight="800">Choose to save</text>
    <rect x="654" y="635" width="447" height="63" rx="32" fill="#D97A5A"/>
    <text x="878" y="675" text-anchor="middle" fill="#FFF" font-size="22" font-weight="800">Log 3 entries</text>
    <path d="M704 760h349M733 731v59M878 731v59M1023 731v59" stroke="#B4CDBB" stroke-width="8" stroke-linecap="round"/>
    <circle cx="733" cy="760" r="13" fill="#63A77A"/><circle cx="878" cy="760" r="13" fill="#63A77A"/><circle cx="1023" cy="760" r="13" fill="#63A77A"/>
    <text x="654" y="828" fill="#735F5B" font-size="18">Only now does OBubba write to the timeline.</text>

    <rect x="290" y="904" width="620" height="48" rx="24" fill="#3F3030"/>
    <text x="600" y="936" text-anchor="middle" fill="#FFF" font-size="19" font-weight="800">Fast to capture · deliberate to commit · shared with carers</text>
  </g>
</svg>
