<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex, follow"/>
  <meta name="theme-color" content="#071b3a"/>
  <title>Open OBubba</title>
  <link rel="icon" type="image/png" href="/obubba-baby-tracker-app-icon-crowned-baby.png"/>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      analytics_storage: 'denied',
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied'
    });
    gtag('set', 'ads_data_redaction', true);
    gtag('js', new Date());
    gtag('config', 'G-Y7CHSL1YHZ', {
      send_page_view: false,
      allow_google_signals: false,
      allow_ad_personalization_signals: false
    });
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y7CHSL1YHZ"></script>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fff8ed;
      background: radial-gradient(circle at 50% 15%, #173e72 0, #071b3a 48%, #031126 100%);
    }
    main { width: min(100%, 520px); text-align: center; }
    img { width: 104px; height: 104px; border-radius: 24px; box-shadow: 0 18px 55px rgba(0,0,0,.35); }
    h1 { margin: 24px 0 10px; font-family: Georgia, serif; font-size: clamp(32px, 8vw, 48px); }
    p { margin: 0 auto 26px; max-width: 38ch; color: #d8e5f4; font-size: 18px; line-height: 1.55; }
    .actions { display: grid; gap: 12px; }
    a {
      display: block;
      padding: 15px 20px;
      border-radius: 999px;
      color: #071b3a;
      background: #ffc766;
      font-weight: 750;
      text-decoration: none;
    }
    a.secondary { color: #fff8ed; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); }
    small { display: block; margin-top: 22px; color: #a9bdd5; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <img src="/obubba-baby-tracker-app-icon-crowned-baby.png" alt="OBubba app icon" width="104" height="104"/>
    <h1>Start with the next real moment.</h1>
    <p>Track feeds, sleep, nappies or diapers and everyday care with OBubba.</p>
    <div class="actions">
      <a id="ios" href="https://apps.apple.com/app/obubba-baby-sleep-tracker/id6760968757">Download for iPhone</a>
      <a id="android" class="secondary" href="https://play.google.com/store/apps/details?id=com.obubba.app">Get it on Android</a>
    </div>
    <small>Only approved campaign labels are used for cookieless route measurement and Google Play attribution. No baby or care information is included.</small>
  </main>
  <script>
    (() => {
      const incoming = new URLSearchParams(location.search);
      const attribution = new URLSearchParams();
      const allowedSources = new Set(['owned_search', 'instagram', 'facebook', 'meta', 'tiktok', 'email', 'app_store', 'google', 'apple_ads', 'bing', 'referral', 'direct']);
      const allowedMedia = new Set(['website', 'organic_social', 'lifecycle', 'organic_store', 'seo', 'paid_search', 'paid_social', 'referral']);
      const source = incoming.get('utm_source') || '';
      const medium = incoming.get('utm_medium') || '';
      const campaign = incoming.get('utm_campaign') || '';
      const content = incoming.get('utm_content') || '';
      if (allowedSources.has(source)) attribution.set('utm_source', source);
      if (allowedMedia.has(medium)) attribution.set('utm_medium', medium);
      if (campaign === 'from_bump_to_baby_auto') attribution.set('utm_campaign', campaign);
      if (/^auto_[A-Za-z0-9_-]{1,100}$/.test(content)) attribution.set('utm_content', content);

      const android = document.getElementById('android');
      const referrer = attribution.toString();
      if (referrer) {
        const play = new URL(android.href);
        play.searchParams.set('referrer', referrer);
        android.href = play.toString();
      }

      const agent = navigator.userAgent || '';
      const automaticStore = /Android/i.test(agent)
        ? 'google_play'
        : /iPhone|iPad|iPod/i.test(agent)
          ? 'app_store'
          : '';
      const ios = document.getElementById('ios');
      const safePageLocation = `${location.origin}${location.pathname}${referrer ? `?${referrer}` : ''}`;
      const eventParams = (store, routeMode) => ({
        event_category: 'download',
        store,
        route_mode: routeMode,
        ob_source: attribution.get('utm_source') || 'direct',
        ob_medium: attribution.get('utm_medium') || 'none',
        ob_campaign: attribution.get('utm_campaign') || 'none',
        ob_content: attribution.get('utm_content') || 'none',
        page_location: safePageLocation,
        transport_type: 'beacon'
      });

      ios.addEventListener('click', () => gtag('event', 'store_click', eventParams('app_store', 'manual')));
      android.addEventListener('click', () => gtag('event', 'store_click', eventParams('google_play', 'manual')));

      if (automaticStore) {
        const destination = automaticStore === 'google_play' ? android.href : ios.href;
        let redirected = false;
        const go = () => {
          if (redirected) return;
          redirected = true;
          location.replace(destination);
        };
        gtag('event', 'store_route', {
          ...eventParams(automaticStore, 'automatic'),
          event_callback: go,
          event_timeout: 500
        });
        setTimeout(go, 650);
      } else {
        gtag('event', 'store_route_view', eventParams('store_choice', 'desktop'));
      }
    })();
  </script>
</body>
</html>
