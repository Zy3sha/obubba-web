<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">The four gates behind OBubba's Ready to move past purées card</title>
  <desc id="desc">A four-step horizontal flow showing five recent solids, five texture-readable descriptions, corrected-age stage two or later, and at least sixty percent smooth meals, followed by a low urgency nudge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#f2ede7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#544538" flood-opacity=".14"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a7844"/></marker>
  </defs>
  <rect width="1200" height="650" rx="40" fill="url(#bg)"/>
  <text x="600" y="68" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-size="34" font-weight="800" fill="#252a35">When can the nudge appear?</text>
  <text x="600" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#626874">All four software gates must pass</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="45" y="164" width="245" height="250" rx="26" fill="#fff" stroke="#dfd1bc"/>
    <circle cx="92" cy="210" r="24" fill="#876423"/><text x="92" y="218" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1</text>
    <text x="70" y="267" font-size="25" font-weight="700" fill="#252a35">Enough solids</text>
    <text x="70" y="312" font-size="36" font-weight="800" fill="#876423">5+</text>
    <text x="70" y="345" font-size="18" fill="#626874">recent meal logs</text>
    <text x="70" y="382" font-size="15" fill="#7c818a">Fewer = stay quiet</text>

    <rect x="330" y="164" width="245" height="250" rx="26" fill="#fff" stroke="#dfd1bc"/>
    <circle cx="377" cy="210" r="24" fill="#876423"/><text x="377" y="218" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2</text>
    <text x="355" y="267" font-size="25" font-weight="700" fill="#252a35">Texture clues</text>
    <text x="355" y="312" font-size="36" font-weight="800" fill="#876423">5+</text>
    <text x="355" y="345" font-size="18" fill="#626874">readable descriptions</text>
    <text x="355" y="382" font-size="15" fill="#7c818a">“Banana” is unknown</text>

    <rect x="615" y="164" width="245" height="250" rx="26" fill="#fff" stroke="#dfd1bc"/>
    <circle cx="662" cy="210" r="24" fill="#876423"/><text x="662" y="218" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3</text>
    <text x="640" y="267" font-size="25" font-weight="700" fill="#252a35">Age context</text>
    <text x="640" y="312" font-size="36" font-weight="800" fill="#876423">Stage 2+</text>
    <text x="640" y="345" font-size="18" fill="#626874">by corrected age</text>
    <text x="640" y="382" font-size="15" fill="#7c818a">No early push</text>

    <rect x="900" y="164" width="255" height="250" rx="26" fill="#fff" stroke="#dfd1bc"/>
    <circle cx="947" cy="210" r="24" fill="#876423"/><text x="947" y="218" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">4</text>
    <text x="925" y="267" font-size="25" font-weight="700" fill="#252a35">Mostly smooth</text>
    <text x="925" y="312" font-size="36" font-weight="800" fill="#876423">≥60%</text>
    <text x="925" y="345" font-size="18" fill="#626874">of readable meals</text>
    <text x="925" y="382" font-size="15" fill="#7c818a">A threshold, not a score</text>
  </g>

  <path d="M290 289 H322 M575 289 H607 M860 289 H892" stroke="#9a7844" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M600 430 V473" stroke="#9a7844" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="248" y="486" width="704" height="112" rx="30" fill="#27323a"/>
  <text x="600" y="532" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-size="27" font-weight="800" fill="#fff">Ready to move past purées</text>
  <text x="600" y="568" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#e7e1d7">Low-urgency prompt · not a chewing or swallowing assessment</text>
</svg>
