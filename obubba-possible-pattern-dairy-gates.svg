<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba decides whether to show a possible dairy pattern</title>
  <desc id="desc">A five-gate flow showing that the app needs full Reaction logs, shared allergen labels, at least two distinct food names, one strictly leading allergen group and a tolerance check before it shows the card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf4"/>
      <stop offset="1" stop-color="#f3eff8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#3d3350" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="860" rx="42" fill="url(#bg)"/>
  <circle cx="1090" cy="90" r="150" fill="#e9b467" opacity=".13"/>
  <circle cx="95" cy="770" r="145" fill="#8ca79a" opacity=".14"/>

  <text x="72" y="82" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#a26a22" letter-spacing="2">INSIDE THE FLUTTER INSIGHT</text>
  <text x="72" y="134" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#2f2940">A group pattern has five gates</text>
  <text x="72" y="174" font-family="Inter, Arial, sans-serif" font-size="21" fill="#655e72">Today plus the previous 21 calendar days • a log pattern, never a diagnosis</text>

  <g filter="url(#shadow)">
    <rect x="72" y="218" width="1056" height="110" rx="25" fill="#ffffff"/>
    <circle cx="129" cy="273" r="29" fill="#efe5d2"/>
    <text x="129" y="282" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#8d5c1f">1</text>
    <text x="184" y="260" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#342e43">Only full Reaction logs enter</text>
    <text x="184" y="293" font-family="Inter, Arial, sans-serif" font-size="19" fill="#6a6375">“Unsure” is neutral. Blank or Loved it counts only as tolerance.</text>

    <rect x="72" y="348" width="1056" height="110" rx="25" fill="#ffffff"/>
    <circle cx="129" cy="403" r="29" fill="#e2ede7"/>
    <text x="129" y="412" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#4f7562">2</text>
    <text x="184" y="390" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#342e43">Meals must share an allergen group</text>
    <text x="184" y="423" font-family="Inter, Arial, sans-serif" font-size="19" fill="#6a6375">Food text is re-read and merged with saved tags: dairy, egg, gluten and more.</text>

    <rect x="72" y="478" width="510" height="142" rx="25" fill="#ffffff"/>
    <circle cx="129" cy="533" r="29" fill="#ece5f4"/>
    <text x="129" y="542" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#6c5385">3</text>
    <text x="184" y="520" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800" fill="#342e43">Two distinct food names</text>
    <text x="184" y="552" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6a6375">Yoghurt + cheese can qualify.</text>
    <text x="184" y="582" font-family="Inter, Arial, sans-serif" font-size="18" fill="#a25d57">Yoghurt twice cannot.</text>

    <rect x="602" y="478" width="526" height="142" rx="25" fill="#ffffff"/>
    <circle cx="659" cy="533" r="29" fill="#f4e6e4"/>
    <text x="659" y="542" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#9a5651">4</text>
    <text x="714" y="520" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800" fill="#342e43">One group must lead outright</text>
    <text x="714" y="552" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6a6375">Dairy 2 vs egg 1 can qualify.</text>
    <text x="714" y="582" font-family="Inter, Arial, sans-serif" font-size="18" fill="#a25d57">Dairy 2 vs egg 2 is suppressed.</text>
  </g>

  <path d="M600 636v36" stroke="#b49e7e" stroke-width="4" stroke-linecap="round"/>
  <path d="M590 665l10 12 10-12" fill="none" stroke="#b49e7e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="72" y="688" width="1056" height="114" rx="27" fill="#342e43"/>
  <circle cx="129" cy="745" r="29" fill="#d8b576"/>
  <text x="129" y="754" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#342e43">5</text>
  <text x="184" y="731" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Tolerance changes the tone—not the history</text>
  <text x="184" y="765" font-family="Inter, Arial, sans-serif" font-size="18" fill="#e8e2ef">With 2 reactions, 4+ calm group meals soften the card. It still cannot clear or diagnose an allergy.</text>
</svg>
