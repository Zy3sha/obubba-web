<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba free access and Premium fit together</title>
  <desc id="desc">A vertical map showing free core tracking as the permanent foundation, automatic Premium access during pregnancy and the first two corrected months, a deferred fourteen-day trial, and the optional paid Premium layer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b36"/>
      <stop offset="0.55" stop-color="#102a50"/>
      <stop offset="1" stop-color="#281d49"/>
    </linearGradient>
    <linearGradient id="free" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6fbf4"/>
      <stop offset="1" stop-color="#b9e9d9"/>
    </linearGradient>
    <linearGradient id="early" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5d6"/>
      <stop offset="1" stop-color="#f4cf77"/>
    </linearGradient>
    <linearGradient id="trial" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eadfff"/>
      <stop offset="1" stop-color="#c4afe9"/>
    </linearGradient>
    <linearGradient id="paid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc9ba"/>
      <stop offset="1" stop-color="#ec8b82"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020c1a" flood-opacity=".38"/>
    </filter>
  </defs>

  <rect width="1200" height="1500" rx="54" fill="url(#bg)"/>
  <circle cx="1060" cy="150" r="230" fill="#8067c5" opacity=".12"/>
  <circle cx="130" cy="1340" r="250" fill="#e99584" opacity=".09"/>
  <g fill="#f4d47d" opacity=".6">
    <circle cx="84" cy="105" r="3"/><circle cx="155" cy="190" r="2"/><circle cx="1086" cy="262" r="3"/>
    <circle cx="1010" cy="115" r="2"/><circle cx="1110" cy="1270" r="3"/><circle cx="96" cy="1212" r="2"/>
  </g>

  <text x="90" y="112" fill="#f4d47d" font-family="Nunito, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="4">OBUBBA, WITHOUT THE GUESSWORK</text>
  <text x="90" y="180" fill="#fffaf0" font-family="Georgia, serif" font-size="56" font-weight="700">Free is the foundation.</text>
  <text x="90" y="240" fill="#fffaf0" font-family="Georgia, serif" font-size="56" font-weight="700">Premium is the deeper layer.</text>
  <text x="90" y="292" fill="#c9d5e5" font-family="Nunito, Arial, sans-serif" font-size="25">The trial waits until the pregnancy and early-newborn gift has finished.</text>

  <g filter="url(#shadow)">
    <rect x="76" y="350" width="1048" height="264" rx="38" fill="url(#free)"/>
    <circle cx="153" cy="428" r="43" fill="#173b42"/>
    <path d="M135 428l12 12 25-29" fill="none" stroke="#dff9ef" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="220" y="414" fill="#12333b" font-family="Nunito, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="3">ALWAYS AVAILABLE</text>
    <text x="220" y="465" fill="#12333b" font-family="Georgia, serif" font-size="43" font-weight="700">Free core tracking</text>
    <text x="220" y="510" fill="#31565c" font-family="Nunito, Arial, sans-serif" font-size="31">One baby · feeds · sleep · nappies · timers</text>
    <text x="220" y="552" fill="#31565c" font-family="Nunito, Arial, sans-serif" font-size="31">care tools · growth · milestones · memories</text>
    <rect x="868" y="384" width="184" height="46" rx="23" fill="#173b42"/>
    <text x="960" y="415" fill="#dff9ef" text-anchor="middle" font-family="Nunito, Arial, sans-serif" font-size="24" font-weight="900">NO EXPIRY</text>
  </g>

  <path d="M600 614v58" stroke="#f4d47d" stroke-width="5" stroke-linecap="round"/>
  <path d="M582 658l18 20 18-20" fill="none" stroke="#f4d47d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="76" y="686" width="1048" height="222" rx="38" fill="url(#early)"/>
    <circle cx="153" cy="757" r="43" fill="#4d3820"/>
    <path d="M153 731c-20 0-31 16-31 31 0 25 31 42 31 42s31-17 31-42c0-15-11-31-31-31z" fill="#f4cf77"/>
    <text x="220" y="748" fill="#4d3820" font-family="Nunito, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="3">PREMIUM, ON OBUBBA</text>
    <text x="220" y="799" fill="#4d3820" font-family="Georgia, serif" font-size="40" font-weight="700">Pregnancy + first two corrected months</text>
    <text x="220" y="844" fill="#6b5230" font-family="Nunito, Arial, sans-serif" font-size="31">Automatic · no purchase · the trial waits</text>
  </g>

  <path d="M600 908v58" stroke="#d6c4fb" stroke-width="5" stroke-linecap="round"/>
  <path d="M582 952l18 20 18-20" fill="none" stroke="#d6c4fb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="76" y="980" width="1048" height="204" rx="38" fill="url(#trial)"/>
    <circle cx="153" cy="1048" r="43" fill="#3c315f"/>
    <path d="M153 1025v26l19 13" fill="none" stroke="#eadfff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="153" cy="1048" r="28" fill="none" stroke="#eadfff" stroke-width="6"/>
    <text x="220" y="1038" fill="#352b57" font-family="Nunito, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="3">THEN, IF ELIGIBLE</text>
    <text x="220" y="1089" fill="#352b57" font-family="Georgia, serif" font-size="42" font-weight="700">One-time 14-day Premium trial</text>
    <text x="220" y="1135" fill="#5a4c7a" font-family="Nunito, Arial, sans-serif" font-size="31">Test timing · guidance · Luna · plans</text>
  </g>

  <path d="M600 1184v54" stroke="#f3aa9d" stroke-width="5" stroke-linecap="round"/>
  <path d="M582 1224l18 20 18-20" fill="none" stroke="#f3aa9d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="76" y="1254" width="1048" height="166" rx="38" fill="url(#paid)"/>
    <circle cx="153" cy="1323" r="43" fill="#5a2f2a"/>
    <path d="M132 1323l13 13 29-31" fill="none" stroke="#ffd9d0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="220" y="1309" fill="#502b28" font-family="Nunito, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="3">YOUR CHOICE</text>
    <text x="220" y="1360" fill="#502b28" font-family="Georgia, serif" font-size="42" font-weight="700">Monthly · yearly · lifetime</text>
    <text x="220" y="1397" fill="#73433d" font-family="Nunito, Arial, sans-serif" font-size="29">Only if the deeper layer earns its place</text>
  </g>

  <text x="600" y="1462" text-anchor="middle" fill="#bfcde0" font-family="Nunito, Arial, sans-serif" font-size="24">Current Flutter flow · prices and boundaries can change</text>
</svg>
