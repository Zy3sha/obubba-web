<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba checks an early sleep-experiment win</title>
  <desc id="desc">The sleep experiment engine can call a metric improved from night three. If the experiment is active, the verdict is working and fewer than five calendar nights have elapsed, the Coach adds a caution to continue towards seven nights before counting the win.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11142f"/>
      <stop offset="1" stop-color="#25183d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242b50"/>
      <stop offset="1" stop-color="#1a2241"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="820" rx="38" fill="url(#bg)"/>
  <g fill="#f6d789" opacity=".65">
    <circle cx="91" cy="82" r="3"/><circle cx="228" cy="121" r="4"/><circle cx="1015" cy="78" r="3"/><circle cx="1110" cy="178" r="4"/>
  </g>
  <text x="64" y="88" fill="#fff5d8" font-family="Georgia,serif" font-size="40">A first read can be encouraging without being final</text>
  <text x="64" y="130" fill="#c3c8df" font-family="Arial,sans-serif" font-size="21">Flutter’s experiment engine and Coach make two different decisions from the same live status.</text>

  <g font-family="Arial,sans-serif">
    <rect x="58" y="188" width="500" height="342" rx="28" fill="url(#card)" stroke="#56618b"/>
    <text x="92" y="232" fill="#aeb8de" font-size="15" font-weight="700" letter-spacing="1.6">EXPERIMENT ENGINE</text>
    <text x="92" y="278" fill="#ffffff" font-family="Georgia,serif" font-size="30">Can the metric move by night 3?</text>
    <g transform="translate(93 324)">
      <rect width="397" height="73" rx="18" fill="#141b36"/>
      <circle cx="38" cy="36" r="20" fill="#72d69a"/>
      <path d="M29 36l7 7 13-16" fill="none" stroke="#11142f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="73" y="31" fill="#f6f3ff" font-size="17" font-weight="700">Enough usable outcomes</text>
      <text x="73" y="54" fill="#aeb8de" font-size="15">At elapsed night 3 or 4, the minimum is 2.</text>
    </g>
    <g transform="translate(93 412)">
      <rect width="397" height="83" rx="18" fill="#141b36"/>
      <circle cx="38" cy="41" r="20" fill="#72d69a"/>
      <path d="M29 41l7 7 13-16" fill="none" stroke="#11142f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="73" y="29" fill="#f6f3ff" font-size="17" font-weight="700">Meaningful metric change</text>
      <text x="73" y="53" fill="#aeb8de" font-size="14">≥0.5 fewer wakes/feeds · ≥15m later morning</text>
      <text x="73" y="72" fill="#aeb8de" font-size="14">or ≥30m longer unbroken stretch</text>
    </g>
    <rect x="379" y="211" width="142" height="43" rx="21" fill="#2d8354"/>
    <text x="450" y="238" text-anchor="middle" fill="#effff4" font-size="15" font-weight="800">WORKING ✓</text>

    <path d="M585 357h70" fill="none" stroke="#e5ae67" stroke-width="4" stroke-linecap="round"/>
    <path d="M642 345l13 12-13 12" fill="none" stroke="#e5ae67" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="680" y="188" width="462" height="342" rx="28" fill="#fff1cf"/>
    <text x="714" y="232" fill="#9b6427" font-size="15" font-weight="800" letter-spacing="1.6">COACH’S READ</text>
    <text x="714" y="278" fill="#2e2440" font-family="Georgia,serif" font-size="30">Is that win mature enough?</text>
    <g transform="translate(714 321)">
      <circle cx="24" cy="24" r="24" fill="#e5ae67"/>
      <text x="24" y="31" text-anchor="middle" fill="#2e2440" font-size="22" font-weight="900">1</text>
      <text x="62" y="20" fill="#3b3150" font-size="17" font-weight="700">Experiment is still active</text>
      <text x="62" y="44" fill="#786a82" font-size="15">A finished test is not second-guessed.</text>
    </g>
    <g transform="translate(714 391)">
      <circle cx="24" cy="24" r="24" fill="#e5ae67"/>
      <text x="24" y="31" text-anchor="middle" fill="#2e2440" font-size="22" font-weight="900">2</text>
      <text x="62" y="20" fill="#3b3150" font-size="17" font-weight="700">Verdict is exactly “working”</text>
      <text x="62" y="44" fill="#786a82" font-size="15">Gathering or missing data stays quiet.</text>
    </g>
    <g transform="translate(714 461)">
      <circle cx="24" cy="24" r="24" fill="#e5ae67"/>
      <text x="24" y="31" text-anchor="middle" fill="#2e2440" font-size="22" font-weight="900">3</text>
      <text x="62" y="20" fill="#3b3150" font-size="17" font-weight="700">Fewer than 5 calendar nights</text>
      <text x="62" y="44" fill="#786a82" font-size="15">In practice: elapsed night 3 or 4.</text>
    </g>
  </g>

  <path d="M600 552v38" stroke="#7f82a2" stroke-width="3" stroke-linecap="round"/>
  <path d="M589 580l11 12 11-12" fill="none" stroke="#7f82a2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="124" y="611" width="952" height="148" rx="32" fill="#171d38" stroke="#e5ae67" stroke-width="2"/>
  <circle cx="199" cy="685" r="44" fill="#e5ae67" filter="url(#glow)"/>
  <path d="M180 688c11-25 37-25 47-1M190 674h18" fill="none" stroke="#2d2440" stroke-width="5" stroke-linecap="round"/>
  <text x="274" y="667" fill="#fff4d6" font-family="Georgia,serif" font-size="31">Promising, but give it a couple more nights</text>
  <text x="274" y="706" fill="#c3c8df" font-family="Arial,sans-serif" font-size="19">Keep the one change steady towards ~7 nights before counting it.</text>
  <rect x="892" y="661" width="137" height="50" rx="25" fill="#e5ae67"/>
  <text x="960" y="692" text-anchor="middle" fill="#2d2440" font-family="Arial,sans-serif" font-size="15" font-weight="800">KEEP GOING</text>
</svg>
