<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1150" viewBox="0 0 1000 1150" role="img" aria-labelledby="title desc">
  <title id="title">Three OBubba report views for a baby appointment</title>
  <desc id="desc">A seven-day quick copy, a four-week clinic PDF and a doctor-visit prep sheet have different jobs. Missing data remains missing rather than becoming a false zero.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf5"/>
      <stop offset="1" stop-color="#eef6f2"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2ebff"/>
      <stop offset="1" stop-color="#e8f0ff"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0ec"/>
      <stop offset="1" stop-color="#fff8e7"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f7f2"/>
      <stop offset="1" stop-color="#edf1ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#4b625d" flood-opacity=".12"/>
    </filter>
    <style>
      .eyebrow{font:800 22px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:3px;fill:#9c5e71}
      .title{font:700 52px Georgia,"Times New Roman",serif;fill:#263c37}
      .sub{font:500 27px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#5b6d68}
      .day{font:800 24px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:2px;fill:#7653a8}
      .cardtitle{font:700 38px Georgia,"Times New Roman",serif;fill:#263c37}
      .copy{font:600 27px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#4f625d}
      .pill{font:800 22px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#263c37}
      .footer{font:700 29px Georgia,"Times New Roman",serif;fill:#fffaf4}
      .footersub{font:600 23px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#dce9e4}
    </style>
  </defs>
  <rect width="1000" height="1150" rx="42" fill="url(#bg)"/>
  <circle cx="916" cy="76" r="132" fill="#f7ddd8" opacity=".72"/>
  <circle cx="48" cy="1095" r="145" fill="#dceee3" opacity=".85"/>

  <text x="66" y="78" class="eyebrow">BEFORE THE APPOINTMENT</text>
  <text x="66" y="147" class="title">Three ways to arrive prepared</text>
  <text x="66" y="193" class="sub">Choose the smallest view that answers the question.</text>

  <g filter="url(#shadow)">
    <rect x="66" y="235" width="868" height="216" rx="30" fill="url(#purple)" stroke="#d7c9f4" stroke-width="2"/>
  </g>
  <circle cx="133" cy="303" r="39" fill="#d9cdf7"/>
  <path d="M116 286h34v40h-34zM123 278h20v9h-20zM123 300h20M123 310h16" fill="none" stroke="#6f56a7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="195" y="285" class="day">7 DAYS · QUICK COPY</text>
  <text x="195" y="331" class="cardtitle">The recent routine</text>
  <text x="195" y="374" class="copy">Sleep · feeds · consistency · latest weight</text>
  <rect x="195" y="394" width="421" height="39" rx="20" fill="#ffffff" opacity=".76"/>
  <text x="218" y="421" class="pill">FAST TO MESSAGE OR PASTE</text>

  <g filter="url(#shadow)">
    <rect x="66" y="478" width="868" height="234" rx="30" fill="url(#rose)" stroke="#efd1c8" stroke-width="2"/>
  </g>
  <circle cx="133" cy="548" r="39" fill="#f4d5ca"/>
  <path d="M116 527h34v46h-34zM122 535h22M122 546h22M122 557h16" fill="none" stroke="#a76858" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="195" y="529" class="day" fill="#9b6355">28 DAYS · CLINIC PDF</text>
  <text x="195" y="575" class="cardtitle">The pattern, not one odd day</text>
  <text x="195" y="618" class="copy">Sleep · feeds · nappies · dated growth</text>
  <rect x="195" y="642" width="461" height="45" rx="23" fill="#ffffff" opacity=".78"/>
  <text x="219" y="672" class="pill">MISSING DATA IS NOT “ZERO”</text>

  <g filter="url(#shadow)">
    <rect x="66" y="739" width="868" height="234" rx="30" fill="url(#sage)" stroke="#c7e5dc" stroke-width="2"/>
  </g>
  <circle cx="133" cy="809" r="39" fill="#ccebe2"/>
  <path d="M120 788v18a13 13 0 0 0 26 0v-18M112 788h16M138 788h16M146 806c13 0 15 18 3 22-9 3-14-4-14-10" fill="none" stroke="#487b70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="195" y="790" class="day" fill="#487b70">VISIT PREP · WHAT TO RAISE</text>
  <text x="195" y="836" class="cardtitle">The facts worth finding first</text>
  <text x="195" y="879" class="copy">Health flags · highest valid temperature</text>
  <text x="195" y="916" class="copy">Latest weight · recent feed and sleep averages</text>
  <rect x="195" y="933" width="378" height="27" rx="14" fill="#ffffff" opacity=".7"/>

  <rect x="112" y="1010" width="776" height="102" rx="30" fill="#304e46"/>
  <circle cx="162" cy="1061" r="26" fill="#f1ca8e"/>
  <path d="M151 1061l7 7 14-17" fill="none" stroke="#304e46" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="207" y="1054" class="footer">Bring your Red Book too.</text>
  <text x="207" y="1087" class="footersub">Then add symptoms, medicines and your questions.</text>
</svg>
