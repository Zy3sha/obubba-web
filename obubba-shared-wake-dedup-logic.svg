<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba keeps a shared night wake from being counted twice</title>
  <desc id="desc">Two carers log one wake two minutes apart. OBubba groups the entries as one waking, keeps the earliest time and the best resolved duration, and deducts the awake period once.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F3EE"/>
      <stop offset="1" stop-color="#EEF5F3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#33433F" flood-opacity=".12"/>
    </filter>
    <style>
      .eyebrow{font:700 14px Arial,sans-serif;letter-spacing:2px;fill:#81705D}
      .heading{font:700 28px Georgia,serif;fill:#263C38}
      .body{font:400 17px Arial,sans-serif;fill:#455651}
      .small{font:400 14px Arial,sans-serif;fill:#5E6C68}
      .label{font:700 15px Arial,sans-serif;fill:#263C38}
      .white{fill:#FFF}
    </style>
  </defs>
  <rect width="640" height="720" rx="30" fill="url(#bg)"/>
  <text x="48" y="55" class="eyebrow">ONE PHYSICAL WAKE · TWO PHONES</text>
  <text x="48" y="94" class="heading">One event should stay one event</text>

  <g filter="url(#shadow)">
    <rect x="48" y="126" width="252" height="126" rx="22" class="white"/>
    <rect x="340" y="126" width="252" height="126" rx="22" class="white"/>
  </g>
  <circle cx="88" cy="166" r="20" fill="#EAA181"/>
  <text x="88" y="172" text-anchor="middle" class="label">A</text>
  <text x="120" y="165" class="label">Carer A</text>
  <text x="120" y="191" class="body">Wake · 2:00am</text>
  <text x="120" y="218" class="small">20 min awake</text>
  <circle cx="380" cy="166" r="20" fill="#8CCFC6"/>
  <text x="380" y="172" text-anchor="middle" class="label">B</text>
  <text x="412" y="165" class="label">Carer B</text>
  <text x="412" y="191" class="body">Wake · 2:02am</text>
  <text x="412" y="218" class="small">25 min awake</text>

  <path d="M174 270 C174 307 256 302 290 334" fill="none" stroke="#B7A690" stroke-width="3"/>
  <path d="M466 270 C466 307 384 302 350 334" fill="none" stroke="#B7A690" stroke-width="3"/>
  <circle cx="320" cy="352" r="56" fill="#263C38"/>
  <path d="M307 327a25 25 0 1 0 24 40 29 29 0 1 1-24-40z" fill="#FFF3C9"/>

  <g filter="url(#shadow)">
    <rect x="48" y="426" width="544" height="166" rx="24" class="white"/>
  </g>
  <text x="76" y="464" class="eyebrow">CANONICAL NIGHT READ</text>
  <text x="76" y="503" class="heading">1 waking · 2:00am · 25 min</text>
  <line x1="76" y1="528" x2="564" y2="528" stroke="#D9E2DF" stroke-width="2"/>
  <text x="76" y="558" class="small">Earliest time kept</text>
  <text x="256" y="558" class="small">Longest resolved duration kept</text>
  <text x="76" y="580" class="small">Awake time deducted once—not 20 + 25 minutes</text>

  <rect x="48" y="622" width="544" height="58" rx="18" fill="#F5E5DD"/>
  <circle cx="78" cy="651" r="6" fill="#D77F5D"/>
  <text x="96" y="647" class="label">More than 3 minutes apart?</text>
  <text x="96" y="668" class="small">OBubba preserves them as separate wakes.</text>
</svg>
