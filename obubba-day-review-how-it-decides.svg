<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba turns a logged day into wins and a few tweaks</title>
  <desc id="desc">The Day Review combines last night and today's completed logs, applies timing and consistency guards, then separates grounded wins from small next steps without contradicting itself.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F3EE"/>
      <stop offset="1" stop-color="#EDF5F3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#31433F" flood-opacity=".12"/>
    </filter>
    <style>
      .eyebrow{font:700 14px Arial,sans-serif;letter-spacing:2px;fill:#806F61}
      .heading{font:700 29px Georgia,serif;fill:#273D39}
      .body{font:400 17px Arial,sans-serif;fill:#485A55}
      .small{font:400 14px Arial,sans-serif;fill:#5D6E69}
      .label{font:700 15px Arial,sans-serif;fill:#273D39}
      .white{fill:#FFF}
    </style>
  </defs>
  <rect width="640" height="820" rx="30" fill="url(#bg)"/>
  <text x="48" y="54" class="eyebrow">TODAY’S REVIEW · FLUTTER LOGIC</text>
  <text x="48" y="94" class="heading">A summary that waits for evidence</text>

  <g filter="url(#shadow)">
    <rect x="48" y="128" width="252" height="172" rx="23" class="white"/>
    <rect x="340" y="128" width="252" height="172" rx="23" class="white"/>
  </g>
  <circle cx="86" cy="167" r="19" fill="#273D39"/>
  <path d="M79 167a7 7 0 1 0 13-4 9 9 0 1 1-13 4z" fill="#FFF0B4"/>
  <text x="116" y="171" class="label">Last night</text>
  <text x="76" y="208" class="small">Wakes · longest stretch</text>
  <text x="76" y="233" class="small">False starts · resettles</text>
  <text x="76" y="258" class="small">Recent consolidation</text>
  <circle cx="378" cy="167" r="19" fill="#E99A78"/>
  <path d="M369 167h18m-9-9v18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="408" y="171" class="label">Today</text>
  <text x="368" y="208" class="small">Naps · actual day sleep</text>
  <text x="368" y="233" class="small">Milk feeds · wet nappies</text>
  <text x="368" y="258" class="small">Only categories you track</text>

  <path d="M174 318C174 350 258 347 290 378" fill="none" stroke="#B7A694" stroke-width="3"/>
  <path d="M466 318C466 350 382 347 350 378" fill="none" stroke="#B7A694" stroke-width="3"/>
  <circle cx="320" cy="397" r="56" fill="#273D39"/>
  <path d="M291 397h58M320 368v58" stroke="#AEE2D9" stroke-width="4" stroke-linecap="round" opacity=".85"/>
  <circle cx="320" cy="397" r="13" fill="#FFF"/>

  <g filter="url(#shadow)">
    <rect x="48" y="480" width="544" height="156" rx="24" class="white"/>
  </g>
  <text x="76" y="518" class="eyebrow">GUARDRAILS BEFORE COPY</text>
  <circle cx="84" cy="552" r="6" fill="#79CABC"/><text x="102" y="558" class="body">Low-day warnings wait until 6pm or a past day</text>
  <circle cx="84" cy="584" r="6" fill="#79CABC"/><text x="102" y="590" class="body">Broken naps use net sleep—not the raw timer arc</text>
  <circle cx="84" cy="616" r="6" fill="#79CABC"/><text x="102" y="622" class="body">Opposing sleep instructions cannot appear together</text>

  <g filter="url(#shadow)">
    <rect x="48" y="676" width="252" height="100" rx="22" fill="#EEF8F5"/>
    <rect x="340" y="676" width="252" height="100" rx="22" fill="#FAEEE8"/>
  </g>
  <text x="76" y="714" class="label">✅ What went well</text>
  <text x="76" y="744" class="small">Only grounded logged wins</text>
  <text x="368" y="714" class="label">🔧 A few tweaks</text>
  <text x="368" y="744" class="small">Small, compatible next steps</text>
  <text x="320" y="805" text-anchor="middle" class="small">No logs → no invented story</text>
</svg>
