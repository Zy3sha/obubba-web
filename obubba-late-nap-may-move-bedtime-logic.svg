<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba calculates the late nap bedtime card</title>
  <desc id="desc">A series of live gates checks awake state, last nap end, current time and higher-priority advice before adding the age-based minimum awake interval to the nap end.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9ef"/><stop offset="0.52" stop-color="#f5ebf1"/><stop offset="1" stop-color="#e9edf9"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#56436f"/><stop offset="1" stop-color="#24253f"/></linearGradient>
    <linearGradient id="time" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e6ae56"/><stop offset="0.55" stop-color="#c78978"/><stop offset="1" stop-color="#8170ab"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#332a45" flood-opacity="0.13"/></filter>
    <style>
      .ink{fill:#2b2639}.muted{fill:#655d70}.eye{font:750 24px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:2.4px}.h1{font:780 52px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.lead{font:430 27px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.num{font:800 25px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.step{font:780 34px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.body{font:430 25px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.strong{font:760 27px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.formula{font:800 40px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{font:650 21px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.cardtitle{font:790 39px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.cardbody{font:450 25px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    </style>
  </defs>
  <rect width="1600" height="1260" rx="52" fill="url(#bg)"/>
  <circle cx="1450" cy="100" r="210" fill="#d9cdf6" opacity="0.34"/><circle cx="100" cy="1170" r="220" fill="#f8dcb8" opacity="0.35"/>
  <text x="90" y="90" class="eye" fill="#a36b22">THE LIVE FLUTTER DECISION</text>
  <text x="90" y="157" class="h1 ink">Did the last nap move bedtime?</text>
  <text x="90" y="207" class="lead muted">A fixed late-nap gate meets an age-adjusted minimum interval.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="270" width="685" height="205" rx="30" fill="#fff"/>
    <circle cx="145" cy="326" r="29" fill="#f7ddb0"/><text x="137" y="335" class="num ink">1</text>
    <text x="195" y="331" class="step ink">Live state is usable</text>
    <text x="125" y="386" class="body muted">Awake anchor exists • baby is not asleep</text>
    <text x="125" y="425" class="body muted">No bedtime logged • not an explicit 0-nap day</text>

    <rect x="825" y="270" width="685" height="205" rx="30" fill="#fff"/>
    <circle cx="880" cy="326" r="29" fill="#edc8c3"/><text x="872" y="335" class="num ink">2</text>
    <text x="930" y="331" class="step ink">The nap is “late”</text>
    <text x="860" y="386" class="body muted">Last completed nap ended at or after</text>
    <text x="860" y="431" class="strong" fill="#a75448">4:00pm — a fixed product threshold</text>

    <rect x="90" y="515" width="685" height="205" rx="30" fill="#fff"/>
    <circle cx="145" cy="571" r="29" fill="#d8cfed"/><text x="137" y="580" class="num ink">3</text>
    <text x="195" y="576" class="step ink">The evening is still live</text>
    <text x="125" y="631" class="body muted">Current time is before 8:00pm</text>
    <text x="125" y="670" class="body muted">The card does not narrate yesterday’s schedule</text>

    <rect x="825" y="515" width="685" height="205" rx="30" fill="#fff"/>
    <circle cx="880" cy="571" r="29" fill="#cfe5db"/><text x="872" y="580" class="num ink">4</text>
    <text x="930" y="576" class="step ink">Nothing more urgent wins</text>
    <text x="860" y="631" class="body muted">A first nap or next sleep overdue message</text>
    <text x="860" y="670" class="body muted">takes this single live-insight slot first</text>
  </g>

  <path d="M430 748v38h740v-38M800 786v35" fill="none" stroke="#a89ab2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="175" y="832" width="1250" height="145" rx="35" fill="#fff"/>
    <rect x="175" y="832" width="16" height="145" rx="8" fill="url(#time)"/>
    <text x="230" y="892" class="small" fill="#8e6272">WORKED EXAMPLE</text>
    <text x="230" y="943" class="formula ink">4:30pm nap end  +  2h 20m minimum window  =  ~6:50pm</text>
  </g>

  <path d="M800 990v35" stroke="#9386a2" stroke-width="6" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <rect x="245" y="1038" width="1110" height="145" rx="35" fill="url(#night)"/>
    <text x="300" y="1091" class="small" fill="#ebbd68">LOW-URGENCY GUIDANCE</text>
    <text x="300" y="1141" class="cardtitle" fill="#fff">A late nap may move bedtime</text>
    <text x="300" y="1174" class="cardbody" fill="#ddd8e7">A possibility — not a command, promise or permanent schedule</text>
  </g>
  <text x="800" y="1228" text-anchor="middle" class="small muted">Fixed 4pm gate • corrected-age interval • 12/24-hour aware • today only</text>
</svg>
