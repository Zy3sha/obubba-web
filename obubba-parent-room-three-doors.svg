<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1450" viewBox="0 0 1000 1450" role="img" aria-labelledby="title desc">
  <title id="title">The three doors inside OBubba Parent Room</title>
  <desc id="desc">A vertical guide comparing the screen-local quick mood, the completed private EPDS check, and real-world human support. An emergency banner says to use local emergency services now.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A38"/>
      <stop offset="0.58" stop-color="#0D2850"/>
      <stop offset="1" stop-color="#161B46"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#163D67"/><stop offset="1" stop-color="#112C52"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#302D68"/><stop offset="1" stop-color="#18254F"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#244E4B"/><stop offset="1" stop-color="#14334C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020917" flood-opacity=".42"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="1450" rx="44" fill="url(#bg)"/>
  <circle cx="88" cy="90" r="3" fill="#FAE1A0"/><circle cx="910" cy="126" r="4" fill="#AA9BFF"/><circle cx="936" cy="430" r="2.5" fill="#FAE1A0"/><circle cx="63" cy="796" r="3" fill="#8DE4D1"/>
  <path d="M60 196 C250 85 680 55 936 184" fill="none" stroke="#9C8DFF" stroke-opacity=".14" stroke-width="2"/>

  <text x="70" y="92" fill="#B6A8FF" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4">OBUBBA • PARENT ROOM</text>
  <text x="70" y="151" fill="#FFFFFF" font-family="Georgia, serif" font-size="48" font-weight="700">Three doors. Three jobs.</text>
  <text x="70" y="193" fill="#B9C9DF" font-family="Arial, Helvetica, sans-serif" font-size="22">A pause, a check and a route to a real person are not the same thing.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="242" width="880" height="278" rx="30" fill="url(#card1)" stroke="#70C9F5" stroke-opacity=".5" stroke-width="2"/>
    <circle cx="126" cy="314" r="36" fill="#70C9F5" fill-opacity=".14" stroke="#70C9F5" stroke-opacity=".7"/>
    <text x="126" y="325" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="30">◌</text>
    <text x="184" y="293" fill="#8ED9FF" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">DOOR 1 • PAUSE NOW</text>
    <text x="184" y="333" fill="#FFFFFF" font-family="Georgia, serif" font-size="34" font-weight="700">Quick mood: “I need help”</text>
    <rect x="710" y="276" width="188" height="34" rx="17" fill="#70C9F5" fill-opacity=".14" stroke="#70C9F5" stroke-opacity=".55"/>
    <text x="804" y="299" text-anchor="middle" fill="#A8E3FF" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">SCREEN-LOCAL</text>
    <text x="104" y="385" fill="#D9E7F4" font-family="Arial, sans-serif" font-size="20">✓ Names this moment without a score</text>
    <text x="104" y="424" fill="#D9E7F4" font-family="Arial, sans-serif" font-size="20">✓ Shows kind copy and points to reset tools</text>
    <text x="104" y="474" fill="#FFB39E" font-family="Arial, sans-serif" font-size="19" font-weight="700">Does not save, call, text, notify or alert.</text>
  </g>

  <path d="M500 526 v42" stroke="#B6A8FF" stroke-width="3" stroke-linecap="round"/><path d="M488 558 l12 13 12-13" fill="none" stroke="#B6A8FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="60" y="578" width="880" height="300" rx="30" fill="url(#card2)" stroke="#9C8DFF" stroke-opacity=".65" stroke-width="2"/>
    <circle cx="126" cy="650" r="36" fill="#9C8DFF" fill-opacity=".16" stroke="#AA9BFF" stroke-opacity=".75"/>
    <text x="126" y="661" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28">♡</text>
    <text x="184" y="629" fill="#B8ACFF" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">DOOR 2 • CHECK THE WEEK</text>
    <text x="184" y="669" fill="#FFFFFF" font-family="Georgia, serif" font-size="34" font-weight="700">Private 10-question EPDS</text>
    <rect x="659" y="612" width="239" height="34" rx="17" fill="#9C8DFF" fill-opacity=".16" stroke="#AA9BFF" stroke-opacity=".6"/>
    <text x="779" y="635" text-anchor="middle" fill="#CEC7FF" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">SAVED ON COMPLETION</text>
    <text x="104" y="721" fill="#E3E0F9" font-family="Arial, sans-serif" font-size="20">✓ Screening tool—not a diagnosis</text>
    <text x="104" y="760" fill="#E3E0F9" font-family="Arial, sans-serif" font-size="20">✓ No skipped answer can become a false zero</text>
    <text x="104" y="799" fill="#E3E0F9" font-family="Arial, sans-serif" font-size="20">✓ Completion time + total score stay on device</text>
    <text x="104" y="842" fill="#F4D68F" font-family="Arial, sans-serif" font-size="19" font-weight="700">Concerning results open region-aware contact cards.</text>
  </g>

  <path d="M500 884 v42" stroke="#B6A8FF" stroke-width="3" stroke-linecap="round"/><path d="M488 916 l12 13 12-13" fill="none" stroke="#B6A8FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="60" y="936" width="880" height="274" rx="30" fill="url(#card3)" stroke="#77D8C5" stroke-opacity=".62" stroke-width="2"/>
    <circle cx="126" cy="1008" r="36" fill="#77D8C5" fill-opacity=".14" stroke="#8DE4D1" stroke-opacity=".74"/>
    <text x="126" y="1018" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="26">☎</text>
    <text x="184" y="987" fill="#8DE4D1" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">DOOR 3 • CONNECT</text>
    <text x="184" y="1027" fill="#FFFFFF" font-family="Georgia, serif" font-size="34" font-weight="700">Real-world human support</text>
    <rect x="697" y="970" width="201" height="34" rx="17" fill="#77D8C5" fill-opacity=".14" stroke="#8DE4D1" stroke-opacity=".56"/>
    <text x="798" y="993" text-anchor="middle" fill="#B9F1E6" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ACTION OUTSIDE APP</text>
    <text x="104" y="1080" fill="#DDF2EE" font-family="Arial, sans-serif" font-size="20">✓ Region-aware support details in Parent Room</text>
    <text x="104" y="1119" fill="#DDF2EE" font-family="Arial, sans-serif" font-size="20">✓ Tap-to-call/text after a concerning completed check</text>
    <text x="104" y="1167" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="19" font-weight="700">A person can listen, assess, share care and act.</text>
  </g>

  <g filter="url(#glow)">
    <rect x="60" y="1260" width="880" height="126" rx="26" fill="#612B35" stroke="#FF806F" stroke-width="2"/>
  </g>
  <circle cx="117" cy="1323" r="28" fill="#FF806F"/>
  <text x="117" y="1333" text-anchor="middle" fill="#3A1420" font-family="Arial, sans-serif" font-size="28" font-weight="900">!</text>
  <text x="164" y="1308" fill="#FFD4CC" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">IMMEDIATE DANGER?</text>
  <text x="164" y="1347" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="25" font-weight="700">Skip the app. Use local emergency services now.</text>
  <text x="70" y="1421" fill="#8FA8C6" font-family="Arial, sans-serif" font-size="15">OBubba explains the route; it cannot monitor safety or contact help on your behalf.</text>
</svg>
