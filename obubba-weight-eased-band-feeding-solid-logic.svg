<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1420" viewBox="0 0 1200 1420" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba interprets one crossed weight centile band with feeding records</title>
  <desc id="desc">A decision flow showing validation of two weights, WHO weight-for-age centile calculation, major line crossings, and the recorded milk-feed frequency check used only after exactly one line is crossed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf5"/><stop offset="1" stop-color="#f3f8f4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#392d2a" flood-opacity=".09"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#796b66"/></marker>
    <style>
      .eyebrow{font:700 22px Arial,sans-serif;letter-spacing:2px;fill:#a05b4d}.h1{font:700 46px Arial,sans-serif;fill:#332b29}.sub{font:400 23px Arial,sans-serif;fill:#665b57}.box{fill:#fff;stroke:#e5d9d2;stroke-width:2;filter:url(#shadow)}.step{font:700 25px Arial,sans-serif;fill:#332b29}.body{font:400 20px Arial,sans-serif;fill:#665b57}.small{font:400 17px Arial,sans-serif;fill:#766a65}.pill{font:700 17px Arial,sans-serif;fill:#fff}.line{stroke:#796b66;stroke-width:3;fill:none;marker-end:url(#arrow)}.branch{font:700 17px Arial,sans-serif;fill:#8d4c40}.good{fill:#e7f3e9;stroke:#79a67f;stroke-width:2}.warn{fill:#fff0e7;stroke:#d5906e;stroke-width:2}.quiet{fill:#f1eeec;stroke:#b8aaa4;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="1420" rx="36" fill="url(#bg)"/>
  <text x="80" y="82" class="eyebrow">GROWTH × FEEDING</text>
  <text x="80" y="142" class="h1">What happens before the card speaks?</text>
  <text x="80" y="188" class="sub">The Flutter rule joins a weight trend with recorded feed frequency.</text>

  <rect x="180" y="238" width="840" height="138" rx="28" class="box"/>
  <circle cx="245" cy="307" r="34" fill="#d88c79"/><text x="235" y="317" class="pill">1</text>
  <text x="305" y="292" class="step">Validate the latest two weights</text>
  <text x="305" y="326" class="body">5–90 days apart • newest ≤90 days old • valid dates and sex</text>
  <text x="305" y="354" class="small">Corrected age may apply; the in-app standard stops after 24 months.</text>
  <path d="M600 376 V430" class="line"/>

  <rect x="180" y="434" width="840" height="138" rx="28" class="box"/>
  <circle cx="245" cy="503" r="34" fill="#d3aa5e"/><text x="235" y="513" class="pill">2</text>
  <text x="305" y="488" class="step">Calculate WHO weight-for-age centiles</text>
  <text x="305" y="522" class="body">Trend must fall by at least 5 percentile points.</text>
  <text x="305" y="550" class="small">Then count strict crossings of 2 • 9 • 25 • 50 • 75 • 91 • 98.</text>
  <path d="M600 572 V626" class="line"/>

  <rect x="180" y="630" width="840" height="118" rx="28" class="box"/>
  <text x="260" y="682" class="step">How many major lines were crossed?</text>
  <text x="335" y="718" class="body">The next step depends on this count.</text>

  <path d="M360 748 V810 H205 V856" class="line"/><text x="216" y="798" class="branch">0 lines</text>
  <path d="M600 748 V856" class="line"/><text x="618" y="813" class="branch">Exactly 1</text>
  <path d="M840 748 V810 H995 V856" class="line"/><text x="874" y="798" class="branch">2+ lines</text>

  <rect x="60" y="860" width="290" height="156" rx="26" class="quiet"/>
  <text x="120" y="922" class="step">Stay quiet</text>
  <text x="96" y="958" class="body">This rule does not add</text><text x="111" y="988" class="body">feeding context yet.</text>

  <rect x="430" y="860" width="340" height="260" rx="26" class="box"/>
  <text x="478" y="912" class="step">Count milk-feed events</text>
  <text x="470" y="952" class="body">Between the two weigh-ins,</text>
  <text x="470" y="982" class="body">including both dates</text>
  <line x1="470" y1="1010" x2="730" y2="1010" stroke="#eadfd9" stroke-width="2"/>
  <text x="470" y="1044" class="small">Solids and pumping excluded</text>
  <text x="470" y="1074" class="small">Blank days omitted, not zeroed</text>
  <text x="470" y="1104" class="small">At least 3 feed-log days</text>

  <rect x="850" y="860" width="290" height="156" rx="26" class="warn"/>
  <text x="897" y="916" class="step">Check sooner</text>
  <text x="884" y="952" class="body">Health-visitor route;</text><text x="888" y="982" class="body">feed count cannot soften it.</text>

  <path d="M600 1120 V1170" class="line"/>
  <rect x="180" y="1174" width="840" height="154" rx="28" class="box"/>
  <text x="242" y="1222" class="step">Compare average with the current-age floor</text>
  <text x="230" y="1262" class="body">8/day &lt;4w • 7/day &lt;8w • 6/day &lt;13w • 5/day &lt;26w • 4/day after</text>
  <text x="295" y="1302" class="small">These are product heuristics—not clinical feeding thresholds.</text>

  <path d="M430 1328 V1362" class="line"/><path d="M770 1328 V1362" class="line"/>
  <rect x="96" y="1350" width="430" height="52" rx="20" class="good"/><text x="142" y="1384" class="body">At/above floor → “feeding looks solid”</text>
  <rect x="674" y="1350" width="430" height="52" rx="20" class="warn"/><text x="722" y="1384" class="body">Below floor → “feeds are lower”</text>
</svg>
