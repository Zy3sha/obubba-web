<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1220" viewBox="0 0 900 1220" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba ranks a baby recipe</title>
  <desc id="desc">Recipes are first checked for corrected-age stage and a lifetime reacted-allergen filter, then ranked by one new allergen, iron and whether they have been tried.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#faf5ee"/><stop offset="1" stop-color="#edf3ef"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#25373d" flood-opacity=".09"/></filter>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif;fill:#20353d}.sans{font-family:Arial,Helvetica,sans-serif;fill:#52646b}.eyebrow{font:700 17px Arial,Helvetica,sans-serif;letter-spacing:3px;fill:#966e2c}.step{font:700 17px Arial,Helvetica,sans-serif;letter-spacing:2px;fill:#966e2c}.label{font:700 23px Arial,Helvetica,sans-serif;fill:#20353d}.body{font:400 19px Arial,Helvetica,sans-serif;fill:#5b6c72}.score{font:700 25px Arial,Helvetica,sans-serif;fill:#fff}.icon{fill:none;stroke:#284a55;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="900" height="1220" rx="42" fill="url(#bg)"/>
  <circle cx="842" cy="70" r="150" fill="#e7d7ad" opacity=".3"/><circle cx="50" cy="1140" r="180" fill="#bcd4cc" opacity=".28"/>
  <text x="450" y="65" text-anchor="middle" class="eyebrow">WHY THIS RECIPE?</text>
  <text x="450" y="118" text-anchor="middle" class="serif" font-size="41" font-weight="700">Filter first. Rank second.</text>
  <text x="450" y="157" text-anchor="middle" class="sans" font-size="20">A recommendation is a shortlist—not a prescription.</text>

  <g filter="url(#shadow)"><rect x="70" y="205" width="760" height="176" rx="28" fill="#fff"/></g>
  <circle cx="158" cy="293" r="48" fill="#e8efed"/>
  <g transform="translate(158 293)"><circle r="26" class="icon"/><path d="M-13-2l10 10 19-23" class="icon"/></g>
  <text x="230" y="253" class="step">STEP 1 · ELIGIBILITY</text>
  <text x="230" y="293" class="label">Fits the corrected-age stage?</text>
  <text x="230" y="327" class="body">Only stage-appropriate recipes enter the list.</text>

  <path d="M450 381V419" stroke="#c2a763" stroke-width="5" stroke-linecap="round"/><path d="M438 407l12 14 12-14" fill="none" stroke="#c2a763" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)"><rect x="70" y="423" width="760" height="176" rx="28" fill="#fff"/></g>
  <circle cx="158" cy="511" r="48" fill="#f3e3e0"/>
  <g transform="translate(158 511)"><path d="M0-29l27 11v20c0 20-14 31-27 37-13-6-27-17-27-37v-20Z" class="icon"/><path d="M-11 4l8 8 16-19" class="icon"/></g>
  <text x="230" y="471" class="step">STEP 2 · SAFETY FILTER</text>
  <text x="230" y="511" class="label">No recorded reacted allergen?</text>
  <text x="230" y="545" class="body">Lifetime reaction history can remove a recipe.</text>

  <path d="M450 599V637" stroke="#c2a763" stroke-width="5" stroke-linecap="round"/><path d="M438 625l12 14 12-14" fill="none" stroke="#c2a763" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="450" y="684" text-anchor="middle" class="step">STEP 3 · RANK THE ELIGIBLE RECIPES</text>

  <g filter="url(#shadow)">
    <rect x="70" y="716" width="365" height="174" rx="26" fill="#fff"/>
    <rect x="465" y="716" width="365" height="174" rx="26" fill="#fff"/>
    <rect x="70" y="918" width="365" height="174" rx="26" fill="#fff"/>
    <rect x="465" y="918" width="365" height="174" rx="26" fill="#fff"/>
  </g>
  <circle cx="127" cy="773" r="34" fill="#b98a4d"/><text x="127" y="782" text-anchor="middle" class="score">+3</text>
  <text x="177" y="767" class="label">One new allergen</text><text x="177" y="803" class="body">Clear first exposure</text><text x="177" y="833" class="body">rises highest.</text>

  <circle cx="522" cy="773" r="34" fill="#547b70"/><text x="522" y="782" text-anchor="middle" class="score">+2</text>
  <text x="572" y="767" class="label">Iron-rich</text><text x="572" y="803" class="body">Keeps useful iron</text><text x="572" y="833" class="body">choices visible.</text>

  <circle cx="127" cy="975" r="34" fill="#6d7f93"/><text x="127" y="984" text-anchor="middle" class="score">+1</text>
  <text x="177" y="969" class="label">Not tried yet</text><text x="177" y="1005" class="body">A gentle variety</text><text x="177" y="1035" class="body">nudge—not a quota.</text>

  <circle cx="522" cy="975" r="34" fill="#a56e72"/><text x="522" y="984" text-anchor="middle" class="score">−2</text>
  <text x="572" y="969" class="label">2+ new allergens</text><text x="572" y="1005" class="body">Moves down so the</text><text x="572" y="1035" class="body">culprit stays clearer.</text>

  <rect x="95" y="1130" width="710" height="62" rx="31" fill="#203f4a"/>
  <text x="450" y="1169" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="24" font-weight="700" fill="#fff">OBubba narrows the choice. The parent checks the plate.</text>
</svg>
