<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1580" role="img" aria-labelledby="title desc">
  <title id="title">Four ways to use OBubba's Parent Room</title>
  <desc id="desc">A mobile-first guide showing a twenty-second pause, a two-minute reset, a private pattern over days, and routes to human support.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fdf8fc"/><stop offset=".52" stop-color="#f2efff"/><stop offset="1" stop-color="#eef6fb"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102a4a"/><stop offset="1" stop-color="#29264f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#59476c" flood-opacity=".16"/></filter>
  </defs>
  <rect width="760" height="1580" rx="38" fill="url(#bg)"/>
  <circle cx="665" cy="104" r="61" fill="#d9ceff" opacity=".5"/><circle cx="678" cy="92" r="48" fill="#fdf8fc"/>
  <circle cx="100" cy="210" r="12" fill="#e9c878" opacity=".7"/><circle cx="142" cy="176" r="7" fill="#b79be8" opacity=".8"/>

  <text x="54" y="78" fill="#8a6cb9" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">OBUBBA PARENT ROOM</text>
  <text x="54" y="139" fill="#192b43" font-family="Georgia, serif" font-size="47" font-weight="700">What do you need</text>
  <text x="54" y="191" fill="#192b43" font-family="Georgia, serif" font-size="47" font-weight="700">right now?</text>
  <text x="54" y="235" fill="#596b80" font-family="Arial, sans-serif" font-size="25">Choose the smallest useful kind of support.</text>

  <g filter="url(#shadow)">
    <rect x="42" y="284" width="676" height="230" rx="29" fill="#fff" stroke="#e3cae7"/>
    <circle cx="98" cy="344" r="33" fill="#f4dfea"/><text x="98" y="356" text-anchor="middle" fill="#ad6785" font-family="Arial" font-size="31">♥</text>
    <text x="149" y="333" fill="#ad6785" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="2">20 SECONDS</text>
    <text x="149" y="378" fill="#192b43" font-family="Georgia, serif" font-size="35" font-weight="700">Name the moment</text>
    <text x="76" y="429" fill="#536477" font-family="Arial, sans-serif" font-size="27">Tap a mood or read a kind word.</text>
    <text x="76" y="468" fill="#536477" font-family="Arial, sans-serif" font-size="27">The quick mood tap is session-only.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="42" y="544" width="676" height="258" rx="29" fill="#fff" stroke="#d9d0f4"/>
    <circle cx="98" cy="604" r="33" fill="#e7e0ff"/><path d="M84 608c16-22 30-22 39 0M84 622c16-22 30-22 39 0" fill="none" stroke="#7f6fc5" stroke-width="5" stroke-linecap="round"/>
    <text x="149" y="593" fill="#7968bd" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="2">2 MINUTES</text>
    <text x="149" y="638" fill="#192b43" font-family="Georgia, serif" font-size="35" font-weight="700">Reset your body</text>
    <text x="76" y="689" fill="#536477" font-family="Arial, sans-serif" font-size="27">Follow 4 in · 4 hold · 6 out, or try</text>
    <text x="76" y="728" fill="#536477" font-family="Arial, sans-serif" font-size="27">Grounding, One minute or Unclench.</text>
    <text x="76" y="767" fill="#8a6cb9" font-family="Arial, sans-serif" font-size="24" font-weight="700">A pause—not treatment or a diagnosis.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="42" y="832" width="676" height="304" rx="29" fill="#fff" stroke="#f0c7d6"/>
    <circle cx="98" cy="892" r="33" fill="#f9dfe8"/><path d="M98 912c-23-16-28-34-12-38 8-2 12 5 12 5s4-7 12-5c16 4 11 22-12 38z" fill="#d9789a"/>
    <text x="149" y="881" fill="#bd6d8a" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="2">OVER DAYS</text>
    <text x="149" y="926" fill="#192b43" font-family="Georgia, serif" font-size="35" font-weight="700">Notice a private pattern</text>
    <text x="76" y="977" fill="#536477" font-family="Arial, sans-serif" font-size="27">Recovery &amp; healing saves one daily</text>
    <text x="76" y="1016" fill="#536477" font-family="Arial, sans-serif" font-size="27">check-in and shows your own trend.</text>
    <rect x="76" y="1051" width="608" height="56" rx="18" fill="#fbf1f5"/>
    <text x="380" y="1087" text-anchor="middle" fill="#8c5d73" font-family="Arial, sans-serif" font-size="23" font-weight="700">On this phone · outside shared baby sync</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="42" y="1166" width="676" height="277" rx="29" fill="url(#night)"/>
    <circle cx="98" cy="1226" r="33" fill="#e9c878"/><text x="98" y="1237" text-anchor="middle" fill="#172b45" font-family="Arial" font-size="28" font-weight="700">4</text>
    <text x="149" y="1215" fill="#f2d998" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="2">WHEN YOU NEED A PERSON</text>
    <text x="149" y="1260" fill="#fff" font-family="Georgia, serif" font-size="35" font-weight="700">Move beyond the app</text>
    <text x="76" y="1311" fill="#d4e0ee" font-family="Arial, sans-serif" font-size="27">Open warning signs and region-aware</text>
    <text x="76" y="1350" fill="#d4e0ee" font-family="Arial, sans-serif" font-size="27">support contacts. You choose the call</text>
    <text x="76" y="1389" fill="#d4e0ee" font-family="Arial, sans-serif" font-size="27">or text; OBubba cannot summon help.</text>
  </g>

  <rect x="42" y="1474" width="676" height="68" rx="22" fill="#fff" stroke="#cdbfe7"/>
  <text x="380" y="1503" text-anchor="middle" fill="#31465e" font-family="Georgia, serif" font-size="24" font-weight="700">Care for the carer, with a clear boundary.</text>
  <text x="380" y="1531" text-anchor="middle" fill="#6d7b8c" font-family="Arial, sans-serif" font-size="18">Supportive tools are not clinical monitoring or emergency care.</text>
</svg>
