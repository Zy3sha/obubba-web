<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1480" viewBox="0 0 900 1480" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba decides to hold a sleep change</title>
  <desc id="desc">A three-stage flow showing how current disruptions hold a new plan, freeze an active coaching rung, and protect an experiment verdict from a false failure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1734"/><stop offset=".55" stop-color="#172750"/><stop offset="1" stop-color="#281d43"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8d77a"/><stop offset="1" stop-color="#dca548"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa092"/><stop offset="1" stop-color="#f47f70"/>
    </linearGradient>
    <linearGradient id="lav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9b8ff"/><stop offset="1" stop-color="#9d83de"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#030817" flood-opacity=".34"/></filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.serif{font-family:Georgia,"Times New Roman",serif}
      .ink{fill:#fffaf2}.soft{fill:#dce2f1}.faint{fill:#aeb8d1}.navy{fill:#102141}
      .eyebrow{font-size:18px;font-weight:900;letter-spacing:3px}.h1{font-size:40px;font-weight:700}.lead{font-size:21px}.kicker{font-size:16px;font-weight:900;letter-spacing:2px}.label{font-size:25px;font-weight:850}.body{font-size:18px}.small{font-size:16px}
    </style>
  </defs>
  <rect width="900" height="1480" rx="42" fill="url(#bg)"/>
  <circle cx="81" cy="118" r="4" fill="#f5d67b"/><circle cx="810" cy="92" r="3" fill="#fff" opacity=".7"/><circle cx="780" cy="810" r="4" fill="#f5d67b" opacity=".75"/><circle cx="105" cy="1190" r="3" fill="#fff" opacity=".65"/>
  <text x="70" y="78" class="sans eyebrow" fill="#f8d77a">SLEEP CHANGE CHECK</text>
  <text x="70" y="144" class="serif h1 ink">Hold the experiment, keep the care</text>
  <text x="70" y="187" class="sans lead soft">A rough patch should not be allowed to teach the app the wrong lesson.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="235" width="790" height="330" rx="30" fill="#172d55" stroke="#f5c966" stroke-opacity=".6"/>
    <rect x="80" y="262" width="112" height="34" rx="17" fill="url(#amber)"/><text x="136" y="285" text-anchor="middle" class="sans kicker navy">BEFORE</text>
    <text x="80" y="338" class="serif label ink">Should a new plan start tonight?</text>
    <text x="80" y="375" class="sans body soft">The app first checks explicit recent context:</text>
    <g transform="translate(80 405)">
      <rect width="172" height="53" rx="16" fill="#263d68"/><text x="86" y="32" text-anchor="middle" class="sans small ink">1  Illness / fever</text>
      <rect x="184" width="146" height="53" rx="16" fill="#263d68"/><text x="257" y="32" text-anchor="middle" class="sans small ink">2  Teething</text>
      <rect x="342" width="186" height="53" rx="16" fill="#263d68"/><text x="435" y="32" text-anchor="middle" class="sans small ink">3  Fresh skill</text>
      <rect x="540" width="170" height="53" rx="16" fill="#263d68"/><text x="625" y="32" text-anchor="middle" class="sans small ink">4  Age window</text>
    </g>
    <path d="M450 476v28" stroke="#f5c966" stroke-width="3"/><path d="m440 496 10 12 10-12" fill="none" stroke="#f5c966" stroke-width="3"/>
    <rect x="202" y="512" width="496" height="36" rx="18" fill="#fff6dc"/><text x="450" y="536" text-anchor="middle" class="sans body navy" font-weight="850">YES → “Let’s hold off a few days”</text>
  </g>

  <path d="M450 565v42" stroke="#f5c966" stroke-width="3"/><path d="m440 599 10 12 10-12" fill="none" stroke="#f5c966" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="55" y="615" width="790" height="310" rx="30" fill="#192d53" stroke="#f47f70" stroke-opacity=".58"/>
    <rect x="80" y="642" width="112" height="34" rx="17" fill="url(#coral)"/><text x="136" y="665" text-anchor="middle" class="sans kicker navy">DURING</text>
    <text x="80" y="718" class="serif label ink">What if a coaching plan is already running?</text>
    <g transform="translate(80 752)">
      <circle cx="28" cy="27" r="27" fill="#f47f70"/><path d="M19 18v18M37 18v18" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <text x="76" y="23" class="sans body ink" font-weight="800">Freeze the current rung</text><text x="76" y="48" class="sans small soft">No automatic advance or de-escalation through the disruption.</text>
    </g>
    <g transform="translate(80 830)">
      <circle cx="28" cy="27" r="27" fill="#243d68"/><path d="M17 29c9-12 18-12 27 0" fill="none" stroke="#f8d77a" stroke-width="4" stroke-linecap="round"/><circle cx="22" cy="19" r="3" fill="#f8d77a"/><circle cx="38" cy="19" r="3" fill="#f8d77a"/>
      <text x="76" y="23" class="sans body ink" font-weight="800">Keep the anchors, add comfort</text><text x="76" y="48" class="sans small soft">Care continues; only the planned progression waits.</text>
    </g>
  </g>

  <path d="M450 925v42" stroke="#b7a3f2" stroke-width="3"/><path d="m440 959 10 12 10-12" fill="none" stroke="#b7a3f2" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="55" y="975" width="790" height="325" rx="30" fill="#192d53" stroke="#9d83de" stroke-opacity=".65"/>
    <rect x="80" y="1002" width="150" height="34" rx="17" fill="url(#lav)"/><text x="155" y="1025" text-anchor="middle" class="sans kicker navy">AT REVIEW</text>
    <text x="80" y="1078" class="serif label ink">Did the disruption overlap the test window?</text>
    <text x="80" y="1115" class="sans body soft">The verdict looks back across the same trailing window—up to 14 nights.</text>
    <g transform="translate(80 1150)">
      <rect width="230" height="74" rx="20" fill="#263d68"/><text x="115" y="31" text-anchor="middle" class="sans small faint">ROUGH RESULT</text><text x="115" y="56" text-anchor="middle" class="sans body ink" font-weight="800">“Worse” / “No signal”</text>
      <path d="M247 37h62" stroke="#b7a3f2" stroke-width="4" stroke-linecap="round"/><path d="m299 27 12 10-12 10" fill="none" stroke="#b7a3f2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="326" width="384" height="74" rx="20" fill="#eee8ff"/><text x="518" y="30" text-anchor="middle" class="sans small" fill="#62518e">DISRUPTION IN WINDOW</text><text x="518" y="56" text-anchor="middle" class="sans body navy" font-weight="850">Save as “not enough clean data”</text>
    </g>
    <text x="80" y="1260" class="sans body soft">The lever is not falsely benched for weeks because a tooth or fever muddied the trial.</text>
  </g>

  <g transform="translate(55 1340)">
    <rect width="790" height="92" rx="25" fill="#fff8ea"/>
    <circle cx="49" cy="46" r="23" fill="#f47f70"/><path d="M37 47l8 8 16-19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="87" y="38" class="sans label navy">Hold does not mean do nothing.</text>
    <text x="87" y="68" class="sans body" fill="#40506d">Feed, comfort, treat, seek advice and keep sleep safe.</text>
  </g>
</svg>
