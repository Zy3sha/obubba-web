<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1160" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba decides when to show Ready to explore solids</title>
  <desc id="desc">A four-gate flow showing known corrected age, 26 completed weeks, no recent solids, and no solids anywhere in lifetime history. Passing the gates opens a three-sign human readiness check, not an automatic start instruction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf5"/>
      <stop offset="0.55" stop-color="#f5edf3"/>
      <stop offset="1" stop-color="#eef6f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#3c2c3b" flood-opacity="0.10"/>
    </filter>
    <style>
      .eyebrow{font:700 16px system-ui,-apple-system,sans-serif;letter-spacing:2px;fill:#ad563f}
      .heading{font:700 39px Georgia,serif;fill:#312737}
      .sub{font:400 18px system-ui,-apple-system,sans-serif;fill:#6b6270}
      .num{font:700 20px system-ui,-apple-system,sans-serif;fill:#8c513e}
      .cardTitle{font:700 23px system-ui,-apple-system,sans-serif;fill:#312f3b}
      .cardText{font:400 16px system-ui,-apple-system,sans-serif;fill:#665f6d}
      .small{font:600 13px system-ui,-apple-system,sans-serif;fill:#716879}
      .pill{font:700 13px system-ui,-apple-system,sans-serif;fill:#3e7056;letter-spacing:.4px}
      .resultHead{font:700 24px system-ui,-apple-system,sans-serif;fill:#fff6df}
      .resultText{font:500 15px system-ui,-apple-system,sans-serif;fill:#f7f2fa}
    </style>
  </defs>
  <rect width="800" height="1160" rx="38" fill="url(#bg)"/>
  <circle cx="705" cy="108" r="88" fill="#dfcee5" opacity=".63"/>
  <circle cx="82" cy="1084" r="112" fill="#d6e7d7" opacity=".72"/>

  <text x="62" y="72" class="eyebrow">A QUESTION, NOT A START COMMAND</text>
  <text x="62" y="126" class="heading">Four gates open the card.</text>
  <text x="62" y="171" class="heading">A human checks readiness.</text>
  <text x="62" y="211" class="sub">The current Flutter path remembers age and food history.</text>

  <g filter="url(#shadow)">
    <rect x="52" y="252" width="696" height="150" rx="28" fill="#fffdfa"/>
    <circle cx="103" cy="304" r="28" fill="#eadbc7"/>
    <text x="103" y="311" text-anchor="middle" class="num">1</text>
    <text x="147" y="296" class="cardTitle">Age must be known</text>
    <text x="147" y="329" class="cardText">Invalid or missing birth data holds young.</text>
    <rect x="147" y="350" width="229" height="30" rx="15" fill="#edf4ec"/>
    <text x="261" y="370" text-anchor="middle" class="pill">NO SIX-MONTH GUESS</text>
  </g>

  <path d="M400 402v34" stroke="#b9a9c0" stroke-width="5" stroke-linecap="round"/>
  <path d="M390 428l10 12 10-12" fill="none" stroke="#b9a9c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="52" y="448" width="696" height="150" rx="28" fill="#fffdfa"/>
    <circle cx="103" cy="500" r="28" fill="#d8e8da"/>
    <text x="103" y="507" text-anchor="middle" class="num" style="fill:#42664f">2</text>
    <text x="147" y="492" class="cardTitle">Corrected age ≥ 26 weeks</text>
    <text x="147" y="525" class="cardText">Prematurity can move the guidance clock back.</text>
    <rect x="147" y="546" width="220" height="30" rx="15" fill="#f2e9f4"/>
    <text x="257" y="566" text-anchor="middle" class="pill" style="fill:#705789">AROUND 6 MONTHS</text>
  </g>

  <path d="M400 598v34" stroke="#b9a9c0" stroke-width="5" stroke-linecap="round"/>
  <path d="M390 624l10 12 10-12" fill="none" stroke="#b9a9c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="52" y="644" width="696" height="150" rx="28" fill="#fffdfa"/>
    <circle cx="103" cy="696" r="28" fill="#ead7ed"/>
    <text x="103" y="703" text-anchor="middle" class="num" style="fill:#6c527d">3</text>
    <text x="147" y="688" class="cardTitle">No solids in the recent window</text>
    <text x="147" y="721" class="cardText">Today plus the previous 21 calendar days.</text>
    <rect x="147" y="742" width="211" height="30" rx="15" fill="#f7ebe5"/>
    <text x="252" y="762" text-anchor="middle" class="pill" style="fill:#985442">RECENT LIST EMPTY</text>
  </g>

  <path d="M400 794v34" stroke="#b9a9c0" stroke-width="5" stroke-linecap="round"/>
  <path d="M390 820l10 12 10-12" fill="none" stroke="#b9a9c0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="52" y="840" width="696" height="150" rx="28" fill="#fffdfa"/>
    <circle cx="103" cy="892" r="28" fill="#f1d8c9"/>
    <text x="103" y="899" text-anchor="middle" class="num">4</text>
    <text x="147" y="884" class="cardTitle">No solids anywhere in history</text>
    <text x="147" y="917" class="cardText">Active days + archived lifetime summary agree.</text>
    <rect x="147" y="938" width="242" height="30" rx="15" fill="#edf4ec"/>
    <text x="268" y="958" text-anchor="middle" class="pill">FIRST-TASTE MOMENT</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="52" y="1022" width="696" height="98" rx="26" fill="#3b405f"/>
    <text x="78" y="1061" class="resultHead">Now check the baby—not another rule.</text>
    <text x="78" y="1091" class="resultText">Sits steady • reaches • swallows → then begin gently</text>
  </g>
  <text x="400" y="1144" text-anchor="middle" class="small">A card can open the checklist. It cannot certify posture or swallowing.</text>
</svg>
