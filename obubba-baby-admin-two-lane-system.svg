<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">The two-lane baby calendar</title>
  <desc id="desc">Appointments hold fixed places and times. Reminders hold preparation actions before and after the appointment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07172d"/>
      <stop offset="0.52" stop-color="#152850"/>
      <stop offset="1" stop-color="#123d45"/>
    </linearGradient>
    <linearGradient id="lav" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b79be8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#91a8ed" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8fd6c4" stop-opacity=".26"/>
      <stop offset="1" stop-color="#79c8d3" stop-opacity=".08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020817" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="1200" height="680" rx="34" fill="url(#bg)"/>
  <circle cx="1075" cy="95" r="145" fill="#f2c66d" opacity=".055"/>
  <circle cx="105" cy="600" r="180" fill="#8fd6c4" opacity=".05"/>
  <g fill="#f2c66d" opacity=".55">
    <circle cx="88" cy="82" r="2.5"/><circle cx="158" cy="128" r="1.8"/><circle cx="1010" cy="154" r="2"/><circle cx="1118" cy="213" r="2.7"/>
  </g>
  <text x="600" y="72" text-anchor="middle" fill="#f6f0e8" font-family="Nunito, Arial, sans-serif" font-size="32" font-weight="800">ONE EVENT · TWO DIFFERENT JOBS</text>
  <text x="600" y="108" text-anchor="middle" fill="#bfc8dc" font-family="Nunito, Arial, sans-serif" font-size="19">Give every fixed date a place—and every preparation task a moment.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="150" width="500" height="442" rx="28" fill="url(#lav)" stroke="#b79be8" stroke-opacity=".55"/>
    <rect x="636" y="150" width="500" height="442" rx="28" fill="url(#mint)" stroke="#8fd6c4" stroke-opacity=".55"/>
  </g>

  <g transform="translate(104 188)">
    <rect width="62" height="62" rx="18" fill="#b79be8" fill-opacity=".18" stroke="#b79be8" stroke-opacity=".5"/>
    <rect x="15" y="18" width="32" height="30" rx="5" fill="none" stroke="#d8c8f4" stroke-width="3"/>
    <path d="M15 27h32M24 13v10M38 13v10" stroke="#d8c8f4" stroke-width="3" stroke-linecap="round"/>
    <text x="82" y="27" fill="#f6f0e8" font-family="Nunito, Arial, sans-serif" font-size="27" font-weight="800">APPOINTMENT</text>
    <text x="82" y="53" fill="#c9cfe0" font-family="Nunito, Arial, sans-serif" font-size="17">The fixed place and time</text>
  </g>
  <g transform="translate(104 286)" font-family="Nunito, Arial, sans-serif">
    <rect width="420" height="82" rx="18" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="34" cy="41" r="10" fill="#f08e79"/>
    <text x="58" y="35" fill="#f6f0e8" font-size="19" font-weight="800">6–8 week baby check</text>
    <text x="58" y="60" fill="#bcc6dc" font-size="16">Tuesday · 10:20 · GP surgery</text>
  </g>
  <g transform="translate(104 386)" font-family="Nunito, Arial, sans-serif">
    <rect width="420" height="82" rx="18" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="34" cy="41" r="10" fill="#91a8ed"/>
    <text x="58" y="35" fill="#f6f0e8" font-size="19" font-weight="800">Health visitor review</text>
    <text x="58" y="60" fill="#bcc6dc" font-size="16">Friday · at home</text>
  </g>
  <text x="104" y="530" fill="#b79be8" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="1">ANSWERS: WHERE + WHEN</text>

  <g transform="translate(676 188)">
    <rect width="62" height="62" rx="18" fill="#8fd6c4" fill-opacity=".16" stroke="#8fd6c4" stroke-opacity=".5"/>
    <path d="M31 15c-8 0-13 6-13 14v8l-5 7h36l-5-7v-8c0-8-5-14-13-14Z" fill="none" stroke="#b8eddf" stroke-width="3" stroke-linejoin="round"/>
    <path d="M26 49c1 4 9 4 10 0" fill="none" stroke="#b8eddf" stroke-width="3" stroke-linecap="round"/>
    <text x="82" y="27" fill="#f6f0e8" font-family="Nunito, Arial, sans-serif" font-size="27" font-weight="800">REMINDER</text>
    <text x="82" y="53" fill="#c9d9dc" font-family="Nunito, Arial, sans-serif" font-size="17">The action that makes it easier</text>
  </g>
  <g transform="translate(676 286)" font-family="Nunito, Arial, sans-serif">
    <rect width="420" height="82" rx="18" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="34" cy="41" r="10" fill="#f2c66d"/>
    <text x="58" y="35" fill="#f6f0e8" font-size="18" font-weight="800">Put Red Book in the bag</text>
    <text x="58" y="60" fill="#c3d2d7" font-size="16">Monday evening</text>
  </g>
  <g transform="translate(676 386)" font-family="Nunito, Arial, sans-serif">
    <rect width="420" height="82" rx="18" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="34" cy="41" r="10" fill="#8fd6c4"/>
    <text x="58" y="35" fill="#f6f0e8" font-size="18" font-weight="800">Write the top 3 questions</text>
    <text x="58" y="60" fill="#c3d2d7" font-size="16">The evening before</text>
  </g>
  <text x="676" y="530" fill="#8fd6c4" font-family="Nunito, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="1">ANSWERS: WHAT + WHO</text>

  <path d="M566 370h68" stroke="#f2c66d" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 10" opacity=".85"/>
  <circle cx="600" cy="370" r="17" fill="#f2c66d"/>
  <path d="m593 370 5 5 10-12" fill="none" stroke="#10223d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="638" text-anchor="middle" fill="#e2d8c7" font-family="Nunito, Arial, sans-serif" font-size="18" font-weight="700">The calendar holds the event. The reminder carries the mental load.</text>
</svg>
