<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Night wake or wake for the day decision</title>
  <desc id="desc">A two-path guide showing that continued overnight settling belongs to Night wake, while a genuinely started day belongs to Wake for the day.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a35"/>
      <stop offset="0.58" stop-color="#122947"/>
      <stop offset="1" stop-color="#3e3148"/>
    </linearGradient>
    <linearGradient id="dawn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#75d8c5"/>
      <stop offset="1" stop-color="#f2ad91"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020b18" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect width="1200" height="800" rx="38" fill="url(#bg)"/>
  <circle cx="1030" cy="120" r="220" fill="#f2ad91" opacity="0.07"/>
  <circle cx="100" cy="730" r="240" fill="#75d8c5" opacity="0.06"/>

  <text x="600" y="72" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="800">5am: is the night continuing?</text>
  <text x="600" y="108" text-anchor="middle" fill="#c7d5e8" font-family="Arial, Helvetica, sans-serif" font-size="18">Use what happens next, not a universal clock cut-off.</text>

  <g filter="url(#shadow)">
    <rect x="340" y="145" width="520" height="126" rx="28" fill="#102b49" stroke="#d8bd75" stroke-width="2"/>
    <text x="600" y="194" text-anchor="middle" fill="#f3cf80" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" letter-spacing="1.5">ASK ONE OBSERVABLE QUESTION</text>
    <text x="600" y="236" text-anchor="middle" fill="#ffffff" font-family="Georgia, serif" font-size="27" font-weight="700">Are we still trying to continue this sleep?</text>
  </g>

  <path d="M600 271 V318 H307 V350" fill="none" stroke="#75d8c5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M600 271 V318 H893 V350" fill="none" stroke="#f2ad91" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="307" cy="350" r="8" fill="#75d8c5"/>
  <circle cx="893" cy="350" r="8" fill="#f2ad91"/>

  <g filter="url(#shadow)">
    <rect x="88" y="350" width="438" height="314" rx="30" fill="#0c2844" stroke="#75d8c5" stroke-width="2"/>
    <circle cx="143" cy="407" r="31" fill="#75d8c5"/>
    <text x="143" y="417" text-anchor="middle" fill="#062139" font-family="Arial, Helvetica, sans-serif" font-size="28">☾</text>
    <text x="188" y="398" fill="#9af0df" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" letter-spacing="1.2">YES — KEEPING NIGHT MODE</text>
    <text x="188" y="430" fill="#ffffff" font-family="Georgia, serif" font-size="27" font-weight="700">Choose Night wake</text>
    <line x1="120" y1="462" x2="494" y2="462" stroke="#315371"/>
    <text x="126" y="503" fill="#dce8f4" font-family="Arial, Helvetica, sans-serif" font-size="19">• baby is sleepy, feeding or being resettled</text>
    <text x="126" y="540" fill="#dce8f4" font-family="Arial, Helvetica, sans-serif" font-size="19">• lights and interaction remain night-time</text>
    <text x="126" y="577" fill="#dce8f4" font-family="Arial, Helvetica, sans-serif" font-size="19">• the bedtime arc stays open</text>
    <rect x="120" y="604" width="374" height="42" rx="21" fill="#75d8c5" opacity="0.16"/>
    <text x="307" y="631" text-anchor="middle" fill="#9af0df" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Timer freezes while baby is awake</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="674" y="350" width="438" height="314" rx="30" fill="#30293f" stroke="#f2ad91" stroke-width="2"/>
    <circle cx="729" cy="407" r="31" fill="#f2ad91"/>
    <text x="729" y="417" text-anchor="middle" fill="#402236" font-family="Arial, Helvetica, sans-serif" font-size="27">☀</text>
    <text x="774" y="398" fill="#ffc5ae" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" letter-spacing="1.2">NO — THE DAY HAS BEGUN</text>
    <text x="774" y="430" fill="#ffffff" font-family="Georgia, serif" font-size="27" font-weight="700">Choose Wake for the day</text>
    <line x1="706" y1="462" x2="1080" y2="462" stroke="#5c4555"/>
    <text x="712" y="503" fill="#f4e3e6" font-family="Arial, Helvetica, sans-serif" font-size="19">• baby stays alert and daytime begins</text>
    <text x="712" y="540" fill="#f4e3e6" font-family="Arial, Helvetica, sans-serif" font-size="19">• you stop trying to continue the night</text>
    <text x="712" y="577" fill="#f4e3e6" font-family="Arial, Helvetica, sans-serif" font-size="19">• the bedtime arc closes</text>
    <rect x="706" y="604" width="374" height="42" rx="21" fill="#f2ad91" opacity="0.16"/>
    <text x="893" y="631" text-anchor="middle" fill="#ffc5ae" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Morning wake anchors the new day</text>
  </g>

  <rect x="224" y="705" width="752" height="54" rx="27" fill="#091c33" stroke="url(#dawn)" stroke-width="2"/>
  <text x="600" y="738" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Unsure? If you are still resettling, choose Night wake; end the night if baby stays up.</text>
</svg>
