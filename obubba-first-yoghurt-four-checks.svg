<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Four checks for a baby's first yoghurt</title>
  <desc id="desc">Choose plain full-fat pasteurised yoghurt, offer a tiny upright taste, record what happened, and keep tolerated milk in the diet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9f2"/><stop offset="1" stop-color="#f3efff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#26324a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="690" rx="38" fill="url(#bg)"/>
  <circle cx="1088" cy="86" r="118" fill="#f8b5a8" opacity=".22"/><circle cx="95" cy="620" r="130" fill="#bca9ea" opacity=".20"/>
  <text x="600" y="72" text-anchor="middle" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#182b42">Baby's first yoghurt, without the guesswork</text>
  <text x="600" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#506174">Four calm checks are enough</text>
  <g font-family="Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(68 158)">
      <rect width="246" height="390" rx="28" fill="#fff" stroke="#efd9cc" stroke-width="2"/>
      <circle cx="123" cy="82" r="48" fill="#fff0ea"/><text x="123" y="96" text-anchor="middle" font-size="42">🥣</text>
      <rect x="26" y="148" width="48" height="28" rx="14" fill="#ef7f70"/><text x="50" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
      <text x="26" y="218" font-size="24" font-weight="800" fill="#182b42">Choose simply</text>
      <text x="26" y="258" font-size="17" fill="#506174"><tspan x="26" dy="0">Plain, pasteurised,</tspan><tspan x="26" dy="27">full-fat and no</tspan><tspan x="26" dy="27">added sugar.</tspan></text>
      <path d="M30 338l14 14 30-34" fill="none" stroke="#5a9d83" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="351" font-size="15" font-weight="700" fill="#39586b">Check the label</text>
    </g>
    <g transform="translate(340 158)">
      <rect width="246" height="390" rx="28" fill="#fff" stroke="#e1d8f5" stroke-width="2"/>
      <circle cx="123" cy="82" r="48" fill="#f1edff"/><text x="123" y="96" text-anchor="middle" font-size="42">🥄</text>
      <rect x="26" y="148" width="48" height="28" rx="14" fill="#9d83de"/><text x="50" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
      <text x="26" y="218" font-size="24" font-weight="800" fill="#182b42">Offer a taste</text>
      <text x="26" y="258" font-size="17" fill="#506174"><tspan x="26" dy="0">Baby alert and fully</tspan><tspan x="26" dy="27">upright. Start tiny</tspan><tspan x="26" dy="27">and follow their cues.</tspan></text>
      <path d="M30 338l14 14 30-34" fill="none" stroke="#5a9d83" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="351" font-size="15" font-weight="700" fill="#39586b">One new allergen</text>
    </g>
    <g transform="translate(612 158)">
      <rect width="246" height="390" rx="28" fill="#fff" stroke="#efd9cc" stroke-width="2"/>
      <circle cx="123" cy="82" r="48" fill="#fff0ea"/><text x="123" y="96" text-anchor="middle" font-size="42">✍️</text>
      <rect x="26" y="148" width="48" height="28" rx="14" fill="#ef7f70"/><text x="50" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
      <text x="26" y="218" font-size="24" font-weight="800" fill="#182b42">Record honestly</text>
      <text x="26" y="258" font-size="17" fill="#506174"><tspan x="26" dy="0">What, when, how much</tspan><tspan x="26" dy="27">was swallowed and</tspan><tspan x="26" dy="27">what you observed.</tspan></text>
      <path d="M30 338l14 14 30-34" fill="none" stroke="#5a9d83" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="351" font-size="15" font-weight="700" fill="#39586b">No diagnosis by app</text>
    </g>
    <g transform="translate(884 158)">
      <rect width="246" height="390" rx="28" fill="#fff" stroke="#e1d8f5" stroke-width="2"/>
      <circle cx="123" cy="82" r="48" fill="#f1edff"/><text x="123" y="96" text-anchor="middle" font-size="42">🔁</text>
      <rect x="26" y="148" width="48" height="28" rx="14" fill="#9d83de"/><text x="50" y="168" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">4</text>
      <text x="26" y="218" font-size="24" font-weight="800" fill="#182b42">Keep it familiar</text>
      <text x="26" y="258" font-size="17" fill="#506174"><tspan x="26" dy="0">If tolerated, include</tspan><tspan x="26" dy="27">milk again within a</tspan><tspan x="26" dy="27">varied normal diet.</tspan></text>
      <path d="M30 338l14 14 30-34" fill="none" stroke="#5a9d83" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="92" y="351" font-size="15" font-weight="700" fill="#39586b">No streak required</text>
    </g>
  </g>
  <rect x="210" y="590" width="780" height="58" rx="29" fill="#182b42"/>
  <text x="600" y="627" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff8ee">Urgent breathing, throat, collapse or floppiness symptoms → call 999, not the tracker</text>
</svg>
