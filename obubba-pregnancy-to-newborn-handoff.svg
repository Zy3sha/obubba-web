<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">How one OBubba child profile moves from pregnancy into newborn tracking</title>
  <desc id="desc">A four-step diagram showing pregnancy mode, the baby arrived switch, newborn tracking, and which records are cloud backed, local and private, or kept separately in the NHS Red Book.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7f2"/>
      <stop offset="1" stop-color="#f3edfb"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dfb8a4"/>
      <stop offset="1" stop-color="#9f88c3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#574b65" flood-opacity=".11"/>
    </filter>
  </defs>

  <rect width="1200" height="1000" rx="40" fill="url(#bg)"/>
  <circle cx="1090" cy="80" r="92" fill="#e7d9f5" opacity=".45"/>
  <circle cx="82" cy="920" r="120" fill="#eed8cd" opacity=".46"/>

  <text x="72" y="82" fill="#332b3e" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="750">One child profile. One continuous story.</text>
  <text x="72" y="126" fill="#655d6d" font-family="Inter, Arial, sans-serif" font-size="22">What changes when you tap “Baby has arrived” — and what does not.</text>

  <path d="M300 371 C410 371 408 371 493 371" fill="none" stroke="url(#bridge)" stroke-width="10" stroke-linecap="round"/>
  <path d="M706 371 C795 371 790 371 900 371" fill="none" stroke="url(#bridge)" stroke-width="10" stroke-linecap="round"/>
  <path d="M484 355 L510 371 L484 387" fill="none" stroke="#a690c8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M891 355 L917 371 L891 387" fill="none" stroke="#9f88c3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="56" y="184" width="316" height="374" rx="30" fill="#fff"/>
    <circle cx="106" cy="234" r="25" fill="#e9d2c7"/>
    <text x="106" y="242" text-anchor="middle" fill="#604739" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750">1</text>
    <text x="146" y="242" fill="#332b3e" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="750">Pregnancy mode</text>
    <rect x="86" y="278" width="256" height="67" rx="18" fill="#f9f2ee"/>
    <text x="108" y="307" fill="#715b50" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">SAME CHILD RECORD</text>
    <text x="108" y="332" fill="#332b3e" font-family="Inter, Arial, sans-serif" font-size="19">Bump name + expected date</text>
    <circle cx="104" cy="389" r="7" fill="#c48972"/>
    <text x="124" y="396" fill="#554d5d" font-family="Inter, Arial, sans-serif" font-size="20">Preparation checklist</text>
    <circle cx="104" cy="435" r="7" fill="#c48972"/>
    <text x="124" y="442" fill="#554d5d" font-family="Inter, Arial, sans-serif" font-size="20">Time-capsule letters</text>
    <circle cx="104" cy="481" r="7" fill="#c48972"/>
    <text x="124" y="488" fill="#554d5d" font-family="Inter, Arial, sans-serif" font-size="20">Pregnancy-safe guidance</text>
    <text x="86" y="529" fill="#8a6a5b" font-family="Inter, Arial, sans-serif" font-size="17" font-style="italic">No feed or nap reminders yet.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="442" y="214" width="316" height="314" rx="30" fill="#fff"/>
    <circle cx="492" cy="264" r="25" fill="#dfd2ee"/>
    <text x="492" y="272" text-anchor="middle" fill="#56426d" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750">2</text>
    <text x="532" y="272" fill="#332b3e" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="750">Baby has arrived</text>
    <text x="474" y="320" fill="#554d5d" font-family="Inter, Arial, sans-serif" font-size="20">Confirm actual date of birth</text>
    <path d="M478 348 h244" stroke="#ece5f0" stroke-width="2"/>
    <text x="474" y="382" fill="#554d5d" font-family="Inter, Arial, sans-serif" font-size="20">Was baby born early?</text>
    <text x="474" y="416" fill="#776d80" font-family="Inter, Arial, sans-serif" font-size="18">If relevant, the original due date</text>
    <text x="474" y="443" fill="#776d80" font-family="Inter, Arial, sans-serif" font-size="18">supports corrected-age context.</text>
    <rect x="474" y="470" width="252" height="35" rx="17" fill="#f1eaf7"/>
    <text x="600" y="494" text-anchor="middle" fill="#654d7f" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">UPDATE — DON’T START OVER</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="828" y="184" width="316" height="374" rx="30" fill="#fff"/>
    <circle cx="878" cy="234" r="25" fill="#d8e6d7"/>
    <text x="878" y="242" text-anchor="middle" fill="#405c44" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750">3</text>
    <text x="918" y="242" fill="#332b3e" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="750">Newborn mode</text>
    <rect x="858" y="278" width="256" height="67" rx="18" fill="#f1f6f0"/>
    <text x="880" y="307" fill="#526b55" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">SAME CHILD RECORD</text>
    <text x="880" y="332" fill="#332b3e" font-family="Inter, Arial, sans-serif" font-size="19">Now with date of birth</text>
    <circle cx="876" cy="389" r="7" fill="#719477"/>
    <text x="896" y="396" fill="#554d5d" font-family="Inter, Arial, sans-serif" font-size="20">Feeds, nappies + sleep</text>
    <circle cx="876" cy="435" r="7" fill="#719477"/>
    <text x="896" y="442" fill="#554d5d" font-family="Inter, Arial, sans-serif" font-size="20">Shared live timeline</text>
    <circle cx="876" cy="481" r="7" fill="#719477"/>
    <text x="896" y="488" fill="#554d5d" font-family="Inter, Arial, sans-serif" font-size="20">Learns from first logs</text>
    <text x="858" y="529" fill="#657968" font-family="Inter, Arial, sans-serif" font-size="17" font-style="italic">No instant schedule is invented.</text>
  </g>

  <text x="72" y="635" fill="#332b3e" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="750">Three privacy boundaries worth knowing</text>

  <g filter="url(#shadow)">
    <rect x="56" y="674" width="344" height="240" rx="28" fill="#fff"/>
    <circle cx="102" cy="721" r="22" fill="#e8dcf3"/>
    <path d="M88 723 c0-9 7-16 16-16 7 0 13 4 15 11 8 0 14 6 14 14 0 8-6 14-14 14H93c-8 0-14-6-14-14 0-5 4-9 9-9z" fill="#7b6295"/>
    <text x="142" y="730" fill="#332b3e" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="750">With the child</text>
    <text x="86" y="779" fill="#554d5d" font-family="Inter, Arial, sans-serif" font-size="19">Time-capsule letters and the</text>
    <text x="86" y="808" fill="#554d5d" font-family="Inter, Arial, sans-serif" font-size="19">preparation checklist are cloud</text>
    <text x="86" y="837" fill="#554d5d" font-family="Inter, Arial, sans-serif" font-size="19">backed with the child record.</text>
    <text x="86" y="879" fill="#745c88" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">CAN REACH JOINED CARERS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="428" y="674" width="344" height="240" rx="28" fill="#fff"/>
    <circle cx="474" cy="721" r="22" fill="#f2ded5"/>
    <path d="M474 704 c-11 0-19 8-19 18 0 16 19 27 19 27s19-11 19-27c0-10-8-18-19-18z" fill="#a86f5c"/>
    <text x="514" y="730" fill="#332b3e" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="750">Local or private</text>
    <text x="458" y="779" fill="#554d5d" font-family="Inter, Arial, sans-serif" font-size="19">Maternal mood check-ins stay</text>
    <text x="458" y="808" fill="#554d5d" font-family="Inter, Arial, sans-serif" font-size="19">private on that phone. Appointments</text>
    <text x="458" y="837" fill="#554d5d" font-family="Inter, Arial, sans-serif" font-size="19">remain on that installation.</text>
    <text x="458" y="879" fill="#8f5c4d" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">NOT CHILD-CLOUD SYNCED</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="800" y="674" width="344" height="240" rx="28" fill="#fff"/>
    <circle cx="846" cy="721" r="22" fill="#dce9dd"/>
    <rect x="835" y="706" width="22" height="30" rx="3" fill="#527458"/>
    <path d="M840 713 h12 M840 719 h12 M840 725 h8" stroke="#fff" stroke-width="2"/>
    <text x="886" y="730" fill="#332b3e" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="750">Clinical record</text>
    <text x="830" y="779" fill="#554d5d" font-family="Inter, Arial, sans-serif" font-size="19">Your NHS Red Book or eRedbook</text>
    <text x="830" y="808" fill="#554d5d" font-family="Inter, Arial, sans-serif" font-size="19">remains the health record for</text>
    <text x="830" y="837" fill="#554d5d" font-family="Inter, Arial, sans-serif" font-size="19">reviews, growth and clinical notes.</text>
    <text x="830" y="879" fill="#4e7054" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">SEPARATE FROM OBUBBA</text>
  </g>

  <text x="600" y="965" text-anchor="middle" fill="#6f6678" font-family="Inter, Arial, sans-serif" font-size="17">OBubba continuity is for family care context — not a replacement for NHS records or professional advice.</text>
</svg>
