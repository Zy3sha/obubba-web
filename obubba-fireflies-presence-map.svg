<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1500" role="img" aria-labelledby="title desc">
  <title id="title">What an OBubba firefly means</title>
  <desc id="desc">A mobile-first visual guide explaining the current ambient fireflies, the anonymous live presence design, and which personal details are never shared.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07152b"/><stop offset="1" stop-color="#173554"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#fffbe2"/><stop offset=".28" stop-color="#edc66f"/><stop offset="1" stop-color="#edc66f" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#020815" flood-opacity=".32"/></filter>
  </defs>
  <rect width="760" height="1500" rx="38" fill="url(#bg)"/>
  <circle cx="656" cy="106" r="54" fill="#f1d289" opacity=".14"/>
  <circle cx="92" cy="104" r="34" fill="url(#glow)"/><circle cx="690" cy="238" r="30" fill="url(#glow)"/>

  <text x="54" y="80" fill="#f7e5b6" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">OBUBBA NIGHT CLOCK</text>
  <text x="54" y="137" fill="#fff" font-family="Georgia, serif" font-size="46" font-weight="700">What does a firefly</text>
  <text x="54" y="188" fill="#fff" font-family="Georgia, serif" font-size="46" font-weight="700">actually mean?</text>
  <text x="54" y="231" fill="#c9d8eb" font-family="Arial, sans-serif" font-size="26">A small light. A clear privacy boundary.</text>

  <g filter="url(#shadow)">
    <rect x="42" y="276" width="676" height="278" rx="28" fill="#fffaf0"/>
    <rect x="42" y="276" width="13" height="278" rx="7" fill="#edc66f"/>
    <text x="82" y="325" fill="#8a6524" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2">WHAT YOU SEE NOW</text>
    <text x="82" y="377" fill="#132844" font-family="Georgia, serif" font-size="37" font-weight="700">An ambient night sky</text>
    <text x="82" y="426" fill="#42536a" font-family="Arial, sans-serif" font-size="28">Live presence is paused in the</text>
    <text x="82" y="465" fill="#42536a" font-family="Arial, sans-serif" font-size="28">reviewed Flutter build. The 50–72</text>
    <text x="82" y="504" fill="#42536a" font-family="Arial, sans-serif" font-size="28">lights are not a live parent count.</text>
    <circle cx="648" cy="350" r="48" fill="url(#glow)"/><circle cx="648" cy="350" r="7" fill="#fff8d2"/>
  </g>

  <text x="54" y="617" fill="#f7e5b6" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="2">WHEN LIVE PRESENCE IS ENABLED</text>

  <g filter="url(#shadow)">
    <rect x="42" y="656" width="676" height="165" rx="27" fill="#102d50" stroke="#567696"/>
    <circle cx="94" cy="708" r="29" fill="#edc66f"/><text x="94" y="719" text-anchor="middle" fill="#102540" font-family="Arial" font-size="29" font-weight="700">1</text>
    <text x="142" y="704" fill="#fff" font-family="Georgia, serif" font-size="34" font-weight="700">Anonymous heartbeat</text>
    <text x="142" y="748" fill="#cad9ea" font-family="Arial, sans-serif" font-size="27">Small app-presence signal,</text>
    <text x="142" y="785" fill="#cad9ea" font-family="Arial, sans-serif" font-size="27">approximately every 4 minutes</text>

    <rect x="42" y="847" width="676" height="165" rx="27" fill="#102d50" stroke="#567696"/>
    <circle cx="94" cy="899" r="29" fill="#edc66f"/><text x="94" y="910" text-anchor="middle" fill="#102540" font-family="Arial" font-size="29" font-weight="700">2</text>
    <text x="142" y="895" fill="#fff" font-family="Georgia, serif" font-size="34" font-weight="700">Recent, other users only</text>
    <text x="142" y="939" fill="#cad9ea" font-family="Arial, sans-serif" font-size="27">Self and stale records filtered;</text>
    <text x="142" y="976" fill="#cad9ea" font-family="Arial, sans-serif" font-size="27">recent window is 15 minutes</text>

    <rect x="42" y="1038" width="676" height="165" rx="27" fill="#102d50" stroke="#567696"/>
    <circle cx="94" cy="1090" r="29" fill="#edc66f"/><text x="94" y="1101" text-anchor="middle" fill="#102540" font-family="Arial" font-size="29" font-weight="700">3</text>
    <text x="142" y="1086" fill="#fff" font-family="Georgia, serif" font-size="34" font-weight="700">A firefly glow</text>
    <text x="142" y="1130" fill="#cad9ea" font-family="Arial, sans-serif" font-size="27">Shown only around the Track</text>
    <text x="142" y="1167" fill="#cad9ea" font-family="Arial, sans-serif" font-size="27">clock during night or twilight</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="42" y="1242" width="676" height="184" rx="28" fill="#eef4fa"/>
    <text x="78" y="1290" fill="#23415f" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="2">NEVER INCLUDED</text>
    <g fill="#17324f" font-family="Arial, sans-serif" font-size="25">
      <circle cx="87" cy="1331" r="6" fill="#c99738"/><text x="106" y="1340">Baby name, photo or profile</text>
      <circle cx="87" cy="1370" r="6" fill="#c99738"/><text x="106" y="1379">Care logs, notes or conversations</text>
      <circle cx="87" cy="1409" r="6" fill="#c99738"/><text x="106" y="1418">Location or reason anyone is awake</text>
    </g>
    <path d="M596 1311l27 27 55-66" fill="none" stroke="#6a8f7b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="380" y="1466" text-anchor="middle" fill="#f7e5b6" font-family="Georgia, serif" font-size="25" font-weight="700">Company, not a live safety service.</text>
  <text x="380" y="1492" text-anchor="middle" fill="#bacbde" font-family="Arial, sans-serif" font-size="18">No one can see, identify or message you through a firefly.</text>
</svg>
