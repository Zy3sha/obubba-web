<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba offers a sleep song and cot routine</title>
  <desc id="desc">The Flutter app needs at least three settling methods from last night, one recognised method at eighty percent or more, then chooses the most frequent crutch across seven nights. It respects parenting style and age gates, builds anchors for four nights, then adapts the fade.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf4ec"/><stop offset="1" stop-color="#eee8f2"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26324c"/><stop offset="1" stop-color="#51496f"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#45394d" flood-opacity=".11"/></filter>
  </defs>
  <rect width="720" height="1080" rx="34" fill="url(#bg)"/>
  <circle cx="646" cy="76" r="82" fill="#d9c5dc" opacity=".5"/><circle cx="54" cy="1027" r="112" fill="#cbdacb" opacity=".52"/>
  <text x="52" y="64" fill="#a55442" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">ADD FIRST. FADE SECOND.</text>
  <text x="52" y="116" fill="#2e2b3a" font-family="Georgia, serif" font-size="38" font-weight="700">A swap starts with the log.</text>
  <text x="52" y="159" fill="#2e2b3a" font-family="Georgia, serif" font-size="38" font-weight="700">Not a generic sleep rule.</text>
  <text x="52" y="198" fill="#665f6d" font-family="Arial, sans-serif" font-size="18">The current Flutter path, from pattern to gentle plan.</text>

  <g filter="url(#shadow)">
    <rect x="42" y="229" width="636" height="133" rx="24" fill="#fffdf9"/>
    <circle cx="91" cy="279" r="27" fill="#e7d7c0"/><text x="91" y="286" text-anchor="middle" fill="#905b49" font-family="Arial, sans-serif" font-size="20" font-weight="700">1</text>
    <text x="134" y="271" fill="#302e3b" font-family="Arial, sans-serif" font-size="23" font-weight="700">Last night opens the gate</text>
    <text x="134" y="305" fill="#68616e" font-family="Arial, sans-serif" font-size="17">≥3 recorded methods · one crutch is ≥80%.</text>
    <g transform="translate(134 323)"><rect width="102" height="20" rx="10" fill="#c97b67"/><rect x="112" width="102" height="20" rx="10" fill="#c97b67"/><rect x="224" width="102" height="20" rx="10" fill="#c97b67"/><rect x="336" width="50" height="20" rx="10" fill="#ded8df"/><text x="410" y="16" fill="#4f765c" font-family="Arial, sans-serif" font-size="14" font-weight="700">80% ✓</text></g>
  </g>

  <g filter="url(#shadow)">
    <rect x="42" y="386" width="636" height="143" rx="24" fill="#fffdf9"/>
    <circle cx="91" cy="436" r="27" fill="#d7e3d4"/><text x="91" y="443" text-anchor="middle" fill="#4c705a" font-family="Arial, sans-serif" font-size="20" font-weight="700">2</text>
    <text x="134" y="428" fill="#302e3b" font-family="Arial, sans-serif" font-size="23" font-weight="700">Seven nights choose the target</text>
    <text x="134" y="462" fill="#68616e" font-family="Arial, sans-serif" font-size="17">Top full-list count wins; a multi-select can count twice.</text>
    <g font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#456954"><rect x="134" y="485" width="78" height="27" rx="14" fill="#dbe7d8"/><text x="173" y="503" text-anchor="middle">FEED</text><rect x="222" y="485" width="78" height="27" rx="14" fill="#dbe7d8"/><text x="261" y="503" text-anchor="middle">ROCK</text><rect x="310" y="485" width="74" height="27" rx="14" fill="#dbe7d8"/><text x="347" y="503" text-anchor="middle">HOLD</text><rect x="394" y="485" width="66" height="27" rx="14" fill="#dbe7d8"/><text x="427" y="503" text-anchor="middle">PAT</text><rect x="470" y="485" width="88" height="27" rx="14" fill="#dbe7d8"/><text x="514" y="503" text-anchor="middle">DUMMY</text></g>
  </g>

  <g filter="url(#shadow)">
    <rect x="42" y="553" width="636" height="139" rx="24" fill="#fffdf9"/>
    <circle cx="91" cy="603" r="27" fill="#ddd3ea"/><text x="91" y="610" text-anchor="middle" fill="#675380" font-family="Arial, sans-serif" font-size="20" font-weight="700">3</text>
    <text x="134" y="595" fill="#302e3b" font-family="Arial, sans-serif" font-size="23" font-weight="700">Respect choice + age</text>
    <text x="134" y="629" fill="#68616e" font-family="Arial, sans-serif" font-size="17">“Follow my baby’s lead” = no method card. &lt;17w = wait.</text>
    <rect x="134" y="651" width="418" height="24" rx="12" fill="#e7deea"/><rect x="134" y="651" width="177" height="24" rx="12" fill="#ccbde0"/><line x1="311" y1="643" x2="311" y2="683" stroke="#7a6b99" stroke-width="3"/><line x1="405" y1="643" x2="405" y2="683" stroke="#a25e4d" stroke-width="3"/><text x="311" y="687" text-anchor="middle" fill="#675380" font-family="Arial, sans-serif" font-size="12" font-weight="700">17W</text><text x="405" y="687" text-anchor="middle" fill="#9a5d43" font-family="Arial, sans-serif" font-size="12" font-weight="700">26W DUMMY SPLIT</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="42" y="716" width="636" height="151" rx="24" fill="#fffdf9"/>
    <circle cx="91" cy="766" r="27" fill="#f0d7ca"/><text x="91" y="773" text-anchor="middle" fill="#9a5d43" font-family="Arial, sans-serif" font-size="20" font-weight="700">4</text>
    <text x="134" y="758" fill="#302e3b" font-family="Arial, sans-serif" font-size="23" font-weight="700">Build anchors for ≥4 nights</text>
    <text x="134" y="792" fill="#68616e" font-family="Arial, sans-serif" font-size="17">Keep current help. Add song · safe sleep space · routine.</text>
    <g transform="translate(134 819)"><circle cx="11" cy="11" r="11" fill="#c97b67"/><path d="M28 11h355" stroke="#c9bdcc" stroke-width="6" stroke-linecap="round"/><circle cx="148" cy="11" r="11" fill="#8276a1"/><circle cx="276" cy="11" r="11" fill="#829b87"/><circle cx="383" cy="11" r="11" fill="#d3aa62"/><text x="11" y="41" text-anchor="middle" fill="#9a5d43" font-family="Arial, sans-serif" font-size="12" font-weight="700">ADD</text><text x="148" y="41" text-anchor="middle" fill="#675380" font-family="Arial, sans-serif" font-size="12" font-weight="700">HOLD</text><text x="276" y="41" text-anchor="middle" fill="#4f765c" font-family="Arial, sans-serif" font-size="12" font-weight="700">FADE</text><text x="383" y="41" text-anchor="middle" fill="#8a6727" font-family="Arial, sans-serif" font-size="12" font-weight="700">REVIEW</text></g>
  </g>

  <g filter="url(#shadow)">
    <rect x="42" y="891" width="636" height="126" rx="24" fill="url(#night)"/>
    <text x="68" y="929" fill="#f1ca83" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">THE PLAN CAN CHANGE DIRECTION</text>
    <text x="68" y="965" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">Improve → advance · same → hold · tougher → step back</text>
    <text x="68" y="995" fill="#ded9e5" font-family="Arial, sans-serif" font-size="15">Always follow hunger, illness, comfort and safer-sleep needs first.</text>
  </g>

  <text x="360" y="1053" text-anchor="middle" fill="#635c68" font-family="Arial, sans-serif" font-size="15">Optional, responsive and reversible—not a bedtime command.</text>
</svg>
