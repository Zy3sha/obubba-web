<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba places a task around the baby's predicted rhythm</title>
  <desc id="desc">A timeline shows wake at seven, two naps and bedtime. Callouts show before and after offsets, including bath fifteen minutes after Nap 2. A note explains that a missing Nap 2 leaves the task unplaced.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf4"/>
      <stop offset="1" stop-color="#f2f8f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#315950" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="36" fill="url(#bg)"/>
  <text x="70" y="82" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#253f3a">The relationship stays. The time can move.</text>
  <text x="70" y="124" font-family="Arial, sans-serif" font-size="20" fill="#526b65">Current Flutter offsets applied to the live day plan</text>

  <line x1="110" y1="330" x2="1090" y2="330" stroke="#9bb6ae" stroke-width="8" stroke-linecap="round"/>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="170" cy="330" r="18" fill="#f3aa72"/>
    <text x="170" y="284" font-size="22" font-weight="700" fill="#253f3a">Wake</text>
    <text x="170" y="371" font-size="20" fill="#526b65">7:00</text>

    <rect x="285" y="298" width="150" height="64" rx="24" fill="#87bdb0"/>
    <text x="360" y="283" font-size="22" font-weight="700" fill="#253f3a">Nap 1</text>
    <text x="360" y="339" font-size="20" font-weight="700" fill="#fff">9:00–10:00</text>

    <rect x="590" y="298" width="190" height="64" rx="24" fill="#5e9f92"/>
    <text x="685" y="283" font-size="22" font-weight="700" fill="#253f3a">Nap 2</text>
    <text x="685" y="339" font-size="20" font-weight="700" fill="#fff">1:00–2:30</text>

    <circle cx="1020" cy="330" r="18" fill="#495d7c"/>
    <text x="1020" y="284" font-size="22" font-weight="700" fill="#253f3a">Bedtime</text>
    <text x="1020" y="371" font-size="20" fill="#526b65">7:00</text>
  </g>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="70" y="425" width="230" height="118" rx="22" fill="#fff"/>
    <text x="94" y="462" font-size="16" font-weight="700" fill="#c87543">AFTER WAKE</text>
    <text x="94" y="500" font-size="28" font-weight="700" fill="#253f3a">~7:35</text>
    <text x="94" y="528" font-size="16" fill="#526b65">wake + 35 min</text>

    <rect x="338" y="425" width="230" height="118" rx="22" fill="#fff"/>
    <text x="362" y="462" font-size="16" font-weight="700" fill="#4d8d80">BEFORE NAP</text>
    <text x="362" y="500" font-size="28" font-weight="700" fill="#253f3a">~12:40</text>
    <text x="362" y="528" font-size="16" fill="#526b65">Nap 2 start − 20 min</text>

    <rect x="606" y="410" width="260" height="148" rx="22" fill="#fff3e8" stroke="#f3aa72" stroke-width="3"/>
    <text x="630" y="450" font-size="16" font-weight="700" fill="#c87543">BATH · AFTER NAP 2</text>
    <text x="630" y="493" font-size="32" font-weight="700" fill="#253f3a">~2:45</text>
    <text x="630" y="525" font-size="16" fill="#526b65">Nap 2 end + 15 min</text>

    <rect x="904" y="425" width="226" height="118" rx="22" fill="#fff"/>
    <text x="928" y="462" font-size="16" font-weight="700" fill="#495d7c">BEFORE BED</text>
    <text x="928" y="500" font-size="28" font-weight="700" fill="#253f3a">~6:30</text>
    <text x="928" y="528" font-size="16" fill="#526b65">bedtime − 30 min</text>
  </g>

  <path d="M685 363 V400" stroke="#f3aa72" stroke-width="4" stroke-linecap="round"/>
  <path d="M675 393 L685 405 L695 393" fill="none" stroke="#f3aa72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="70" y="606" width="1060" height="70" rx="20" fill="#253f3a"/>
  <text x="100" y="649" font-family="Arial, sans-serif" font-size="20" fill="#fff"><tspan font-weight="700">If Nap 2 disappears:</tspan><tspan> the bath is not moved to another nap. It becomes unplaced, and its reminder is skipped.</tspan></text>
</svg>
