<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1180" role="img" aria-labelledby="title desc">
  <title id="title">The OBubba safety handoff</title>
  <desc id="desc">A vertical decision path: urgent symptoms go directly to emergency help; details already logged can be checked by OBubba; missing data never means a baby is fine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9f4"/><stop offset="1" stop-color="#f3e9f4"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#49364f" flood-opacity=".11"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#856b89"/></marker>
  </defs>
  <rect width="840" height="1180" rx="34" fill="url(#bg)"/>
  <text x="64" y="77" fill="#302537" font-family="Georgia,serif" font-size="44" font-weight="700">The safety handoff</text>
  <text x="64" y="118" fill="#766a78" font-family="Arial,sans-serif" font-size="22">The baby comes first. The log supports the next conversation.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="166" width="712" height="188" rx="26" fill="#fff"/>
    <circle cx="124" cy="228" r="32" fill="#6c4057"/>
    <path d="M124 207v25m0 14v1" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <text x="176" y="217" fill="#302537" font-family="Arial,sans-serif" font-size="27" font-weight="700">Baby is blue or unresponsive?</text>
    <text x="176" y="253" fill="#302537" font-family="Arial,sans-serif" font-size="27" font-weight="700">Struggling to breathe or having a first seizure?</text>
    <text x="176" y="298" fill="#6f6471" font-family="Arial,sans-serif" font-size="24">Do not log first.</text>
    <rect x="543" y="278" width="185" height="54" rx="27" fill="#6c4057"/>
    <text x="635" y="313" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">Call 999 now</text>
  </g>

  <path d="M420 374v54" stroke="#856b89" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="64" y="448" width="712" height="180" rx="26" fill="#fff"/>
    <circle cx="124" cy="504" r="28" fill="#efe2d7"/>
    <path d="M113 504h22m-11-11v22" stroke="#9b6172" stroke-width="4" stroke-linecap="round"/>
    <text x="172" y="514" fill="#302537" font-family="Arial,sans-serif" font-size="28" font-weight="700">1 · Already logged</text>
    <text x="108" y="563" fill="#6f6471" font-family="Arial,sans-serif" font-size="23">Temperature, structured nappy fields or today’s note</text>
    <text x="108" y="596" fill="#9d4e67" font-family="Arial,sans-serif" font-size="21" font-weight="700">Input, not diagnosis</text>
  </g>

  <path d="M420 648v54" stroke="#856b89" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="64" y="722" width="712" height="194" rx="26" fill="#fff"/>
    <circle cx="124" cy="778" r="28" fill="#dcece7"/>
    <path d="M112 778l8 8 18-21" fill="none" stroke="#4c8a7c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="172" y="788" fill="#302537" font-family="Arial,sans-serif" font-size="28" font-weight="700">2 · Rules check</text>
    <text x="108" y="837" fill="#6f6471" font-family="Arial,sans-serif" font-size="23">Reject obvious typos · respect missing-data gates</text>
    <text x="108" y="872" fill="#4c8a7c" font-family="Arial,sans-serif" font-size="21" font-weight="700">Same logs, same result</text>
  </g>

  <path d="M420 936v54" stroke="#856b89" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="64" y="1010" width="712" height="112" rx="26" fill="#302537"/>
    <circle cx="124" cy="1066" r="28" fill="#c07088"/>
    <path d="M113 1066h22" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="172" y="1057" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700">3 · One clear handoff</text>
    <text x="172" y="1093" fill="#f1d0aa" font-family="Arial,sans-serif" font-size="21" font-weight="700">Above routine advice · never snoozed away</text>
  </g>
  <text x="420" y="1158" text-anchor="middle" fill="#6f6471" font-family="Arial,sans-serif" font-size="21" font-weight="700">Missing logs never mean “all clear”. Trust your instincts.</text>
</svg>
