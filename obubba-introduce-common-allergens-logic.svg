<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba decides to show the Introduce the common allergens card</title>
  <desc id="desc">Four software checks lead to a low urgency reminder. The card uses six tracked priority labels and is not a complete allergen checklist or medical clearance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf2"/><stop offset="0.55" stop-color="#f7f2ff"/><stop offset="1" stop-color="#eef8f1"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b97a14"/><stop offset="1" stop-color="#e2b85f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#332b4e" flood-opacity="0.12"/></filter>
    <style>
      .ink{fill:#28243a}.muted{fill:#625d72}.eyebrow{fill:#9a6819;font:700 22px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:2.2px}.h1{font:750 49px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.lead{font:400 25px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.step{font:750 26px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.body{font:400 20px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{font:650 18px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.chip{font:700 18px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.cardtitle{font:760 35px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.cardbody{font:450 22px ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    </style>
  </defs>
  <rect width="1600" height="1020" rx="48" fill="url(#bg)"/>
  <circle cx="1460" cy="120" r="180" fill="#dac8ff" opacity="0.28"/><circle cx="100" cy="920" r="210" fill="#cdebd2" opacity="0.34"/>
  <text x="90" y="88" class="eyebrow">THE ACTUAL FLUTTER PATH</text>
  <text x="90" y="150" class="h1 ink">When does the allergen reminder appear?</text>
  <text x="90" y="199" class="lead muted">Four product gates. One gentle nudge. No invented clinical certainty.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="260" width="320" height="225" rx="28" fill="#ffffff"/>
    <circle cx="139" cy="310" r="25" fill="#f3dfb2"/><text x="132" y="319" class="small ink">1</text>
    <text x="115" y="365" class="step ink">Age gate</text>
    <text x="115" y="406" class="body muted">Weaning age is</text>
    <text x="115" y="441" class="step" fill="#9a6819">30+ weeks</text>

    <rect x="455" y="260" width="320" height="225" rx="28" fill="#ffffff"/>
    <circle cx="504" cy="310" r="25" fill="#ddd0fa"/><text x="497" y="319" class="small ink">2</text>
    <text x="480" y="365" class="step ink">Recent evidence</text>
    <text x="480" y="406" class="body muted">At least one usable</text>
    <text x="480" y="439" class="body muted">solids log in the</text>
    <text x="480" y="472" class="step" fill="#7257a6">~3-week window</text>

    <rect x="820" y="260" width="320" height="225" rx="28" fill="#ffffff"/>
    <circle cx="869" cy="310" r="25" fill="#d5ebd8"/><text x="862" y="319" class="small ink">3</text>
    <text x="845" y="365" class="step ink">Lifetime gap</text>
    <text x="845" y="406" class="body muted">At least four of the</text>
    <text x="845" y="439" class="body muted">six priority labels</text>
    <text x="845" y="472" class="step" fill="#3d7b55">still look missing</text>

    <rect x="1185" y="260" width="325" height="225" rx="28" fill="#ffffff"/>
    <circle cx="1234" cy="310" r="25" fill="#f7d7d0"/><text x="1227" y="319" class="small ink">4</text>
    <text x="1210" y="365" class="step ink">Priority clear</text>
    <text x="1210" y="406" class="body muted">No current refusal</text>
    <text x="1210" y="439" class="body muted">or qualifying iron gap</text>
    <text x="1210" y="472" class="step" fill="#a95748">wins first</text>
  </g>

  <path d="M250 515v40h1100v-40M800 555v42" fill="none" stroke="#a89cb8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="290" y="605" width="1020" height="245" rx="36" fill="#28243a"/>
    <rect x="290" y="605" width="12" height="245" rx="6" fill="url(#gold)"/>
    <circle cx="368" cy="682" r="42" fill="#fff2cb"/><text x="344" y="697" font-size="43">🥚</text>
    <text x="435" y="675" class="small" fill="#e7ba65">LOW-URGENCY GUIDANCE</text>
    <text x="435" y="724" class="cardtitle" fill="#ffffff">Introduce the common allergens</text>
    <text x="435" y="768" class="cardbody" fill="#d9d5e6">Names the first four missing labels in fixed order</text>
    <g transform="translate(435 792)">
      <rect width="92" height="38" rx="19" fill="#4a435f"/><text x="24" y="25" class="chip" fill="#fff">egg</text>
      <rect x="104" width="116" height="38" rx="19" fill="#4a435f"/><text x="123" y="25" class="chip" fill="#fff">peanut</text>
      <rect x="232" width="104" height="38" rx="19" fill="#4a435f"/><text x="254" y="25" class="chip" fill="#fff">dairy</text>
      <rect x="348" width="111" height="38" rx="19" fill="#4a435f"/><text x="369" y="25" class="chip" fill="#fff">gluten</text>
      <rect x="471" width="92" height="38" rx="19" fill="#4a435f"/><text x="497" y="25" class="chip" fill="#fff">fish</text>
      <rect x="575" width="112" height="38" rx="19" fill="#4a435f"/><text x="594" y="25" class="chip" fill="#fff">sesame</text>
    </g>
  </g>

  <g transform="translate(250 895)">
    <circle cx="18" cy="18" r="18" fill="#f2c9c0"/><path d="M11 11l14 14m0-14L11 25" stroke="#8c4338" stroke-width="4" stroke-linecap="round"/>
    <text x="52" y="25" class="small ink">Not a complete 14-allergen checklist</text>
    <circle cx="500" cy="18" r="18" fill="#f2c9c0"/><path d="M493 11l14 14m0-14l-14 14" stroke="#8c4338" stroke-width="4" stroke-linecap="round"/>
    <text x="534" y="25" class="small ink">Not proof of tolerance</text>
    <circle cx="850" cy="18" r="18" fill="#f2c9c0"/><path d="M843 11l14 14m0-14l-14 14" stroke="#8c4338" stroke-width="4" stroke-linecap="round"/>
    <text x="884" y="25" class="small ink">Not medical clearance</text>
  </g>
  <text x="800" y="979" text-anchor="middle" class="body muted">Built from logged history • reactions are handled by a separate lifetime safety layer</text>
</svg>
