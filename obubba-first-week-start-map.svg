<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc">
  <title id="title">Start softly with OBubba</title>
  <desc id="desc">A four-stage path from one-minute setup to one real log, early guidance and a more personal rhythm, with a reminder that no day number guarantees a sleep result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff9f4"/><stop offset="1" stop-color="#eef4f3"/></linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#433658"/><stop offset="1" stop-color="#203b51"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#243b4b" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1200" height="950" rx="38" fill="url(#bg)"/>
  <rect x="58" y="44" width="1084" height="126" rx="30" fill="url(#head)"/>
  <text x="100" y="94" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#a9e2d5">YOUR FIRST WEEK</text>
  <text x="100" y="140" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#fff8eb">Start softly. Let the useful pattern grow.</text>

  <path d="M568 342H632" stroke="#aaa1bd" stroke-width="5" stroke-linecap="round"/><path d="M618 330l16 12-16 12" fill="none" stroke="#aaa1bd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M885 470V520H315V560" fill="none" stroke="#aaa1bd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M303 546l12 16 12-16" fill="none" stroke="#aaa1bd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M568 692H632" stroke="#aaa1bd" stroke-width="5" stroke-linecap="round"/><path d="M618 680l16 12-16 12" fill="none" stroke="#aaa1bd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="62" y="212" width="506" height="258" rx="28" fill="#fff" stroke="#c9bde5" stroke-width="2"/>
    <circle cx="116" cy="267" r="29" fill="#eee8fb"/><text x="116" y="276" text-anchor="middle" font-size="25" font-weight="700" fill="#705da8">1</text>
    <text x="162" y="257" font-size="16" font-weight="700" fill="#7a67ad">ABOUT A MINUTE</text>
    <text x="162" y="294" font-size="28" font-weight="700" fill="#30293d">Add the basics</text>
    <text x="96" y="346" font-size="20" fill="#665f6f">Name + date of birth</text><text x="96" y="379" font-size="20" fill="#665f6f">Skip optional choices</text>
    <rect x="96" y="414" width="226" height="32" rx="16" fill="#f2eef9"/><text x="209" y="436" text-anchor="middle" font-size="15" font-weight="700" fill="#705da8">No perfect setup</text>

    <rect x="632" y="212" width="506" height="258" rx="28" fill="#fff" stroke="#efb59e" stroke-width="2"/>
    <circle cx="686" cy="267" r="29" fill="#fcebe4"/><text x="686" y="276" text-anchor="middle" font-size="25" font-weight="700" fill="#bd694c">2</text>
    <text x="732" y="257" font-size="16" font-weight="700" fill="#bd694c">RIGHT NOW</text>
    <text x="732" y="294" font-size="28" font-weight="700" fill="#30293d">Log one real thing</text>
    <text x="666" y="346" font-size="20" fill="#665f6f">Feed · nappy · sleep</text><text x="666" y="379" font-size="20" fill="#665f6f">or wake for the day</text>
    <rect x="666" y="414" width="226" height="32" rx="16" fill="#fdf0ea"/><text x="779" y="436" text-anchor="middle" font-size="15" font-weight="700" fill="#a75a43">Reality first</text>

    <rect x="62" y="562" width="506" height="258" rx="28" fill="#fff" stroke="#8fcdbf" stroke-width="2"/>
    <circle cx="116" cy="617" r="29" fill="#e4f5f1"/><text x="116" y="626" text-anchor="middle" font-size="25" font-weight="700" fill="#477f73">3</text>
    <text x="162" y="607" font-size="16" font-weight="700" fill="#477f73">DAYS 1–3</text>
    <text x="162" y="644" font-size="28" font-weight="700" fill="#30293d">Build the record</text>
    <text x="96" y="696" font-size="20" fill="#665f6f">Log ordinary days</text><text x="96" y="729" font-size="20" fill="#665f6f">Correct honest mistakes</text>
    <rect x="96" y="764" width="226" height="32" rx="16" fill="#edf8f5"/><text x="209" y="786" text-anchor="middle" font-size="15" font-weight="700" fill="#477f73">No plan pressure</text>

    <rect x="632" y="562" width="506" height="258" rx="28" fill="#fff" stroke="#9caee8" stroke-width="2"/>
    <circle cx="686" cy="617" r="29" fill="#e9edfb"/><text x="686" y="626" text-anchor="middle" font-size="25" font-weight="700" fill="#566eb5">4</text>
    <text x="732" y="607" font-size="16" font-weight="700" fill="#566eb5">AS HISTORY GROWS</text>
    <text x="732" y="644" font-size="28" font-weight="700" fill="#30293d">Read the rhythm</text>
    <text x="666" y="696" font-size="20" fill="#665f6f">Age start becomes</text><text x="666" y="729" font-size="20" fill="#665f6f">more personal guidance</text>
    <rect x="666" y="764" width="226" height="32" rx="16" fill="#eef1fb"/><text x="779" y="786" text-anchor="middle" font-size="15" font-weight="700" fill="#566eb5">Follow baby’s cues</text>
  </g>

  <rect x="108" y="850" width="984" height="72" rx="24" fill="#fff" stroke="#d8d1df" stroke-width="2"/>
  <circle cx="156" cy="886" r="23" fill="#fff1dc"/><path d="M147 886l6 6 13-16" fill="none" stroke="#a87635" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="198" y="879" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#30293d">Aim for a representative record—not a streak.</text>
  <text x="198" y="905" font-family="Arial, sans-serif" font-size="16" fill="#665f6f">No day number guarantees a longer nap or better night.</text>
</svg>
