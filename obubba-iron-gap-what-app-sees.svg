<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1050" viewBox="0 0 720 1050" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba's iron-rich food reminder works</title>
  <desc id="desc">A four-step explanation showing that OBubba checks recent food names for recognised iron-food words but cannot measure portions, absorption or blood iron.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf2"/>
      <stop offset="1" stop-color="#f4eee9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4c3d54" flood-opacity=".09"/>
    </filter>
  </defs>

  <rect width="720" height="1050" rx="36" fill="url(#bg)"/>
  <circle cx="633" cy="78" r="78" fill="#e9dff2" opacity=".72"/>
  <circle cx="70" cy="946" r="88" fill="#dfeadd" opacity=".78"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#352d3a">
    <text x="56" y="74" font-size="18" font-weight="750" letter-spacing="2.2" fill="#8c5968">OBUBBA • WEANING</text>
    <text x="56" y="128" font-size="38" font-weight="800">A food log can remind.</text>
    <text x="56" y="174" font-size="38" font-weight="800">It cannot test.</text>
    <text x="56" y="212" font-size="19" fill="#665d69">What the current iron-food notice actually sees</text>

    <g filter="url(#shadow)">
      <rect x="48" y="252" width="624" height="132" rx="24" fill="#ffffff"/>
      <circle cx="101" cy="318" r="29" fill="#dce9dd"/>
      <text x="101" y="326" font-size="22" font-weight="800" text-anchor="middle" fill="#48634f">1</text>
      <text x="148" y="297" font-size="22" font-weight="800">LOOK BACK</text>
      <text x="148" y="329" font-size="19">Recent solids logged across today</text>
      <text x="148" y="357" font-size="19">and the previous 21 calendar days</text>
    </g>

    <path d="M360 384v24" stroke="#a97889" stroke-width="4" stroke-linecap="round"/>
    <path d="m349 402 11 12 11-12" fill="none" stroke="#a97889" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#shadow)">
      <rect x="48" y="420" width="624" height="132" rx="24" fill="#ffffff"/>
      <circle cx="101" cy="486" r="29" fill="#eadff1"/>
      <text x="101" y="494" font-size="22" font-weight="800" text-anchor="middle" fill="#694d78">2</text>
      <text x="148" y="465" font-size="22" font-weight="800">PASS TWO GATES</text>
      <text x="148" y="497" font-size="19">At least 26 corrected weeks old</text>
      <text x="148" y="525" font-size="19">and at least 3 recent solids entries</text>
    </g>

    <path d="M360 552v24" stroke="#a97889" stroke-width="4" stroke-linecap="round"/>
    <path d="m349 570 11 12 11-12" fill="none" stroke="#a97889" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#shadow)">
      <rect x="48" y="588" width="624" height="148" rx="24" fill="#ffffff"/>
      <circle cx="101" cy="654" r="29" fill="#f4dfd8"/>
      <text x="101" y="662" font-size="22" font-weight="800" text-anchor="middle" fill="#915444">3</text>
      <text x="148" y="633" font-size="22" font-weight="800">READ FOOD NAMES</text>
      <text x="148" y="665" font-size="19">Look for recognised words such as</text>
      <text x="148" y="693" font-size="19" font-weight="700" fill="#744e5c">beef • lentil • egg • tofu • porridge</text>
      <text x="148" y="721" font-size="16" fill="#766e78">Notes, photos and amounts are not searched.</text>
    </g>

    <path d="M360 736v24" stroke="#a97889" stroke-width="4" stroke-linecap="round"/>
    <path d="m349 754 11 12 11-12" fill="none" stroke="#a97889" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#shadow)">
      <rect x="48" y="772" width="624" height="112" rx="24" fill="#805a73"/>
      <circle cx="101" cy="828" r="29" fill="#fff6ed"/>
      <text x="101" y="836" font-size="22" font-weight="800" text-anchor="middle" fill="#805a73">4</text>
      <text x="148" y="817" font-size="22" font-weight="800" fill="#ffffff">OFFER ONE REMINDER</text>
      <text x="148" y="849" font-size="19" fill="#fff9f4">when none of those food names match</text>
    </g>

    <rect x="48" y="918" width="624" height="84" rx="22" fill="#e7eee3" stroke="#bbcfb9" stroke-width="2"/>
    <text x="74" y="950" font-size="18" font-weight="800" fill="#48634f">NOT MEASURED</text>
    <text x="74" y="979" font-size="17" fill="#4d5d50">portion · swallowed amount · formula · absorption · blood iron</text>
  </g>
</svg>
