<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1450" viewBox="0 0 900 1450" role="img" aria-labelledby="title desc">
  <title id="title">What OBubba's Month of Love card really counts</title>
  <desc id="desc">A vertical guide showing the rolling thirty-day window, the fourteen-day and twenty-event gates, and the exact logged evidence behind five care totals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101f3c"/><stop offset="1" stop-color="#081224"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c7a8ff" stop-opacity=".25"/><stop offset="1" stop-color="#77ddd2" stop-opacity=".05"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".28"/></filter>
    <style>.eyebrow{font:800 17px Inter,system-ui,sans-serif;letter-spacing:2.3px;fill:#77ddd2}.title{font:700 49px Georgia,serif;fill:#f2c96f}.sub{font:400 21px Inter,system-ui,sans-serif;fill:#d9d4e5}.step{font:800 15px Inter,system-ui,sans-serif;letter-spacing:1.4px;fill:#c7a8ff}.head{font:700 27px Georgia,serif;fill:#fff5e4}.body{font:400 18px Inter,system-ui,sans-serif;fill:#d9d4e5}.small{font:400 16px Inter,system-ui,sans-serif;fill:#b9b4c8}.num{font:800 20px Inter,system-ui,sans-serif;fill:#091427}.pill{font:800 16px Inter,system-ui,sans-serif;fill:#101f3c}.foot{font:700 19px Inter,system-ui,sans-serif;fill:#fff5e4}</style>
  </defs>
  <rect width="900" height="1450" rx="38" fill="url(#bg)"/><circle cx="770" cy="130" r="110" fill="#c7a8ff" opacity=".07"/><circle cx="106" cy="1325" r="130" fill="#77ddd2" opacity=".06"/>
  <text x="68" y="74" class="eyebrow">THE REAL FLUTTER COUNTERS</text><text x="68" y="132" class="title">A month of care,</text><text x="68" y="190" class="title">without a score</text><text x="68" y="235" class="sub">Warm labels sit on top of specific saved events.</text>
  <g filter="url(#shadow)"><rect x="68" y="288" width="764" height="174" rx="27" fill="#152848" stroke="#f2c96f" stroke-opacity=".7"/><circle cx="126" cy="345" r="28" fill="#f2c96f"/><text x="126" y="352" text-anchor="middle" class="num">1</text><text x="172" y="334" class="step">DISPLAY GATE</text><text x="172" y="372" class="head">Rolling 30 days—not a calendar month</text><text x="172" y="409" class="body">At least 14 non-empty days + 20 feeds/naps combined</text><text x="172" y="439" class="small">Below either threshold, the card stays quiet.</text></g>
  <path d="M450 462v46" stroke="#7b7390" stroke-width="4"/><path d="M438 496l12 14 12-14" fill="none" stroke="#7b7390" stroke-width="4"/>
  <g filter="url(#shadow)"><rect x="68" y="516" width="764" height="150" rx="25" fill="#142440"/><circle cx="126" cy="569" r="27" fill="#77ddd2"/><text x="126" y="576" text-anchor="middle" class="num">🍼</text><text x="172" y="558" class="step">FEEDS GIVEN</text><text x="172" y="596" class="head">Every entry whose type is “feed”</text><text x="172" y="632" class="body">The counter does not measure effort, volume or who fed.</text></g>
  <g filter="url(#shadow)"><rect x="68" y="690" width="764" height="150" rx="25" fill="#142440"/><circle cx="126" cy="743" r="27" fill="#c7a8ff"/><text x="126" y="750" text-anchor="middle" class="num">☁</text><text x="172" y="732" class="step">SLEEP SUPPORTED</text><text x="172" y="770" class="head">Net nap + night-sleep minutes, rounded</text><text x="172" y="806" class="body">Overlaps merge; timed wakes can be deducted.</text></g>
  <g filter="url(#shadow)"><rect x="68" y="864" width="764" height="150" rx="25" fill="#142440"/><circle cx="126" cy="917" r="27" fill="#f2c96f"/><text x="126" y="924" text-anchor="middle" class="num">☾</text><text x="172" y="906" class="step">NAPS HELD</text><text x="172" y="944" class="head">Completed logged naps of at least 5 minutes</text><text x="172" y="980" class="body">It does not know whether a nap was actually held.</text></g>
  <g filter="url(#shadow)"><rect x="68" y="1038" width="764" height="150" rx="25" fill="#142440"/><circle cx="126" cy="1091" r="27" fill="#ff9b8b"/><text x="126" y="1098" text-anchor="middle" class="num">♡</text><text x="172" y="1080" class="step">WAKES SOOTHED</text><text x="172" y="1118" class="head">Deduplicated night wakes and wake-like feeds</text><text x="172" y="1154" class="body">A counted wake is not proof of who soothed or how.</text></g>
  <g filter="url(#shadow)"><rect x="68" y="1212" width="764" height="150" rx="25" fill="#142440"/><circle cx="126" cy="1265" r="27" fill="#8fc8ff"/><text x="126" y="1272" text-anchor="middle" class="num">●</text><text x="172" y="1254" class="step">NAPPIES CHANGED</text><text x="172" y="1292" class="head">Every saved nappy/poop-type entry</text><text x="172" y="1328" class="body">The number reflects the shared baby log, not one carer.</text></g>
  <rect x="125" y="1382" width="650" height="44" rx="22" fill="url(#glow)" stroke="#77ddd2" stroke-opacity=".5"/><text x="450" y="1411" text-anchor="middle" class="foot">Shown at most once per calendar month, per baby.</text>
</svg>
