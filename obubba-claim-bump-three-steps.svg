<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1200" role="img" aria-labelledby="title desc">
  <title id="title">How to begin OBubba during pregnancy</title>
  <desc id="desc">A vertical guide showing three pregnancy setup choices: a bump name, an estimated due date and a changeable storybook companion. These create one pregnancy profile that becomes the newborn tracker after birth.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8f2"/>
      <stop offset="0.48" stop-color="#f5edff"/>
      <stop offset="1" stop-color="#edf6ff"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e39a82"/>
      <stop offset="0.55" stop-color="#a67acb"/>
      <stop offset="1" stop-color="#7598c5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#3a2f52" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="780" height="1200" rx="40" fill="url(#background)"/>
  <circle cx="720" cy="90" r="135" fill="#ead8f7" opacity="0.56"/>
  <circle cx="55" cy="1120" r="155" fill="#dcecff" opacity="0.66"/>

  <text x="390" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#806c94">ABOUT A MINUTE · THREE LITTLE WISHES</text>
  <text x="390" y="126" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#30283d">Start with the story, not a form</text>
  <text x="390" y="163" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#625a6b">Only two details are required to begin.</text>

  <path d="M110 245v620" stroke="url(#line)" stroke-width="7" stroke-linecap="round" opacity="0.7"/>

  <g filter="url(#shadow)">
    <rect x="65" y="210" width="650" height="205" rx="30" fill="#ffffff"/>
  </g>
  <circle cx="110" cy="275" r="35" fill="#fff0e8" stroke="#df9b83" stroke-width="3"/>
  <text x="110" y="285" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#c8755d">1</text>
  <text x="175" y="263" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#a86654">A NAME FOR THE BUMP</text>
  <text x="175" y="306" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#30283d">Pip, Bean—or a chosen name</text>
  <text x="175" y="348" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#625a6b">This is the warm label shown through pregnancy.</text>
  <rect x="175" y="367" width="255" height="28" rx="14" fill="#fff3ed"/>
  <text x="302" y="387" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#9b6251">REQUIRED · CHANGEABLE LATER</text>

  <g filter="url(#shadow)">
    <rect x="65" y="460" width="650" height="220" rx="30" fill="#ffffff"/>
  </g>
  <circle cx="110" cy="525" r="35" fill="#f1e8fb" stroke="#ae80d0" stroke-width="3"/>
  <text x="110" y="535" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#8d5fb0">2</text>
  <text x="175" y="513" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#86659d">ESTIMATED DUE DATE</text>
  <text x="175" y="556" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#30283d">One date opens the right chapter</text>
  <text x="175" y="598" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#625a6b">It drives week, countdown and journey progress.</text>
  <text x="175" y="629" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#766c7e">Your maternity record remains the clinical source.</text>
  <rect x="175" y="646" width="227" height="28" rx="14" fill="#f4ecfb"/>
  <text x="288" y="666" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#77538f">REQUIRED · ESTIMATE IS FINE</text>

  <g filter="url(#shadow)">
    <rect x="65" y="725" width="650" height="220" rx="30" fill="#ffffff"/>
  </g>
  <circle cx="110" cy="790" r="35" fill="#eaf3ff" stroke="#86a8d2" stroke-width="3"/>
  <text x="110" y="800" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#6589b7">3</text>
  <text x="175" y="778" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#6682a4">YOUR STORYBOOK BABY</text>
  <text x="175" y="821" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#30283d">Choose—or keep the default</text>
  <text x="175" y="863" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#625a6b">A hand-painted companion for the weekly journey.</text>
  <text x="175" y="894" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#766c7e">It is imagination, never an appearance prediction.</text>
  <rect x="175" y="911" width="264" height="28" rx="14" fill="#edf5ff"/>
  <text x="307" y="931" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#58779d">OPTIONAL CHOICE · CHANGE ANY TIME</text>

  <path d="M390 971v56" stroke="url(#line)" stroke-width="7" stroke-linecap="round"/>
  <path d="M376 1016l14 17 14-17" fill="none" stroke="#7f7db5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="105" y="1050" width="570" height="105" rx="52" fill="#30283d"/>
  </g>
  <text x="390" y="1092" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5" fill="#f4d8ad">ONE CHILD PROFILE</text>
  <text x="390" y="1127" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#ffffff">Pregnancy journey → newborn tracker</text>
</svg>
