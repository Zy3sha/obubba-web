<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba builds Tonight for Maya</title>
  <desc id="desc">A two-lane diagram. Live tonight guidance, logged bedtime and one active plan step feed tonight's calm path. Two seven-day windows feed weekly wins, an assessment, observations and one gentle experiment. Missing-data gates stop unsupported conclusions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111425"/>
      <stop offset="0.58" stop-color="#211936"/>
      <stop offset="1" stop-color="#372348"/>
    </linearGradient>
    <linearGradient id="live" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7469d8"/>
      <stop offset="1" stop-color="#9b72cf"/>
    </linearGradient>
    <linearGradient id="week" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c1856f"/>
      <stop offset="1" stop-color="#d4a06d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#080910" flood-opacity=".34"/>
    </filter>
    <marker id="arrowV" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#a9a0fa"/>
    </marker>
    <marker id="arrowG" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#e1b37a"/>
    </marker>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,serif}.caps{font:700 18px Inter,Arial,sans-serif;letter-spacing:3px}.h1{font:700 55px Georgia,serif}.h2{font:700 29px Georgia,serif}.body{font:400 19px Inter,Arial,sans-serif}.small{font:600 16px Inter,Arial,sans-serif}.muted{fill:#c9c4d4}.white{fill:#fffaf5}.line{stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1440" height="940" rx="40" fill="url(#bg)"/>
  <circle cx="1260" cy="112" r="230" fill="#7664d0" opacity=".1"/>
  <circle cx="160" cy="870" r="280" fill="#d49a69" opacity=".08"/>

  <text x="720" y="82" text-anchor="middle" class="caps" fill="#d9b883">INSIDE THE FLUTTER SLEEP STORY</text>
  <text x="720" y="145" text-anchor="middle" class="h1 white">How “Tonight for Maya” is built</text>
  <text x="720" y="186" text-anchor="middle" class="body muted">One live path for this evening. One evidence layer for the week.</text>

  <rect x="70" y="232" width="630" height="620" rx="30" fill="#191a2b" stroke="#7e72d7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="740" y="232" width="630" height="620" rx="30" fill="#211b2a" stroke="#bd856b" stroke-width="2" filter="url(#shadow)"/>

  <circle cx="118" cy="286" r="22" fill="url(#live)"/>
  <path d="M108 282a12 12 0 1 0 15-15 16 16 0 1 1-15 15Z" fill="#fff6db"/>
  <text x="156" y="279" class="caps" fill="#afa7ff">LIVE TONIGHT</text>
  <text x="156" y="316" class="h2 white">What changes now</text>

  <rect x="108" y="350" width="250" height="112" rx="18" fill="#292b48"/>
  <text x="132" y="384" class="small" fill="#d5d0ff">TONIGHT’S GUIDANCE</text>
  <text x="132" y="417" class="body white">Bedtime, wakes,</text>
  <text x="132" y="444" class="body white">rhythm + disruptions</text>

  <rect x="410" y="350" width="250" height="112" rx="18" fill="#292b48"/>
  <text x="434" y="384" class="small" fill="#d5d0ff">CURRENT STATE</text>
  <text x="434" y="417" class="body white">Logged bedtime</text>
  <text x="434" y="444" class="body white">+ one plan step</text>

  <path d="M233 474V527H374" fill="none" stroke="#a9a0fa" stroke-width="4" class="line" marker-end="url(#arrowV)"/>
  <path d="M535 474V527H395" fill="none" stroke="#a9a0fa" stroke-width="4" class="line"/>
  <rect x="148" y="550" width="474" height="176" rx="24" fill="url(#live)"/>
  <text x="385" y="590" text-anchor="middle" class="caps" fill="#ece9ff">TONIGHT, MADE GENTLER</text>
  <text x="385" y="642" text-anchor="middle" class="h2 white">Your calm path into bedtime</text>
  <text x="385" y="685" text-anchor="middle" class="body" fill="#f4f0ff">Notice  →  Wind down  →  Settle</text>
  <text x="385" y="768" text-anchor="middle" class="small muted">One authoritative bedtime; no stale duplicate</text>

  <circle cx="788" cy="286" r="22" fill="url(#week)"/>
  <path d="M776 286h24M788 274v24" stroke="#fff4de" stroke-width="3" class="line"/>
  <text x="826" y="279" class="caps" fill="#efbd84">WEEKLY EVIDENCE</text>
  <text x="826" y="316" class="h2 white">What the pattern supports</text>

  <rect x="778" y="350" width="250" height="112" rx="18" fill="#392c32"/>
  <text x="802" y="384" class="small" fill="#f0c79b">RECENT 7 DAYS</text>
  <text x="802" y="417" class="body white">Logged nights, naps,</text>
  <text x="802" y="444" class="body white">bedtime + mornings</text>

  <rect x="1080" y="350" width="250" height="112" rx="18" fill="#392c32"/>
  <text x="1104" y="384" class="small" fill="#f0c79b">PREVIOUS 7 DAYS</text>
  <text x="1104" y="417" class="body white">A comparison—not</text>
  <text x="1104" y="444" class="body white">one rough night</text>

  <path d="M903 474V510H1045" fill="none" stroke="#e1b37a" stroke-width="4" class="line" marker-end="url(#arrowG)"/>
  <path d="M1205 474V510H1060" fill="none" stroke="#e1b37a" stroke-width="4" class="line"/>

  <rect x="778" y="538" width="552" height="188" rx="24" fill="#30252f" stroke="#7a6264"/>
  <text x="816" y="578" class="small" fill="#f1c291">ONLY WHEN COVERAGE PASSES</text>
  <text x="816" y="620" class="body white">• Up to two “little lights” or wins</text>
  <text x="816" y="657" class="body white">• One week-in-a-sentence assessment</text>
  <text x="816" y="694" class="body white">• Observations + up to three experiments</text>

  <rect x="804" y="752" width="500" height="66" rx="33" fill="#151620" stroke="#d3a66e" stroke-width="2"/>
  <path d="M841 782v-8a11 11 0 0 1 22 0v8M837 782h30v22h-30Z" fill="none" stroke="#e6ba7f" stroke-width="3" class="line"/>
  <text x="888" y="793" class="small white">Missing data? “Still learning.” No invented zeros.</text>

  <text x="720" y="899" text-anchor="middle" class="body" fill="#d7d1df">A personalised story explains a record. It cannot diagnose why a baby woke or whether a feed is needed.</text>
</svg>
