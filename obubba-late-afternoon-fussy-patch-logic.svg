<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1320" viewBox="0 0 760 1320" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba detects a repeated late-afternoon fussy patch</title>
  <desc id="desc">A seven-day decision flow showing eligible 3pm to 7pm crying and fussy nap-wake records, four evidence gates, median onset calculation and the two age-specific guidance branches.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff8f0"/><stop offset=".55" stop-color="#f7eee9"/><stop offset="1" stop-color="#edf1f6"/></linearGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e39178"/><stop offset=".5" stop-color="#c97c82"/><stop offset="1" stop-color="#68759a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3a2e35" flood-opacity=".1"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#74666a"/></marker>
    <style>
      .eyebrow{font:700 18px Arial,sans-serif;letter-spacing:2px;fill:#a44f61}.h1{font:700 35px Arial,sans-serif;fill:#342b32}.sub{font:400 18px Arial,sans-serif;fill:#695e64}.card{fill:#fff;stroke:#ead9d5;stroke-width:2;filter:url(#shadow)}.step{font:700 22px Arial,sans-serif;fill:#342b32}.body{font:400 17px Arial,sans-serif;fill:#685e63}.small{font:400 15px Arial,sans-serif;fill:#796d72}.mini{font:700 14px Arial,sans-serif;fill:#fff}.gate{font:700 16px Arial,sans-serif;fill:#493d43}.line{stroke:#74666a;stroke-width:3;fill:none;marker-end:url(#arrow)}.young{fill:#fff0e7;stroke:#df9476;stroke-width:2}.older{fill:#eef1fa;stroke:#8e99bb;stroke-width:2}.safety{fill:#fff;stroke:#c86469;stroke-width:2}
    </style>
  </defs>
  <rect width="760" height="1320" rx="34" fill="url(#sky)"/>
  <rect x="0" y="0" width="760" height="12" rx="6" fill="url(#dusk)"/>
  <text x="54" y="56" class="eyebrow">THE FLUTTER DECISION</text>
  <text x="54" y="98" class="h1">When does a fussy patch</text>
  <text x="54" y="134" class="h1">become a pattern?</text>
  <text x="54" y="166" class="sub">Seven days of supported records—not one difficult evening.</text>

  <rect x="54" y="188" width="652" height="152" rx="24" class="card"/>
  <circle cx="102" cy="236" r="26" fill="#d98773"/><text x="97" y="242" class="mini">1</text>
  <text x="145" y="230" class="step">Scan today + 6 earlier days</text>
  <text x="145" y="260" class="body">Keep events from 3:00pm through 7:00pm.</text>
  <rect x="145" y="282" width="190" height="36" rx="18" fill="#f7e4df"/><text x="164" y="305" class="gate">Crying event</text>
  <rect x="350" y="282" width="286" height="36" rx="18" fill="#eeeaf4"/><text x="371" y="305" class="gate">Nap/Wake ended Fussy</text>
  <path d="M380 340V386" class="line"/>

  <rect x="54" y="390" width="652" height="178" rx="24" class="card"/>
  <circle cx="102" cy="438" r="26" fill="#d3a14e"/><text x="97" y="444" class="mini">2</text>
  <text x="145" y="432" class="step">Clear all four evidence gates</text>
  <rect x="91" y="468" width="270" height="36" rx="18" fill="#fbf3df"/><text x="112" y="491" class="gate">≥4 days with any log</text>
  <rect x="399" y="468" width="270" height="36" rx="18" fill="#fbf3df"/><text x="419" y="491" class="gate">≥3 qualifying days</text>
  <rect x="91" y="516" width="270" height="36" rx="18" fill="#fbf3df"/><text x="116" y="539" class="gate">≥4 events in total</text>
  <rect x="399" y="516" width="270" height="36" rx="18" fill="#fbf3df"/><text x="414" y="539" class="gate">Strictly &gt;½ logged days</text>
  <path d="M380 568V614" class="line"/>

  <rect x="54" y="618" width="652" height="142" rx="24" class="card"/>
  <circle cx="102" cy="666" r="26" fill="#b97986"/><text x="97" y="672" class="mini">3</text>
  <text x="145" y="660" class="step">Estimate when the patch begins</text>
  <text x="145" y="690" class="body">Take each qualifying day’s earliest event.</text>
  <text x="145" y="720" class="body">Sort those times and choose the median onset.</text>
  <text x="145" y="746" class="small">This is not duration, peak intensity or an average cry time.</text>
  <path d="M380 760V806" class="line"/>

  <rect x="154" y="810" width="452" height="96" rx="24" class="card"/>
  <text x="228" y="850" class="step">Which guidance age applies?</text>
  <text x="222" y="880" class="body">Corrected weeks are used when available.</text>
  <path d="M270 906V956H194V988" class="line"/>
  <path d="M490 906V956H566V988" class="line"/>
  <text x="172" y="948" class="eyebrow">UNDER 16 WEEKS</text>
  <text x="486" y="948" class="eyebrow">16+ WEEKS</text>

  <rect x="54" y="992" width="306" height="174" rx="24" class="young"/>
  <text x="85" y="1034" class="step">Developmental context</text>
  <text x="85" y="1068" class="body">Calm the late afternoon.</text>
  <text x="85" y="1098" class="body">Offer responsive feeds,</text>
  <text x="85" y="1128" class="body">contact and gentle soothing.</text>
  <text x="85" y="1152" class="small">Low urgency • reassurance</text>

  <rect x="400" y="992" width="306" height="174" rx="24" class="older"/>
  <text x="432" y="1034" class="step">Test tiredness upstream</text>
  <text x="432" y="1068" class="body">Protect the last nap and</text>
  <text x="432" y="1098" class="body">try bedtime 15–20 min</text>
  <text x="432" y="1128" class="body">earlier if the day fits.</text>
  <text x="432" y="1152" class="small">Low urgency • hypothesis</text>

  <rect x="54" y="1204" width="652" height="78" rx="22" class="safety"/>
  <circle cx="98" cy="1243" r="20" fill="#c86469"/><path d="M98 1229l12 5v9c0 9-5 15-12 18-7-3-12-9-12-18v-9l12-5z" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="136" y="1238" class="step">Timing pattern ≠ illness assessment</text>
  <text x="136" y="1266" class="body">An unusual cry, unwell baby or overwhelmed parent outranks the card.</text>
</svg>
