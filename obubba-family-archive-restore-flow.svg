<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba protects and restores a family's baby tracker data</title>
  <desc id="desc">A vertical flow showing an old phone, one family archive containing every baby, two private recovery routes, and a new phone that restores missing history while preserving live sharing and deletions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf5"/><stop offset="0.52" stop-color="#f3f1ff"/><stop offset="1" stop-color="#edf8f6"/></linearGradient>
    <linearGradient id="archive" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#23285b"/><stop offset="1" stop-color="#0e3d48"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#34345b" flood-opacity="0.13"/></filter>
  </defs>
  <rect width="640" height="1120" rx="40" fill="url(#bg)"/>
  <circle cx="578" cy="65" r="88" fill="#dce9ff" opacity="0.58"/>
  <circle cx="54" cy="1068" r="112" fill="#ffe4d7" opacity="0.68"/>
  <text x="42" y="58" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="2" fill="#c65f50">THE FLUTTER RECOVERY PATH</text>
  <text x="42" y="101" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#171b35">One family story. A new phone.</text>
  <text x="42" y="134" font-family="Inter,Arial,sans-serif" font-size="17" fill="#62677c">Protect first; restore without starting the timeline again.</text>

  <g filter="url(#shadow)">
    <rect x="42" y="174" width="556" height="124" rx="25" fill="#fff" stroke="#ead4cb" stroke-width="2"/>
  </g>
  <circle cx="98" cy="236" r="34" fill="#fff0e9"/><text x="98" y="248" text-anchor="middle" font-size="30">📱</text>
  <text x="148" y="218" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1.4" fill="#bd5d50">1 · ON THE OLD PHONE</text>
  <text x="148" y="251" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#20243d">Tap Protect your data</text>
  <text x="148" y="278" font-family="Inter,Arial,sans-serif" font-size="15" fill="#6b6f81">Choose a username, 4-digit PIN and optional email.</text>

  <path d="M320 298v38" stroke="#8c86a2" stroke-width="3" stroke-linecap="round"/><path d="M310 328l10 13 10-13" fill="none" stroke="#8c86a2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)"><rect x="42" y="348" width="556" height="194" rx="28" fill="url(#archive)"/></g>
  <text x="76" y="391" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.8" fill="#f2bd74">2 · ONE FAMILY ARCHIVE</text>
  <text x="76" y="431" font-family="Georgia,serif" font-size="27" font-weight="700" fill="#fff">Every current baby comes with you</text>
  <g font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#dce7ed">
    <text x="92" y="474">☾ Sleep &amp; wake history</text><text x="330" y="474">🥄 Feeds &amp; weaning</text>
    <text x="92" y="508">✦ Growth &amp; milestones</text><text x="330" y="508">♡ Plans, notes &amp; memories</text>
  </g>

  <path d="M320 542v38" stroke="#8c86a2" stroke-width="3" stroke-linecap="round"/><path d="M310 572l10 13 10-13" fill="none" stroke="#8c86a2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="320" y="614" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1.6" fill="#716a91">3 · SAVE TWO RECOVERY ROUTES</text>
  <g filter="url(#shadow)">
    <rect x="42" y="638" width="264" height="132" rx="24" fill="#fff" stroke="#dad8f1" stroke-width="2"/>
    <rect x="334" y="638" width="264" height="132" rx="24" fill="#fff" stroke="#cde4df" stroke-width="2"/>
  </g>
  <circle cx="82" cy="681" r="24" fill="#f0efff"/><text x="82" y="689" text-anchor="middle" font-size="21">●</text>
  <text x="118" y="676" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" fill="#7063ad">EVERYDAY SIGN-IN</text>
  <text x="66" y="716" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#20243d">Username + PIN</text>
  <text x="66" y="745" font-family="Inter,Arial,sans-serif" font-size="14" fill="#6b6f81">PIN stored as a hash</text>
  <circle cx="374" cy="681" r="24" fill="#eaf7f4"/><text x="374" y="689" text-anchor="middle" font-size="21">✦</text>
  <text x="410" y="676" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" fill="#347f74">KEEP SOMEWHERE SAFE</text>
  <text x="358" y="716" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800" fill="#20243d">BK recovery code</text>
  <text x="358" y="745" font-family="Inter,Arial,sans-serif" font-size="14" fill="#6b6f81">12 characters; treat as a password</text>

  <path d="M320 770v38" stroke="#8c86a2" stroke-width="3" stroke-linecap="round"/><path d="M310 800l10 13 10-13" fill="none" stroke="#8c86a2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)"><rect x="42" y="822" width="556" height="126" rx="25" fill="#fff" stroke="#d2e4e0" stroke-width="2"/></g>
  <circle cx="98" cy="885" r="34" fill="#eaf7f4"/><text x="98" y="897" text-anchor="middle" font-size="30">📲</text>
  <text x="148" y="866" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="1.4" fill="#347f74">4 · ON THE NEW PHONE</text>
  <text x="148" y="900" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="800" fill="#20243d">Sign in—or enter the BK code</text>
  <text x="148" y="927" font-family="Inter,Arial,sans-serif" font-size="15" fill="#6b6f81">OBubba loads every restorable child in the family.</text>

  <g font-family="Inter,Arial,sans-serif">
    <text x="42" y="994" font-size="14" font-weight="800" letter-spacing="1.6" fill="#c65f50">RESTORE GUARDRAILS</text>
    <text x="42" y="1026" font-size="15" font-weight="700" fill="#3f465d">✓ Missing history is added; existing local history is not erased</text>
    <text x="42" y="1055" font-size="15" font-weight="700" fill="#3f465d">✓ Siblings and live partner links are preserved where possible</text>
    <text x="42" y="1084" font-size="15" font-weight="700" fill="#3f465d">✓ Deletion markers help stop removed entries returning</text>
  </g>
</svg>
