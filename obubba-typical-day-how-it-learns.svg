<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba builds a baby's typical day from recent logs</title>
  <desc id="desc">The app looks across fourteen recent calendar days, keeps days with logs, averages available wake and bedtime values, selects the most common nap count and averages each nap position. It then shows an approximate descriptive rhythm, not a target schedule.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071a36"/>
      <stop offset="1" stop-color="#18295a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#16345e"/>
      <stop offset="1" stop-color="#102644"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f2b09f"/>
      <stop offset=".5" stop-color="#d0a3db"/>
      <stop offset="1" stop-color="#efd083"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020b18" flood-opacity=".45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#e9c77c"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="42" fill="url(#bg)"/>
  <g opacity=".28" fill="#f4d688">
    <circle cx="67" cy="80" r="3"/><circle cx="1101" cy="104" r="3"/><circle cx="1140" cy="586" r="2"/><circle cx="86" cy="661" r="2"/><circle cx="750" cy="98" r="2"/>
  </g>
  <text x="600" y="70" text-anchor="middle" fill="#fff0d7" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="800">How a “typical day” is learned</text>
  <text x="600" y="108" text-anchor="middle" fill="#b9cbe0" font-family="Inter,Arial,sans-serif" font-size="19">Recent observations become a calm summary—not a command for today.</text>

  <g transform="translate(68 157)" filter="url(#shadow)">
    <rect width="286" height="393" rx="28" fill="url(#card)" stroke="#5b7397"/>
    <text x="26" y="42" fill="#f7e7cb" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800">1 · Look back 14 days</text>
    <text x="26" y="70" fill="#aebfd6" font-family="Inter,Arial,sans-serif" font-size="15">Empty calendar days are skipped.</text>
    <g transform="translate(25 99)">
      <g fill="#203f6a" stroke="#6680a3">
        <rect x="0" y="0" width="42" height="42" rx="10"/><rect x="50" y="0" width="42" height="42" rx="10"/><rect x="100" y="0" width="42" height="42" rx="10"/><rect x="150" y="0" width="42" height="42" rx="10"/><rect x="200" y="0" width="42" height="42" rx="10"/>
        <rect x="0" y="50" width="42" height="42" rx="10"/><rect x="50" y="50" width="42" height="42" rx="10"/><rect x="100" y="50" width="42" height="42" rx="10"/><rect x="150" y="50" width="42" height="42" rx="10"/><rect x="200" y="50" width="42" height="42" rx="10"/>
        <rect x="0" y="100" width="42" height="42" rx="10"/><rect x="50" y="100" width="42" height="42" rx="10"/><rect x="100" y="100" width="42" height="42" rx="10"/><rect x="150" y="100" width="42" height="42" rx="10"/>
      </g>
      <g fill="#e6be73">
        <circle cx="21" cy="21" r="6"/><circle cx="71" cy="21" r="6"/><circle cx="121" cy="21" r="6"/><circle cx="221" cy="21" r="6"/>
        <circle cx="21" cy="71" r="6"/><circle cx="71" cy="71" r="6"/><circle cx="121" cy="71" r="6"/><circle cx="171" cy="71" r="6"/><circle cx="221" cy="71" r="6"/>
        <circle cx="21" cy="121" r="6"/><circle cx="121" cy="121" r="6"/><circle cx="171" cy="121" r="6"/><circle cx="221" cy="121" r="6"/>
      </g>
      <g stroke="#8da2bd" stroke-width="3" opacity=".5">
        <path d="M158 13l26 26M184 13l-26 26"/><path d="M58 113l26 26M84 113l-26 26"/>
      </g>
    </g>
    <text x="26" y="279" fill="#f6d896" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="750">● day with at least one log</text>
    <text x="26" y="310" fill="#aebfd6" font-family="Inter,Arial,sans-serif" font-size="15">Wake, bedtime and nap evidence</text>
    <text x="26" y="332" fill="#aebfd6" font-family="Inter,Arial,sans-serif" font-size="15">may still be missing within a kept day.</text>
    <rect x="25" y="352" width="236" height="24" rx="12" fill="#0c203d"/>
    <text x="143" y="369" text-anchor="middle" fill="#c8d7e8" font-family="Inter,Arial,sans-serif" font-size="12">No invented entries for blank days</text>
  </g>

  <path d="M370 352H420" stroke="#e9c77c" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(438 157)" filter="url(#shadow)">
    <rect width="326" height="393" rx="28" fill="url(#card)" stroke="#745f8f"/>
    <text x="26" y="42" fill="#f7e7cb" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800">2 · Find the pattern</text>
    <g transform="translate(26 79)">
      <rect width="274" height="79" rx="18" fill="#0d2444" stroke="#3f5c81"/>
      <circle cx="30" cy="28" r="14" fill="#f3bd72"/><text x="30" y="34" text-anchor="middle" font-size="17">☀</text>
      <text x="55" y="29" fill="#f6e8d1" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="750">Wake + bedtime</text>
      <text x="55" y="55" fill="#afc2da" font-family="Inter,Arial,sans-serif" font-size="14">Average the available clock times</text>
    </g>
    <g transform="translate(26 174)">
      <rect width="274" height="79" rx="18" fill="#0d2444" stroke="#3f5c81"/>
      <circle cx="30" cy="28" r="14" fill="#baa0db"/><text x="30" y="34" text-anchor="middle" font-size="16">☾</text>
      <text x="55" y="29" fill="#f6e8d1" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="750">Nap count</text>
      <text x="55" y="55" fill="#afc2da" font-family="Inter,Arial,sans-serif" font-size="14">Choose the most common count</text>
    </g>
    <g transform="translate(26 269)">
      <rect width="274" height="79" rx="18" fill="#0d2444" stroke="#3f5c81"/>
      <circle cx="30" cy="28" r="14" fill="#f0aa9d"/><text x="30" y="34" text-anchor="middle" font-size="16">≈</text>
      <text x="55" y="29" fill="#f6e8d1" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="750">Each nap position</text>
      <text x="55" y="55" fill="#afc2da" font-family="Inter,Arial,sans-serif" font-size="14">Average start time + duration</text>
    </g>
    <text x="163" y="378" text-anchor="middle" fill="#d9b8e8" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700">A 2↔3 nap tie chooses the fuller day</text>
  </g>

  <path d="M780 352H830" stroke="#e9c77c" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(848 157)" filter="url(#shadow)">
    <rect width="284" height="393" rx="28" fill="#0c2342" stroke="url(#accent)" stroke-width="2"/>
    <text x="24" y="42" fill="#f7e7cb" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="800">3 · Show the rhythm</text>
    <text x="24" y="69" fill="#aebfd6" font-family="Inter,Arial,sans-serif" font-size="14">Oliver’s typical day · 14 days</text>
    <g font-family="Inter,Arial,sans-serif" font-size="15">
      <line x1="24" y1="111" x2="260" y2="111" stroke="#385476"/>
      <text x="26" y="101" fill="#f6e6cc">☀  Wake</text><text x="256" y="101" text-anchor="end" fill="#efd083" font-weight="800">~6:50am</text>
      <line x1="24" y1="162" x2="260" y2="162" stroke="#385476"/>
      <text x="26" y="151" fill="#f6e6cc">☾  Nap 1</text><text x="256" y="151" text-anchor="end" fill="#efd083" font-weight="800">~9:01 · 1h 5m</text>
      <line x1="24" y1="213" x2="260" y2="213" stroke="#385476"/>
      <text x="26" y="202" fill="#f6e6cc">☾  Nap 2</text><text x="256" y="202" text-anchor="end" fill="#efd083" font-weight="800">~12:40 · 1h 15m</text>
      <line x1="24" y1="264" x2="260" y2="264" stroke="#385476"/>
      <text x="26" y="253" fill="#f6e6cc">☾  Nap 3</text><text x="256" y="253" text-anchor="end" fill="#efd083" font-weight="800">~4:00 · 40m</text>
      <line x1="24" y1="315" x2="260" y2="315" stroke="#385476"/>
      <text x="26" y="304" fill="#f6e6cc">●  Bedtime</text><text x="256" y="304" text-anchor="end" fill="#efd083" font-weight="800">~7:45pm</text>
    </g>
    <rect x="24" y="338" width="236" height="34" rx="17" fill="url(#accent)" opacity=".92"/>
    <text x="142" y="360" text-anchor="middle" fill="#17223c" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="850">≈ means approximate</text>
  </g>

  <g transform="translate(116 609)">
    <rect width="968" height="91" rx="28" fill="#0a203e" stroke="#4c6487"/>
    <rect x="25" y="24" width="270" height="43" rx="21" fill="#203b62"/><text x="160" y="51" text-anchor="middle" fill="#fff0d8" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="750">✓ Describes recent history</text>
    <rect x="349" y="24" width="270" height="43" rx="21" fill="#203b62"/><text x="484" y="51" text-anchor="middle" fill="#fff0d8" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="750">✓ Changes as logs change</text>
    <rect x="673" y="24" width="270" height="43" rx="21" fill="#4b2948"/><text x="808" y="51" text-anchor="middle" fill="#ffd9df" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="750">× Not today’s instruction</text>
  </g>
</svg>
