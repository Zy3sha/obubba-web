<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 780" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba decides whether warm-room nights are linked with more wakes</title>
  <desc id="desc">The example compares three warm nights averaging 3.3 wakes with four cooler or comfortable nights averaging 1.3 wakes. The two-wake difference clears the half-wake threshold, so the insight can appear.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F4F0"/>
      <stop offset="1" stop-color="#EDF5F4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#32433F" flood-opacity=".12"/>
    </filter>
    <style>
      .eyebrow{font:700 14px Arial,sans-serif;letter-spacing:2px;fill:#836E5F}
      .heading{font:700 29px Georgia,serif;fill:#263D39}
      .body{font:400 17px Arial,sans-serif;fill:#485A55}
      .small{font:400 14px Arial,sans-serif;fill:#5C6E69}
      .label{font:700 15px Arial,sans-serif;fill:#263D39}
      .value{font:700 26px Georgia,serif;fill:#263D39}
    </style>
  </defs>
  <rect width="640" height="780" rx="30" fill="url(#bg)"/>
  <text x="48" y="54" class="eyebrow">OBUBBA’S LAST-14-DAYS CHECK</text>
  <text x="48" y="94" class="heading">Is warmth tracking with more wakes?</text>

  <g filter="url(#shadow)">
    <rect x="48" y="128" width="252" height="332" rx="24" fill="#FFF8F4"/>
    <rect x="340" y="128" width="252" height="332" rx="24" fill="#F6FBFA"/>
  </g>
  <circle cx="88" cy="169" r="18" fill="#E89470"/>
  <path d="M88 155v18m-7 4a10 10 0 1 0 14 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="116" y="174" class="label">Warm nights</text>
  <text x="76" y="213" class="small">Night 1</text><rect x="145" y="196" width="112" height="22" rx="11" fill="#E89470"/><text x="265" y="213" class="label">3</text>
  <text x="76" y="255" class="small">Night 2</text><rect x="145" y="238" width="136" height="22" rx="11" fill="#E89470"/><text x="289" y="255" class="label">4</text>
  <text x="76" y="297" class="small">Night 3</text><rect x="145" y="280" width="112" height="22" rx="11" fill="#E89470"/><text x="265" y="297" class="label">3</text>
  <line x1="76" y1="330" x2="272" y2="330" stroke="#E6D6CF" stroke-width="2"/>
  <text x="76" y="363" class="small">Average</text>
  <text x="76" y="401" class="value">3.3 wakes</text>
  <text x="76" y="432" class="small">Minimum sample: 3 nights</text>

  <circle cx="380" cy="169" r="18" fill="#79C8BE"/>
  <path d="M369 169h22" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="408" y="166" class="label">Cool or</text>
  <text x="408" y="184" class="label">just right</text>
  <text x="368" y="213" class="small">N1</text><rect x="404" y="196" width="42" height="22" rx="11" fill="#79C8BE"/><text x="456" y="213" class="label">1</text>
  <text x="368" y="255" class="small">N2</text><rect x="404" y="238" width="42" height="22" rx="11" fill="#79C8BE"/><text x="456" y="255" class="label">1</text>
  <text x="368" y="297" class="small">N3</text><rect x="404" y="280" width="76" height="22" rx="11" fill="#79C8BE"/><text x="490" y="297" class="label">2</text>
  <text x="368" y="329" class="small">N4</text><rect x="404" y="312" width="42" height="22" rx="11" fill="#79C8BE"/><text x="456" y="329" class="label">1</text>
  <line x1="368" y1="352" x2="564" y2="352" stroke="#D5E5E2" stroke-width="2"/>
  <text x="368" y="382" class="small">Average</text>
  <text x="368" y="416" class="value">1.3 wakes</text>
  <text x="368" y="444" class="small">Minimum sample: 4 nights</text>

  <g filter="url(#shadow)">
    <rect x="48" y="500" width="544" height="132" rx="24" fill="#263D39"/>
  </g>
  <text x="76" y="539" class="eyebrow" fill="#BFE6DF">THE DIFFERENCE</text>
  <text x="76" y="581" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#FFF">+2.0 wakes on warm nights</text>
  <text x="76" y="610" font-family="Arial,sans-serif" font-size="15" fill="#D9E8E5">Clears OBubba’s +0.5-wake display threshold</text>

  <rect x="48" y="665" width="544" height="74" rx="20" fill="#F3E3DA"/>
  <circle cx="80" cy="702" r="7" fill="#D87C58"/>
  <text x="100" y="694" class="label">A clue—not proof of cause</text>
  <text x="100" y="718" class="small">Use a room thermometer and change one thing safely.</text>
</svg>
