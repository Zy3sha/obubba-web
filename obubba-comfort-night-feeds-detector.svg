<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba decides when to show Comfort feeds, not hunger</title>
  <desc id="desc">The app checks age, night-feed frequency and measured bottle volume, while hunger tags, illness and stronger night patterns can override the comfort-feed interpretation. The card is not permission to night-wean.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf4ec"/>
      <stop offset="1" stop-color="#eee8f2"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26324c"/>
      <stop offset="1" stop-color="#4d476a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#45394d" flood-opacity=".11"/>
    </filter>
  </defs>
  <rect width="720" height="1080" rx="34" fill="url(#bg)"/>
  <circle cx="642" cy="88" r="75" fill="#d9c5dc" opacity=".46"/>
  <circle cx="74" cy="1007" r="105" fill="#cbdacb" opacity=".54"/>

  <text x="54" y="72" fill="#a55442" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">READ THE CARD AS A QUESTION</text>
  <text x="54" y="124" fill="#2e2b3a" font-family="Georgia, serif" font-size="39" font-weight="700">Small measured feeds are a clue.</text>
  <text x="54" y="168" fill="#2e2b3a" font-family="Georgia, serif" font-size="39" font-weight="700">Not a hunger test.</text>
  <text x="54" y="207" fill="#665f6d" font-family="Arial, sans-serif" font-size="18">The current Flutter classifier needs every gate below.</text>

  <g filter="url(#shadow)">
    <rect x="42" y="244" width="636" height="125" rx="24" fill="#fffdf9"/>
    <circle cx="91" cy="296" r="27" fill="#e7d7c0"/>
    <text x="91" y="303" text-anchor="middle" fill="#905b49" font-family="Arial, sans-serif" font-size="20" font-weight="700">1</text>
    <text x="134" y="287" fill="#302e3b" font-family="Arial, sans-serif" font-size="23" font-weight="700">Older than the newborn gate</text>
    <text x="134" y="321" fill="#68616e" font-family="Arial, sans-serif" font-size="17">16+ weeks. Younger babies get “Normal newborn sleep”.</text>
    <rect x="134" y="340" width="490" height="7" rx="4" fill="#e9dfd5"/>
    <rect x="134" y="340" width="220" height="7" rx="4" fill="#c97b67"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="42" y="392" width="636" height="146" rx="24" fill="#fffdf9"/>
    <circle cx="91" cy="444" r="27" fill="#d7e3d4"/>
    <text x="91" y="451" text-anchor="middle" fill="#4c705a" font-family="Arial, sans-serif" font-size="20" font-weight="700">2</text>
    <text x="134" y="435" fill="#302e3b" font-family="Arial, sans-serif" font-size="23" font-weight="700">Feeding travelled with the wakes</text>
    <text x="134" y="468" fill="#68616e" font-family="Arial, sans-serif" font-size="17">At least 2 night feeds, and feeds ≥ wake count minus 1.</text>
    <g transform="translate(134 490)">
      <circle cx="15" cy="13" r="12" fill="#7a82a6"/><path d="M9 13h12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <path d="M45 13h45" stroke="#c6b9ca" stroke-width="4" stroke-linecap="round" stroke-dasharray="5 7"/>
      <rect x="103" y="1" width="20" height="25" rx="6" fill="#d48c75"/>
      <circle cx="157" cy="13" r="12" fill="#7a82a6"/><path d="M151 13h12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <path d="M187 13h45" stroke="#c6b9ca" stroke-width="4" stroke-linecap="round" stroke-dasharray="5 7"/>
      <rect x="245" y="1" width="20" height="25" rx="6" fill="#d48c75"/>
      <circle cx="299" cy="13" r="12" fill="#7a82a6"/><path d="M293 13h12" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="335" y="19" fill="#817984" font-family="Arial, sans-serif" font-size="15">wake · feed · wake · feed</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="42" y="561" width="636" height="152" rx="24" fill="#fffdf9"/>
    <circle cx="91" cy="613" r="27" fill="#ddd3ea"/>
    <text x="91" y="620" text-anchor="middle" fill="#675380" font-family="Arial, sans-serif" font-size="20" font-weight="700">3</text>
    <text x="134" y="604" fill="#302e3b" font-family="Arial, sans-serif" font-size="23" font-weight="700">Measured average is under 40ml</text>
    <text x="134" y="637" fill="#68616e" font-family="Arial, sans-serif" font-size="17">Positive logged amounts only. Breast minutes are not converted.</text>
    <rect x="134" y="665" width="450" height="15" rx="8" fill="#e5dce7"/>
    <rect x="134" y="665" width="197" height="15" rx="8" fill="#b9705d"/>
    <line x1="331" y1="654" x2="331" y2="693" stroke="#9f553f" stroke-width="3"/>
    <text x="315" y="704" text-anchor="end" fill="#9f553f" font-family="Arial, sans-serif" font-size="14" font-weight="700">40ml threshold</text>
    <text x="591" y="679" fill="#817984" font-family="Arial, sans-serif" font-size="14">volume</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="42" y="736" width="636" height="184" rx="24" fill="url(#navy)"/>
    <text x="69" y="778" fill="#f1ca83" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">STRONGER CONTEXT CAN OVERRIDE IT</text>
    <g font-family="Arial, sans-serif" font-size="17" fill="#f8f5f9">
      <circle cx="76" cy="815" r="5" fill="#e0a271"/><text x="93" y="821">Parent tagged hunger on most wakes</text>
      <circle cx="76" cy="850" r="5" fill="#e0a271"/><text x="93" y="856">Illness, teething or a developmental disruption</text>
      <circle cx="76" cy="885" r="5" fill="#e0a271"/><text x="93" y="891">False start, split night, dawn wakes or brief stirs</text>
    </g>
  </g>

  <g transform="translate(42 945)">
    <rect width="636" height="86" rx="22" fill="#fff9ef" stroke="#ddb577" stroke-width="2"/>
    <text x="318" y="34" text-anchor="middle" fill="#8b563f" font-family="Arial, sans-serif" font-size="20" font-weight="700">A card is not permission to night-wean.</text>
    <text x="318" y="62" text-anchor="middle" fill="#665f6d" font-family="Arial, sans-serif" font-size="16">The separate plan checks age · daytime nourishment · recent nights.</text>
  </g>

  <text x="360" y="1060" text-anchor="middle" fill="#635c68" font-family="Arial, sans-serif" font-size="15">Milk and comfort can be true at the same time.</text>
</svg>
