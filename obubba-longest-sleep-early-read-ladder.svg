<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1380" viewBox="0 0 900 1380" role="img" aria-labelledby="title desc">
<title id="title">How OBubba chooses its early rhythm read</title><desc id="desc">A vertical decision ladder showing the three to twenty-five log activation window, followed by longest sleep, daytime feed gaps and wake windows in priority order.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9f4"/><stop offset="1" stop-color="#edf7f2"/></linearGradient><linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5c4a87"/><stop offset="1" stop-color="#7b68a8"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#3b2d43" flood-opacity=".12"/></filter><style>.eyebrow{font:800 17px Inter,system-ui,sans-serif;letter-spacing:2.2px;fill:#9d4e67}.title{font:700 47px Georgia,serif;fill:#2f2635}.sub{font:400 21px Inter,system-ui,sans-serif;fill:#6f6471}.step{font:800 15px Inter,system-ui,sans-serif;letter-spacing:1.5px;fill:#9d4e67}.head{font:700 29px Georgia,serif;fill:#2f2635}.body{font:400 19px Inter,system-ui,sans-serif;fill:#6f6471}.num{font:800 20px Inter,system-ui,sans-serif;fill:white}.pill{font:800 16px Inter,system-ui,sans-serif;fill:#3f6f65}.foot{font:700 20px Inter,system-ui,sans-serif;fill:white}</style></defs>
<rect width="900" height="1380" rx="38" fill="url(#bg)"/><circle cx="788" cy="108" r="78" fill="#f4d9e0" opacity=".65"/><circle cx="94" cy="1260" r="106" fill="#d9eee5" opacity=".8"/>
<text x="68" y="72" class="eyebrow">THE REAL FLUTTER ORDER</text><text x="68" y="126" class="title">One early card,</text><text x="68" y="182" class="title">chosen in sequence</text><text x="68" y="225" class="sub">The first matching observation wins.</text><text x="68" y="255" class="sub">It is a seven-day snapshot—not a score.</text>
<g filter="url(#shadow)"><rect x="68" y="306" width="764" height="160" rx="25" fill="white"/><circle cx="124" cy="360" r="28" fill="#c07088"/><text x="124" y="367" text-anchor="middle" class="num">1</text><text x="170" y="348" class="step">ACTIVATION GATE</text><text x="170" y="384" class="head">3–25 recent loggable moments</text><text x="170" y="420" class="body">Today plus the previous 6 calendar days</text><rect x="625" y="335" width="155" height="38" rx="19" fill="#e6f2ed"/><text x="703" y="360" text-anchor="middle" class="pill">outside: quiet</text></g>
<path d="M450 466v47" stroke="#b99cab" stroke-width="4"/><path d="M438 501l12 14 12-14" fill="none" stroke="#b99cab" stroke-width="4"/>
<g filter="url(#shadow)"><rect x="68" y="520" width="764" height="215" rx="25" fill="white"/><rect x="68" y="520" width="14" height="215" rx="7" fill="#74639e"/><circle cx="124" cy="574" r="28" fill="url(#night)"/><text x="124" y="581" text-anchor="middle" class="num">2</text><text x="170" y="562" class="step">FIRST PRIORITY</text><text x="170" y="600" class="head">Longest nap or sleep</text><text x="170" y="638" class="body">Complete arc • at least 2h 30m • no more than 16h</text><text x="170" y="674" class="body">The single longest qualifying duration wins.</text><rect x="170" y="690" width="230" height="38" rx="19" fill="#eee9f8"/><text x="285" y="715" text-anchor="middle" class="pill">celebrate “so far”</text></g>
<path d="M450 735v47" stroke="#b99cab" stroke-width="4"/><path d="M438 770l12 14 12-14" fill="none" stroke="#b99cab" stroke-width="4"/>
<g filter="url(#shadow)"><rect x="68" y="792" width="764" height="188" rx="25" fill="white"/><rect x="68" y="792" width="14" height="188" rx="7" fill="#c8943e"/><circle cx="124" cy="846" r="28" fill="#c8943e"/><text x="124" y="853" text-anchor="middle" class="num">3</text><text x="170" y="834" class="step">IF NONE • SECOND PRIORITY</text><text x="170" y="872" class="head">Daytime milk-feed rhythm</text><text x="170" y="910" class="body">2–4 gaps • over 30m • under 8h</text><rect x="170" y="929" width="225" height="38" rx="19" fill="#fbefda"/><text x="282" y="954" text-anchor="middle" class="pill">show early average</text></g>
<path d="M450 980v47" stroke="#b99cab" stroke-width="4"/><path d="M438 1015l12 14 12-14" fill="none" stroke="#b99cab" stroke-width="4"/>
<g filter="url(#shadow)"><rect x="68" y="1036" width="764" height="188" rx="25" fill="white"/><rect x="68" y="1036" width="14" height="188" rx="7" fill="#5f9b8e"/><circle cx="124" cy="1090" r="28" fill="#5f9b8e"/><text x="124" y="1097" text-anchor="middle" class="num">4</text><text x="170" y="1078" class="step">IF NONE • LAST FALLBACK</text><text x="170" y="1116" class="head">Daytime wake windows</text><text x="170" y="1154" class="body">At least 2 gaps • over 20m • under 6h</text><rect x="170" y="1173" width="225" height="38" rx="19" fill="#e3f2ed"/><text x="282" y="1198" text-anchor="middle" class="pill">show early average</text></g>
<g><rect x="124" y="1268" width="652" height="72" rx="24" fill="#2f2635"/><text x="450" y="1298" text-anchor="middle" class="foot">At 26 recent moments, the early card retires.</text><text x="450" y="1326" text-anchor="middle" class="body" fill="#eadfe8">Deeper predictions and trends can take over.</text></g>
</svg>
