<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba compares evening cluster feeds with the first night stretch</title>
  <desc id="desc">A five-step explainer showing the evening feed definition, night pairing, minimum samples, median comparison and thirty-minute threshold, with a warning that association is not causation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8f2"/>
      <stop offset=".55" stop-color="#f7eff3"/>
      <stop offset="1" stop-color="#eef4f1"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d334f"/>
      <stop offset="1" stop-color="#29243a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3f3549" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="860" rx="42" fill="url(#bg)"/>
  <circle cx="1075" cy="95" r="155" fill="#ca7892" opacity=".10"/>
  <circle cx="95" cy="785" r="150" fill="#7aa08c" opacity=".11"/>

  <text x="70" y="78" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800" fill="#a45d76" letter-spacing="2">FROM EVENING LOG TO INSIGHT</text>
  <text x="70" y="131" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#30283b">What “pay off” actually checks</text>
  <text x="70" y="170" font-family="Inter, Arial, sans-serif" font-size="20" fill="#6c6270">Up to 21 recent nights • medians, not averages • first stretch, not the whole night</text>

  <g filter="url(#shadow)">
    <rect x="70" y="214" width="510" height="180" rx="28" fill="#ffffff"/>
    <circle cx="128" cy="271" r="29" fill="#f3e3e9"/>
    <text x="128" y="280" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#9b526b">1</text>
    <text x="181" y="259" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#342c40">Find an evening cluster</text>
    <text x="181" y="294" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6c6372">3 logged feeds after 17:00</text>
    <text x="181" y="324" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6c6372">inside one 90-minute span</text>
    <text x="181" y="354" font-family="Inter, Arial, sans-serif" font-size="16" fill="#a45d76">Solids/night excluded • pumps currently are not</text>

    <rect x="620" y="214" width="510" height="180" rx="28" fill="#ffffff"/>
    <circle cx="678" cy="271" r="29" fill="#e6ece9"/>
    <text x="678" y="280" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#557864">2</text>
    <text x="731" y="259" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#342c40">Pair it with that night</text>
    <text x="731" y="294" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6c6372">Measure bedtime → first wake</text>
    <text x="731" y="324" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6c6372">using the canonical night analysis</text>
    <text x="731" y="354" font-family="Inter, Arial, sans-serif" font-size="17" fill="#a45d76">No recorded wake = excluded</text>
  </g>

  <path d="M580 304h40" stroke="#b89ba6" stroke-width="4" stroke-linecap="round"/>
  <path d="M611 294l12 10-12 10" fill="none" stroke="#b89ba6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="70" y="433" width="1060" height="105" rx="26" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="128" cy="486" r="29" fill="#eee7f2"/>
  <text x="128" y="495" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#745d85">3</text>
  <text x="181" y="474" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800" fill="#342c40">Wait for a real comparison</text>
  <text x="181" y="506" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6c6372">At least 3 cluster nights + 2 other nights with a measurable first wake</text>

  <g filter="url(#shadow)">
    <rect x="70" y="577" width="680" height="171" rx="28" fill="#ffffff"/>
    <circle cx="128" cy="632" r="29" fill="#f0e6da"/>
    <text x="128" y="641" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#8c6738">4</text>
    <text x="181" y="620" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800" fill="#342c40">Compare the two medians</text>
    <text x="181" y="656" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6c6372">Cluster nights: 4h 10m</text>
    <rect x="397" y="637" width="270" height="20" rx="10" fill="#ead6de"/>
    <rect x="397" y="637" width="252" height="20" rx="10" fill="#bd6d89"/>
    <text x="181" y="695" font-family="Inter, Arial, sans-serif" font-size="18" fill="#6c6372">Other nights: 2h 40m</text>
    <rect x="397" y="676" width="270" height="20" rx="10" fill="#dce9e2"/>
    <rect x="397" y="676" width="162" height="20" rx="10" fill="#709784"/>
    <text x="181" y="727" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#9b526b">Difference: +90 minutes → card can qualify</text>

    <rect x="790" y="577" width="340" height="171" rx="28" fill="url(#night)"/>
    <circle cx="848" cy="632" r="29" fill="#d8b678"/>
    <text x="848" y="641" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#30283b">5</text>
    <text x="901" y="619" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">Need ≥30m</text>
    <text x="820" y="665" font-family="Inter, Arial, sans-serif" font-size="17" fill="#e7e0ea">29 minutes: silent</text>
    <text x="820" y="697" font-family="Inter, Arial, sans-serif" font-size="17" fill="#e7e0ea">Equal or worse: silent</text>
    <text x="820" y="729" font-family="Inter, Arial, sans-serif" font-size="17" fill="#d8b678">Association ≠ cause</text>
  </g>

  <rect x="70" y="786" width="1060" height="45" rx="16" fill="#fff" opacity=".86"/>
  <text x="600" y="815" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#5e5565">The card describes this baby’s saved pattern. It never promises that an extra feed will create sleep.</text>
</svg>
