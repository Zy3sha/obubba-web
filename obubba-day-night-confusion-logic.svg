<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1080" viewBox="0 0 640 1080" role="img" aria-labelledby="title desc">
  <title id="title">How OBubba decides that a newborn's days and nights look mixed up</title>
  <desc id="desc">A vertical five-gate flow showing age two to twelve weeks, real night data, at least six hours of daytime sleep, a longest night stretch below two and a half hours, and at least three night wakes. Every gate must be true before the low-urgency insight appears.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff9f4"/><stop offset="0.54" stop-color="#f5f1ff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#272659"/><stop offset="1" stop-color="#102c4e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#34345b" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="640" height="1080" rx="38" fill="url(#bg)"/>
  <circle cx="580" cy="58" r="82" fill="#dfe7ff" opacity="0.58"/>
  <circle cx="55" cy="1018" r="110" fill="#ffe5d9" opacity="0.65"/>
  <text x="42" y="58" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="2" fill="#c45f50">THE FLUTTER DISPLAY RULE</text>
  <text x="42" y="100" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#171b35">Five gates. One gentle insight.</text>
  <text x="42" y="133" font-family="Inter,Arial,sans-serif" font-size="17" fill="#60657b">Every piece of logged evidence must be present.</text>

  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <g transform="translate(42 172)">
      <rect width="556" height="112" rx="24" fill="#fff" stroke="#edd4cc" stroke-width="2"/>
      <circle cx="55" cy="56" r="31" fill="#fff0e9"/><text x="55" y="66" text-anchor="middle" font-size="27">👶</text>
      <text x="108" y="42" font-size="14" font-weight="800" letter-spacing="1.5" fill="#bd5d50">1 · AGE GATE</text>
      <text x="108" y="77" font-size="24" font-weight="800" fill="#20243d">2–12 weeks inclusive</text>
    </g>
    <g transform="translate(42 304)">
      <rect width="556" height="112" rx="24" fill="#fff" stroke="#dad9f3" stroke-width="2"/>
      <circle cx="55" cy="56" r="31" fill="#f0efff"/><text x="55" y="66" text-anchor="middle" font-size="27">🌙</text>
      <text x="108" y="42" font-size="14" font-weight="800" letter-spacing="1.5" fill="#7262b4">2 · REAL NIGHT GATE</text>
      <text x="108" y="77" font-size="24" font-weight="800" fill="#20243d">A logged bedtime exists</text>
    </g>
    <g transform="translate(42 436)">
      <rect width="556" height="112" rx="24" fill="#fff" stroke="#e7ddbd" stroke-width="2"/>
      <circle cx="55" cy="56" r="31" fill="#fff4d9"/><text x="55" y="66" text-anchor="middle" font-size="27">☀️</text>
      <text x="108" y="42" font-size="14" font-weight="800" letter-spacing="1.5" fill="#a97824">3 · LOGGED DAY SLEEP</text>
      <text x="108" y="77" font-size="24" font-weight="800" fill="#20243d">6 hours or more</text>
    </g>
    <g transform="translate(42 568)">
      <rect width="556" height="112" rx="24" fill="#fff" stroke="#dad9f3" stroke-width="2"/>
      <circle cx="55" cy="56" r="31" fill="#efefff"/><text x="55" y="66" text-anchor="middle" font-size="27">⏱</text>
      <text x="108" y="42" font-size="14" font-weight="800" letter-spacing="1.35" fill="#7262b4">4 · LONGEST NIGHT STRETCH</text>
      <text x="108" y="77" font-size="24" font-weight="800" fill="#20243d">Under 2 hours 30 minutes</text>
    </g>
    <g transform="translate(42 700)">
      <rect width="556" height="112" rx="24" fill="#fff" stroke="#d6dfef" stroke-width="2"/>
      <circle cx="55" cy="56" r="31" fill="#e9f3ff"/><text x="55" y="66" text-anchor="middle" font-size="27">↻</text>
      <text x="108" y="42" font-size="14" font-weight="800" letter-spacing="1.5" fill="#47729d">5 · LOGGED NIGHT WAKES</text>
      <text x="108" y="77" font-size="24" font-weight="800" fill="#20243d">3 or more</text>
    </g>
  </g>

  <g stroke="#89839e" stroke-width="3" stroke-linecap="round"><path d="M320 284v20"/><path d="M320 416v20"/><path d="M320 548v20"/><path d="M320 680v20"/><path d="M320 812v35"/></g>
  <g font-family="Inter,Arial,sans-serif" font-size="11" font-weight="900" fill="#77718d"><text x="336" y="299">AND</text><text x="336" y="431">AND</text><text x="336" y="563">AND</text><text x="336" y="695">AND</text></g>
  <path d="M310 838l10 13 10-13" fill="none" stroke="#89839e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)"><rect x="42" y="856" width="556" height="158" rx="28" fill="url(#result)"/></g>
  <text x="76" y="900" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="1.7" fill="#f1bd74">LOW-URGENCY SLEEP INSIGHT · 🌗</text>
  <text x="76" y="943" font-family="Georgia,serif" font-size="25" font-weight="700" fill="#fff">“Days and nights look</text>
  <text x="76" y="975" font-family="Georgia,serif" font-size="25" font-weight="700" fill="#fff">a little mixed up”</text>
  <text x="320" y="1047" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#656a7e">One missing gate → no card. App rule, not diagnosis.</text>
</svg>
